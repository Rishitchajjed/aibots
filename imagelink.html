        .file-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .file-upload input[type='file'] {
            font-size: 100px;
            opacity: 0;
        }

        .file-upload-label {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        .file-upload-label:hover {

        }

        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-image {
            max-width: 300px;

            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .link-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .link-container input {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .link-container button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .link-container button:hover {
            background-color: #45a049;
        }
    </style>
</head><body>
<h1>Image Link Maker</h1>
<img alt="Logo" class="logo" src="https://i.ibb.co/G2NFYHG/logo.png"/>
<div class="file-upload-container">
<div class="file-upload">
<label class="file-upload-label" for="imageInput">Choose Image File</label>
<input accept="image/*" id="imageInput" type="file"/>
</div>
<div class="preview-container">
<img alt="Preview" class="preview-image" id="previewImage" src="#"/>
</div>
<div class="link-container">
<input id="imageLink" readonly="" type="text"/>
<button id="copyButton">Copy Link</button>
<button id="shortenButton">Shorten Link</button>
</div>
</div>
<script>
        const apiKey = 'd2e4bc91603c207d8b996418b42a3543';

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch('https://api.imgbb.com/1/upload?key=' + apiKey, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            return data.data.url;
        }

        function generateShortLink(url) {
            // Replace this code if you have a custom URL shortening service
            return url;
        }

        window.addEventListener('DOMContentLoaded', function() {
            var imageInput = document.getElementById('imageInput');
            var previewImage = document.getElementById('previewImage');
            var imageLink = document.getElementById('imageLink');
            var copyButton = document.getElementById('copyButton');
            var shortenButton = document.getElementById('shortenButton');

            imageInput.addEventListener('change', async function(event) {
                var file = event.target.files[0];
                var reader = new FileReader();

                reader.onload = function(event) {
                    previewImage.setAttribute('src', event.target.result);
                    imageLink.value = event.target.result;
                };

                reader.readAsDataURL(file);

                const imageUrl = await uploadImage(file);
                imageLink.value = imageUrl;
            });

            copyButton.addEventListener('click', function() {
                imageLink.select();
                document.execCommand('copy');
                alert('Image link copied to clipboard!');
            });

            shortenButton.addEventListener('click', function() {
                var longUrl = imageLink.value;
                var shortenedLink = generateShortLink(longUrl);
                imageLink.value = shortenedLink;
            });
        });
    </script>
<script src="js/common.js"></script><script>abInitChrome('imagelink');</script></body>
</html>

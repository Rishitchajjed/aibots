    }

    .ball-pill {

<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="https://i.ibb.co/G2NFYHG/logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Cricket Scorer</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-baseball-bat-ball"></i> Sports Scorer</span>
      <h1 class="tool-title">Live Cricket Match Scorer</h1>
      <p class="tool-desc">Ball-by-ball score tracking, run rate calculations, extras, and overs timeline.</p>
    </div>

    <div class="tool-card-container cric-card">
      <div class="teams-header">
        <input type="text" id="battingTeam" class="form-control" value="Team India" style="font-weight: 800; width: 160px; text-align: center;">
        <span style="font-weight: 800; color: var(--text-muted);">VS</span>
        <input type="text" id="bowlingTeam" class="form-control" value="Opponent" style="font-weight: 800; width: 160px; text-align: center;">
      </div>

      <div class="score-hero">
        <div class="score-big" id="scoreDisplay">0 / 0</div>
        <div class="overs-sub">Overs: <span id="oversDisplay">0.0</span> <span style="font-size:0.85em; font-weight:400; color:var(--text-muted);">(Max 20)</span></div>
        <div class="crr-badge">Current Run Rate (CRR): <span id="crrDisplay">0.00</span></div>
      </div>

      <!-- Over Timeline -->
      <div class="this-over-box">
        <div style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">This Over:</div>
        <div class="over-balls" id="thisOverBalls">
          <span style="color: var(--text-muted); font-size: 0.85rem;">No balls bowled yet in this over</span>
        </div>
      </div>

      <!-- Scorer Keypad -->
      <div class="keypad-grid">
        <button class="cric-btn" onclick="addScore(0)">0 (Dot)</button>
        <button class="cric-btn" onclick="addScore(1)">1</button>
        <button class="cric-btn" onclick="addScore(2)">2</button>
        <button class="cric-btn" onclick="addScore(3)">3</button>

        <button class="cric-btn cric-btn-boundary" onclick="addScore(4)">4 (Four)</button>
        <button class="cric-btn cric-btn-six" onclick="addScore(6)">6 (Six)</button>
        <button class="cric-btn cric-btn-wkt" onclick="addWicket()">W (Wicket)</button>
        <button class="cric-btn" onclick="addExtra('wide')">WD (Wide)</button>

        <button class="cric-btn" onclick="addExtra('nb')">NB (No Ball)</button>
        <button class="cric-btn" onclick="addExtra('bye')">Bye</button>
        <button class="cric-btn" onclick="addExtra('legbye')">Leg Bye</button>
        <button class="cric-btn" onclick="undoBall()" style="color: #f59e0b;"><i class="fas fa-undo"></i> Undo</button>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="resetMatch()"><i class="fas fa-rotate-right"></i> Reset Match</button>
      </div>
    </div>
  </main>

  <script>
    let runs = 0;
    let wickets = 0;
    let legalBalls = 0;
    let thisOver = [];
    let history = [];

    function addScore(r) {
      history.push({ runs, wickets, legalBalls, thisOver: [...thisOver] });
      runs += r;
      legalBalls++;
      thisOver.push({ type: r === 4 ? '4' : (r === 6 ? '6' : r.toString()), text: r });
      checkOverCompletion();
      updateUI();
    }

    function addWicket() {
      if (wickets >= 10) { alert("All Out!"); return; }
      history.push({ runs, wickets, legalBalls, thisOver: [...thisOver] });
      wickets++;
      legalBalls++;
      thisOver.push({ type: 'w', text: 'W' });
      checkOverCompletion();
      updateUI();
    }

    function addExtra(type) {
      history.push({ runs, wickets, legalBalls, thisOver: [...thisOver] });
      runs += 1;
      if (type === 'wide') {
        thisOver.push({ type: 'extra', text: 'WD' });
      } else if (type === 'nb') {
        thisOver.push({ type: 'extra', text: 'NB' });
      } else {
        legalBalls++;
        thisOver.push({ type: 'extra', text: 'B' });
        checkOverCompletion();
      }
      updateUI();
    }

    function checkOverCompletion() {
      if (legalBalls % 6 === 0 && legalBalls > 0) {
        setTimeout(() => {
          thisOver = [];
          updateUI();
        }, 1200);
      }
    }

    function undoBall() {
      if (history.length === 0) return;
      const last = history.pop();
      runs = last.runs;
      wickets = last.wickets;
      legalBalls = last.legalBalls;
      thisOver = last.thisOver;
      updateUI();
    }

    function resetMatch() {
      if (confirm("Reset current match scoreboard?")) {
        runs = 0; wickets = 0; legalBalls = 0; thisOver = []; history = [];
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('scoreDisplay').textContent = `${runs} / ${wickets}`;
      const overs = Math.floor(legalBalls / 6);
      const balls = legalBalls % 6;
      document.getElementById('oversDisplay').textContent = `${overs}.${balls}`;

      const totalOvers = (legalBalls / 6) || 0.001;
      const crr = (runs / totalOvers).toFixed(2);
      document.getElementById('crrDisplay').textContent = crr;

      const overDiv = document.getElementById('thisOverBalls');
      if (thisOver.length === 0) {
        overDiv.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem;">No balls in current over</span>';
      } else {
        overDiv.innerHTML = thisOver.map(b => {
          let cls = 'ball-pill';
          if (b.type === '4') cls += ' ball-4';
          if (b.type === '6') cls += ' ball-6';
          if (b.type === 'w') cls += ' ball-w';
          return `<div class="${cls}">${b.text}</div>`;
        }).join('');
      }
    }

    updateUI();
  </script>
  <script src="js/app.js"></script>

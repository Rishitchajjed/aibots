    <style>
/* Body styles */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(120deg, #4CAF50, #2196F3);
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
}

/* Heading */
h1 {
    font-size: 24px;
    margin-bottom: 20px;
    color: #333;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Weather widget container */
.weather-widget {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(200, 200, 255, 0.95));
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    text-align: center;
    width: 320px;
    position: relative;
    animation: backgroundAnimation 10s ease infinite alternate;
}

@keyframes backgroundAnimation {
    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 100% 50%;
    }
}

/* Border around widget */
.weather-widget:before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border: 2px solid #ddd;
    border-radius: 16px;
    z-index: -1;
}

/* Text shadow for better contrast */
.weather-widget h1,
.weather-widget label,
.weather-widget select,
.weather-widget #lastUpdated {
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
}

/* Input field for location */
.weather-widget input {
    padding: 12px;
    border: 2px solid #ccc;
    border-radius: 8px;
    width: calc(100% - 24px);
    margin-bottom: 20px;
    font-size: 16px;
    transition: border-color 0.3s ease;
}

/* Input field focus */
.weather-widget input:focus {
    outline: none;
    border-color: #66afe9;
}

/* Search button */
.weather-widget button {
    padding: 12px 24px;
    border: none;
    background-color: #4CAF50;
    color: white;
    border-radius: 20px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease, transform 0.3s ease;
}

/* Search button hover effect */
.weather-widget button:hover {
    background-color: #45a049;
    transform: scale(1.05);
}

/* Weather data */
.weather-data p {
    margin: 10px 0;
    font-size: 18px;
    color: #333;
    font-weight: bold;
    text-align: center;
}

/* Suggestions list */
#suggestions {
    border: 1px solid #ccc;
    border-top: none;
    list-style: none;
    padding: 0;
    margin: 0;
    overflow-y: auto;
    border-radius: 8px;
    box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
}

/* Suggestion item */
#suggestions li {
    padding: 10px 15px;
    cursor: pointer;
    background: #f9f9f9;
    transition: background-color 0.3s ease, transform 0.3s ease;
    border-bottom: 1px solid #ccc;
}

#suggestions li:hover {
    background: #e9e9e9;
}

#suggestions .selected {
    background-color: #d1d1d1;
}

#suggestions li {
    cursor: pointer;
}

#suggestions li:nth-child(even) {
    background-color: #f0f0f0;
}

#suggestions li:focus {
    outline: none;
    background-color: #ddeeff;
}

#suggestions li.selected {
    transform: scale(1.05);
}

/* Scrollbar Styling */
#suggestions::-webkit-scrollbar {
    width: 8px;
}

#suggestions::-webkit-scrollbar-thumb {
    background-color: #888;
    border-radius: 4px;
}

#suggestions::-webkit-scrollbar-thumb:hover {
    background-color: #666;
}

#suggestions::-webkit-scrollbar-track {
    background-color: #f0f0f0;
}

/* Weather icon */
.weather-icon {
    font-size: 72px; /* Large font size for emphasis */
    margin: 24px 0; /* Vertical spacing */
    color: #777; /* Fallback color */
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Enhanced text shadow for better depth */
    background: linear-gradient(135deg, #4CAF50, #2196F3); /* Gradient background */
    -webkit-background-clip: text; /* Clip the background to the text */
    color: transparent; /* Make the text itself transparent */
    transition: transform 0.3s ease, text-shadow 0.3s ease; /* Smooth transition for transform and text shadow */
    animation: gradientAnimation 5s infinite,  borderGlow 5s infinite; /* Animate gradient background and add rotation */
}
@keyframes borderGlow {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.1);
    }
    100% {
        transform: scale(1);
    }
}
/* Gradient animation */
@keyframes gradientAnimation {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}



/* Hover effect */
.weather-icon:hover {
    transform: scale(1.2); /* Scale up on hover */
    text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.7); /* Add a glowing effect on hover */
}
/* Last updated time */
#lastUpdated {
    margin-top: 20px;
    font-size: 14px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.8;
}

/* Container for label and select */
div.unit-container {
    margin-bottom: 20px;
}

/* Label */
.unit-label {
    font-size: 16px;
    color: #555;
    font-weight: bold;
    margin-right: 10px;
}

/* Select */
#unitSelect {
    font-size: 16px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #fff;
    color: #333;
}

/* Customizing select dropdown arrow */
#unitSelect::-ms-expand {
    display: none;
}

#unitSelect::-webkit-scrollbar {
    width: 8px;
}

#unitSelect::-webkit-scrollbar-thumb {
    background-color: #888;
    border-radius: 4px;
}

#unitSelect::-webkit-scrollbar-thumb:hover {
    background-color: #666;
}

#unitSelect::-webkit-scrollbar-track {
    background-color: #f0f0f0;
}

/* Image styling */
#weatherImage {
    max-width: 100%;
    margin-top: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
}

#weatherImage:hover {
    transform: scale(1.05);
}

/* Logo styling */
.logo img {
    max-width: 150px;
    height: auto;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
    animation: floatAnimation 5s infinite ease-in-out alternate, rotateAnimation 4s infinite linear, pulseAnimation 3s infinite, shimmerAnimation 3s infinite;
}

/* Logo hover effect */
.logo img:hover {
    transform: scale(1.1);
}

/* Floating animation */
@keyframes floatAnimation {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-20px);
    }
}

/* Rotating animation */
@keyframes rotateAnimation {
    0% {
        transform: rotate(0);
    }
    100% {
        transform: rotate(360deg);
    }
}

/* Pulsating animation */
@keyframes pulseAnimation {
    0%, 100% {
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
    }
    50% {
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
    }
}

/* Shimmering animation */
@keyframes shimmerAnimation {
    0% {
        filter: hue-rotate(0deg);
    }
    100% {
        filter: hue-rotate(360deg);
    }
}
/* Temperature paragraph styling */
#temperature {
    background: linear-gradient(45deg, #ffcc33, #ff6600); /* Gradient background for highlighting */
    padding: 15px; /* Add padding for space around the text */
    border-radius: 10px; /* Rounded corners */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Add shadow for depth */
    color: white; /* White text color for contrast */

    text-align: center; /* Center-align the text */
    margin: 20px 0; /* Add margin for spacing around the element */

/* Hover effect */
#temperature:hover {
    transform: scale(1.05); /* Slightly increase size on hover */
    background-color: #ff9933; /* Change background color on hover */
}

   <script>
const weatherApiKey = 'b40c34fcc63390d19e8ecd2d90d5d7ab';

document.getElementById('locationInput').addEventListener('input', function() {
    const query = this.value;
    if (query.length > 2) {
        fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json&addressdetails=1`)
            .then(response => response.json())
            .then(data => {
                const suggestions = data.map(result => ({
                    displayName: result.display_name,
                    lat: result.lat,
                    lon: result.lon
                }));
                showSuggestions(suggestions);
            });
    } else {
        clearSuggestions();
    }
});

document.getElementById('getWeatherBtn').addEventListener('click', function() {
    const location = document.getElementById('locationInput').value;
    getWeather(location);
});

document.getElementById('unitSelect').addEventListener('change', function() {
    const location = document.getElementById('locationInput').value;
    getWeather(location);
});

function showSuggestions(suggestions) {
    const suggestionsList = document.getElementById('suggestions');
    suggestionsList.innerHTML = '';
    suggestions.forEach(suggestion => {
        const li = document.createElement('li');
        li.textContent = suggestion.displayName;
        li.addEventListener('click', function() {
            document.getElementById('locationInput').value = suggestion.displayName;
            getWeatherByCoordinates(suggestion.lat, suggestion.lon);
            clearSuggestions();
        });
        suggestionsList.appendChild(li);
    });
}

function clearSuggestions() {
    document.getElementById('suggestions').innerHTML = '';
}

function getWeather(location) {
    fetch(`https://nominatim.openstreetmap.org/search?q=${location}&format=json&addressdetails=1`)
        .then(response => response.json())
        .then(data => {
            if (data.length > 0) {
                const { lat, lon } = data[0];
                getWeatherByCoordinates(lat, lon);
            } else {
                alert('Location not found. Please enter a valid location.');
            }
        });
}

function getWeatherByCoordinates(lat, lon) {
    const unit = document.getElementById('unitSelect').value;
    const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${weatherApiKey}&units=${unit}`;

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            if (data.cod === 200) {
                document.getElementById('location').textContent = `Location: ${data.name}, ${data.sys.country}`;
                document.getElementById('temperature').textContent = `Temperature: ${data.main.temp} °${unit === 'metric' ? 'C' : 'F'}`;
                document.getElementById('humidity').textContent = `Humidity: ${data.main.humidity} %`;
                document.getElementById('conditions').textContent = `Conditions: ${data.weather[0].description}`;
                document.getElementById('windSpeed').textContent = `Wind Speed: ${data.wind.speed} m/s`;
                document.getElementById('sunrise').textContent = `Sunrise: ${new Date(data.sys.sunrise * 1000).toLocaleTimeString()}`;
                document.getElementById('sunset').textContent = `Sunset: ${new Date(data.sys.sunset * 1000).toLocaleTimeString()}`;
                updateLastUpdatedTime();
                const weatherIcon = getWeatherIcon(data.weather[0].icon);
                document.getElementById('weatherIcon').className = `weather-icon fas fa-${weatherIcon}`;
                document.getElementById('weatherImage').src = getWeatherImage(weatherIcon);
                updateBackground(weatherIcon);
            } else {
                alert('Weather data not found. Please try another location.');
            }
        })
        .catch(error => {
            console.error('Error fetching weather data:', error);
            alert('An error occurred while fetching weather data.');
        });
}

function getWeatherIcon(iconCode) {
    switch (iconCode) {
        case '01d':
            return 'sun';
        case '01n':
            return 'moon';
        case '02d':
        case '02n':
            return 'cloud-sun';
        case '03d':
        case '03n':
            return 'cloud';
        case '04d':
        case '04n':
            return 'cloud';
        case '09d':
        case '09n':
            return 'cloud-showers-heavy';
        case '10d':
        case '10n':
            return 'cloud-rain';
        case '11d':
        case '11n':
            return 'bolt';
        case '13d':
        case '13n':
            return 'snowflake';
        case '50d':
        case '50n':
            return 'smog';
        default:
            return 'question';
    }
}

}

function updateLastUpdatedTime() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const lastUpdatedTime = `Last updated: ${hours}:${minutes}`;
    document.getElementById('lastUpdated').textContent = lastUpdatedTime;
}

function getCurrentLocationWeather() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            getWeatherByCoordinates(lat, lon);
        }, error => {
            console.error('Error getting location:', error);
            alert('An error occurred while fetching your current location.');
        });
    } else {
        alert('Geolocation is not supported by this browser.');
    }
}

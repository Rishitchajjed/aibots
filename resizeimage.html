  <style>
    .rs-container {
      max-width: 1040px;
      margin: 30px auto 80px;
      padding: 0 16px;
    }
    .rs-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .rs-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .rs-dropzone {
      border: 2.5px dashed var(--primary, #06b6d4);
      border-radius: 18px;
      padding: 44px 20px;
      text-align: center;
      background: var(--bg-secondary, #1e293b);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .rs-dropzone:hover {
      background: color-mix(in srgb, var(--primary, #06b6d4) 10%, var(--bg-secondary));
    }
    .rs-dropzone i { font-size: 3rem; color: #06b6d4; margin-bottom: 10px; display: block; }
    .rs-dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* Main Workspace */
    .rs-workspace {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      margin-top: 28px;
    }
    @media (max-width: 840px) {
      .rs-workspace { grid-template-columns: 1fr; }
    }

    .rs-panel {
      background: var(--bg-secondary, #1e293b);
      border: 1px solid var(--border-color, rgba(255,255,255,0.1));
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .rs-panel h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
    }
    .rs-preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .rs-chip {
      background: var(--bg-primary, #0f172a);
      border: 1px solid var(--border-color, rgba(255,255,255,0.1));
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary, #94a3b8);
      cursor: pointer;
      transition: all 0.15s;
    }
    .rs-chip:hover, .rs-chip.active {
      border-color: #06b6d4;
      color: #38bdf8;
      background: rgba(6, 182, 212, 0.1);
    }

    .rs-preview-card {
      background: var(--bg-secondary, #1e293b);
      border: 1px solid var(--border-color, rgba(255,255,255,0.1));
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 380px;
      position: relative;
    }
    .rs-img-preview-box {
      max-width: 100%;
      max-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 50% / 20px 20px;
      border: 1px solid var(--border-color);
    }
    .rs-img-preview-box img {
      max-width: 100%;
      max-height: 440px;
      object-fit: contain;
      display: block;
    }
    .rs-meta-pill {
      display: inline-flex;
      gap: 12px;
      padding: 6px 14px;
      background: var(--bg-primary);
      border-radius: 999px;
      border: 1px solid var(--border-color);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="rs-container">
    <div class="rs-header">
      <h1 class="rs-title"><i class="fas fa-expand"></i> Smart Image Resizer</h1>
      <p style="margin: 0; color: var(--text-secondary); font-size: 0.95rem;">
        Resize, convert, and optimize images pixel-perfect for social media, print, or web.
      </p>
    </div>

    <!-- Upload Dropzone -->
    <div class="rs-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
      <i class="fas fa-cloud-arrow-up"></i>
      <h3 style="margin: 0 0 6px;">Choose or Drop an Image</h3>
      <p style="margin: 0; color: var(--text-secondary); font-size: 0.85rem;">Supports JPG, PNG, WebP, GIF, SVG, BMP</p>
    </div>

    <!-- Workspace -->
    <div class="rs-workspace" id="workspace" style="display: none;">
      <!-- Controls -->
      <div class="rs-panel">
        <h3><i class="fas fa-sliders"></i> Resize Settings</h3>

        <!-- Dimensions -->
        <div style="display: flex; gap: 10px; align-items: flex-end;">
          <div style="flex: 1;">
            <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary);">WIDTH (PX)</label>
            <input type="number" id="widthInput" class="ab-input" style="margin-top: 4px;" oninput="onWidthChange()">
          </div>
          <button class="ab-btn" id="aspectBtn" style="padding: 10px; margin-bottom: 2px;" onclick="toggleAspect()" title="Lock/Unlock Aspect Ratio">
            <i class="fas fa-link" id="aspectIcon"></i>
          </button>
          <div style="flex: 1;">
            <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary);">HEIGHT (PX)</label>
            <input type="number" id="heightInput" class="ab-input" style="margin-top: 4px;" oninput="onHeightChange()">
          </div>
        </div>

        <!-- Scale Percent -->
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">
            <span>SCALE PERCENTAGE</span>
            <span id="scaleVal" style="color: #38bdf8;">100%</span>
          </div>
          <input type="range" id="scaleSlider" min="10" max="200" value="100" class="slider" style="width: 100%;" oninput="onScaleChange()">
        </div>

        <!-- Preset Chips -->
        <div>
          <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 8px;">POPULAR PRESETS</label>
          <div class="rs-preset-chips">
            <button class="rs-chip" onclick="applyPreset(1080, 1080)">IG Post (1080x1080)</button>
            <button class="rs-chip" onclick="applyPreset(1080, 1920)">Story / Reel (1080x1920)</button>
            <button class="rs-chip" onclick="applyPreset(1280, 720)">YouTube (1280x720)</button>
            <button class="rs-chip" onclick="applyPreset(1500, 500)">Twitter / X (1500x500)</button>
            <button class="rs-chip" onclick="applyPreset(600, 600)">Passport (600x600)</button>
            <button class="rs-chip" onclick="applyPreset(1920, 1080)">Full HD (1920x1080)</button>
          </div>
        </div>

        <!-- Output Format & Quality -->
        <div>
          <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">OUTPUT FORMAT</label>
          <select id="formatSelect" class="ab-select">
            <option value="image/jpeg">JPEG (.jpg)</option>
            <option value="image/png">PNG (.png)</option>
            <option value="image/webp">WebP (.webp)</option>
          </select>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">
            <span>IMAGE QUALITY</span>
            <span id="qualityVal" style="color: #38bdf8;">92%</span>
          </div>
          <input type="range" id="qualitySlider" min="20" max="100" value="92" class="slider" style="width: 100%;" oninput="document.getElementById('qualityVal').textContent = this.value + '%'">
        </div>

        <!-- Actions -->
        <button class="ab-btn" style="background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; width: 100%; padding: 12px; font-weight: 700; font-size: 0.95rem;" onclick="downloadResized()">
          <i class="fas fa-download"></i> Download Resized Image
        </button>
      </div>

      <!-- Preview Area -->
      <div class="rs-preview-card">
        <div class="rs-img-preview-box">
          <img id="previewImg" src="" alt="Resized Preview">
        </div>
        <div class="rs-meta-pill">
          <span>Original: <strong id="origSizeText">0 x 0</strong></span>
          <span>Target: <strong id="targetSizeText" style="color: #38bdf8;">0 x 0</strong></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let origImage = null;
    let origWidth = 0;
    let origHeight = 0;
    let lockAspect = true;

    function handleImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            origImage = img;
            origWidth = img.naturalWidth;
            origHeight = img.naturalHeight;
            
            document.getElementById('widthInput').value = origWidth;
            document.getElementById('heightInput').value = origHeight;
            document.getElementById('origSizeText').textContent = `${origWidth} × ${origHeight}`;
            document.getElementById('targetSizeText').textContent = `${origWidth} × ${origHeight}`;
            document.getElementById('previewImg').src = ev.target.result;
            
            document.getElementById('workspace').style.display = 'grid';
            document.getElementById('dropzone').style.display = 'none';
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function toggleAspect() {
      lockAspect = !lockAspect;
      const icon = document.getElementById('aspectIcon');
      icon.className = lockAspect ? 'fas fa-link' : 'fas fa-link-slash';
      document.getElementById('aspectBtn').style.opacity = lockAspect ? '1' : '0.5';
    }

    function onWidthChange() {
      const w = parseInt(document.getElementById('widthInput').value) || 1;
      if (lockAspect && origWidth > 0) {
        const h = Math.round(w * (origHeight / origWidth));
        document.getElementById('heightInput').value = h;
      }
      updateTargetDisplay();
    }

    function onHeightChange() {
      const h = parseInt(document.getElementById('heightInput').value) || 1;
      if (lockAspect && origHeight > 0) {
        const w = Math.round(h * (origWidth / origHeight));
        document.getElementById('widthInput').value = w;
      }
      updateTargetDisplay();
    }

    function onScaleChange() {
      const pct = parseInt(document.getElementById('scaleSlider').value) || 100;
      document.getElementById('scaleVal').textContent = `${pct}%`;
      const w = Math.round(origWidth * (pct / 100));
      const h = Math.round(origHeight * (pct / 100));
      document.getElementById('widthInput').value = w;
      document.getElementById('heightInput').value = h;
      updateTargetDisplay();
    }

    function applyPreset(w, h) {
      document.getElementById('widthInput').value = w;
      document.getElementById('heightInput').value = h;
      updateTargetDisplay();
    }

    function updateTargetDisplay() {
      const w = document.getElementById('widthInput').value;
      const h = document.getElementById('heightInput').value;
      document.getElementById('targetSizeText').textContent = `${w} × ${h}`;
    }

    function downloadResized() {
      if (!origImage) return;
      const targetW = parseInt(document.getElementById('widthInput').value) || origWidth;
      const targetH = parseInt(document.getElementById('heightInput').value) || origHeight;
      const format = document.getElementById('formatSelect').value;
      const quality = (parseInt(document.getElementById('qualitySlider').value) || 92) / 100;

      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(origImage, 0, 0, targetW, targetH);

      const ext = format === 'image/png' ? 'png' : (format === 'image/webp' ? 'webp' : 'jpg');
      const dataUrl = canvas.toDataURL(format, quality);

      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `resized_${targetW}x${targetH}.${ext}`;
      a.click();
    }
  </script>

  <script src="js/common.js"></script>
  <script>abInitChrome('resizeimage');</script>
</body>

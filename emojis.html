    /* Fonts */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

/* Body */
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f9f9f9;
  color: #333;
  overflow-x: hidden; /* Prevent horizontal scrolling */
}

/* Header */
.header {
  background-color: #4CAF50;
  padding: 20px 0;
  text-align: center;
}

.header h1 {
  font-size: 36px;
  font-weight: 700;
  color: #fff;
}

/* Logo */
.logo {
  display: block;
  margin: 0 auto;
  width: 120px; /* Adjust size as needed */
  margin-bottom: 20px;
}

/* Container */
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
  background-color: #fff;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
}

/* Search Input */
.search-input {
  padding: 15px;
  width: calc(100% - 30px);
  margin: 0 auto 30px auto;
  border: 2px solid #4CAF50;
  border-radius: 30px;
  box-sizing: border-box;
  font-size: 18px;
  outline: none;
  transition: border-color 0.3s;
}

.search-input:focus {
  border-color: #45a049;
}

/* Emoji List */
.emoji-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  background-color: #f9f9f9;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
}

/* Emoji Item */
.emoji-item {
  margin: 20px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
  border-radius: 10px;
  overflow: hidden;
}

/* Add hover effect on emoji item */
.emoji-item:hover {
  transform: translateY(-5px); /* Lift the emoji item on hover */
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* Add shadow on hover */
}

/* Adjust hover effect for active emoji item */
.emoji-item.active {
  transform: translateY(-10px); /* Lift more for active emoji item */
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); /* More shadow for active emoji item */
}

/* Emoji Image */
.emoji-image {
  width: 100px; /* Adjust width as needed */
  height: auto;
}

/* Emoji Label */
.emoji-label {
  text-align: center;
  margin-top: 10px;
  font-size: 16px;
  color: #333;
}

/* Emoji Categories */
.emoji-categories {
  margin-bottom: 20px;
  display: flex;
  justify-content: center;
}

.emoji-category {
  cursor: pointer;
  padding: 15px 25px;
  border-radius: 20px;
  background-color: #f0f0f0;
  margin-right: 15px;
  font-size: 16px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #333;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  transform-origin: center;
}

.emoji-category.active {
  background-color: #4CAF50;
  color: #fff;
  transform: scale(1.1);
  box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.3);
}

/* Add hover effect for better user interaction */
.emoji-category:hover {
  background-color: #ccc;
}

/* Add animation for entry */
@keyframes slideIn {
  0% {
    opacity: 0;
    transform: translateY(-30px) scale(0.9);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.emoji-category {
  animation: slideIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
}

/* Add pulse animation when category is active */
@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
  100% {
    transform: scale(1);
  }
}

.emoji-category.active {
  animation: pulse 1s infinite alternate;
}

.emoji-item:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
}

/* Emoji */
.emoji {
  font-size: 48px;
  cursor: pointer;
}

/* Full Screen Container */
.full-screen-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* Full Screen Emoji */
.full-screen-emoji {
  font-size: 200px;
  color: #fff;
  animation: bounce 0.8s ease forwards, rotate 2s linear infinite;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(-20px);
  }
  50% {
    transform: translateY(20px);
  }
}

@keyframes rotate {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

/* Full Screen Options */
.full-screen-options {
  margin-top: 40px;
}

.full-screen-options button {
  padding: 20px 40px;
  margin: 0 20px;
  font-size: 20px;
  border-radius: 10px;
  background-color: #4CAF50;
  color: #fff;
  cursor: pointer;
  border: none;
  outline: none;
  transition: background-color 0.3s, transform 0.2s;
}

.full-screen-options button:hover {
  background-color: #45a049;
  transform: translateY(-3px) rotate(-5deg);
}

.full-screen-options button:active {
  transform: translateY(0);
}
 /* Navigation Arrows */
    .emoji-prev,
    .emoji-next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .emoji-prev:hover,
    .emoji-next:hover {
      background-color: rgba(255, 255, 255, 1);
    }

    .emoji-prev {
      left: 10px;
    }

    .emoji-next {
      right: 10px;
    }
    /* Emoji Categories */
.emoji-slider {
  position: relative;
  overflow: hidden;
  margin-bottom: 20px;
  width: 100%;
  max-width: 800px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
}

/* Add gradient background for a sleek look */
.emoji-slider::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #4CAF50, #2E8B57);
  z-index: -1;
  border-radius: 20px;
}

/* Track for emoji slides */
.emoji-slide-track {
  display: flex;
  transition: transform 0.5s ease;
  padding: 10px; /* Add padding to adjust for slide padding */
}

/* Individual emoji slide */
.emoji-slide {
  flex: 0 0 100%;
  padding: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  color: white;
  border-radius: 10px;
  background-color: rgba(255, 255, 255, 0.1); /* Add transparent background */
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); /* Add shadow for depth */
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Hover effect on emoji slides */
.emoji-slide:hover {
  transform: translateY(-5px); /* Add slight lift on hover */
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); /* Enhance shadow on hover */
}

/* Adjust hover effect for active slide */
.emoji-slide.active {
  transform: translateY(-10px); /* Lift more for active slide */
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6); /* More shadow for active slide */
}

    // Function to display emojis
    function displayEmojis(emojiArray) {
      const emojiList = document.getElementById("emojiList");
      emojiList.innerHTML = "";
      emojiArray.forEach(emoji => {
        const li = document.createElement("li");
        li.classList.add("emoji-item");
        li.innerHTML = `<span class="emoji" onclick="showEmojiFullScreen('${emoji.icon}')">${emoji.icon}</span>`;
        emojiList.appendChild(li);
      });
    }

   // Function for fuzzy search
function fuzzySearch(needle, haystack) {
  const regex = new RegExp(needle.split('').join('.*?'), 'gi');
  return haystack.match(regex);
}

// Function to filter emojis based on search query
function filterEmojis(query) {
  const filteredEmojis = emojis.filter(emoji => {
    return fuzzySearch(query.toLowerCase(), emoji.name.toLowerCase());
  });
  displayEmojis(filteredEmojis);
}

// Event listener for search input
document.getElementById("search").addEventListener("input", function() {
  const query = this.value.trim(); // Trim to remove leading and trailing spaces
  if (query.length > 0) {
    filterEmojis(query);
  } else {
    displayEmojis(emojis); // If search query is empty, show all emojis
  }
});

    // Function to copy emoji to clipboard
    function copyEmoji(emoji) {
      navigator.clipboard.writeText(emoji)
        .then(() => alert("Emoji copied to clipboard!"))
        .catch(err => console.error("Failed to copy:", err));
    }

    // Function to show emoji in full-screen
    function showEmojiFullScreen(emoji) {
      const fullScreenContainer = document.createElement("div");
      fullScreenContainer.classList.add("full-screen-container");
      const fontSize = 120; // Adjust as needed
      fullScreenContainer.innerHTML = `
        <div class="full-screen-emoji">${emoji}</div>
        <div class="full-screen-options">
          <button onclick="copyEmoji('${emoji}')">Copy</button>
          <button onclick="downloadEmoji('${emoji}', ${fontSize})">Download</button>
          <button onclick="closeFullScreen()">Close</button>
        </div>`;
      document.body.appendChild(fullScreenContainer);
    }

    // Function to close full-screen view
    function closeFullScreen() {
      const fullScreenContainer = document.querySelector(".full-screen-container");
      if (fullScreenContainer) {
        fullScreenContainer.remove();
      }
    }

    // Function to download emoji as image
    function downloadEmoji(emoji, fontSize) {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const canvasSize = fontSize * 1.5; // Adjust as needed
      canvas.width = canvasSize;
      canvas.height = canvasSize;
      context.font = `${fontSize}px Arial`;
      context.fillText(emoji, 0, fontSize);
      const dataURL = canvas.toDataURL();
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = 'emoji.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Function to filter emojis by category
    function filterByCategory(category) {
      const filteredEmojis = category === 'all' ? emojis : emojis.filter(emoji => emoji.category === category);
      displayEmojis(filteredEmojis);
      toggleActiveCategory(category);
    }

    // Function to toggle active category
    function toggleActiveCategory(category) {
      const categories = document.querySelectorAll('.emoji-category');
      categories.forEach(cat => {
        if (cat.textContent.toLowerCase() === category) {
          cat.classList.add('active');
        } else {
          cat.classList.remove('active');
        }
      });
    }

    // Slide Navigation
    let slideIndex = 0;

    function nextSlide() {
      const slides = document.querySelectorAll('.emoji-slide');
      slideIndex = (slideIndex + 1) % slides.length;
      showSlides();
    }

    function prevSlide() {
      const slides = document.querySelectorAll('.emoji-slide');
      slideIndex = (slideIndex - 1 + slides.length) % slides.length;
      showSlides();
    }

    function showSlides() {
      const slides = document.querySelectorAll('.emoji-slide');
      slides.forEach((slide, index) => {
        if (index === slideIndex) {
          slide.style.display = "block";
        } else {
          slide.style.display = "none";
        }
      });
    }

    // Initial display of all emojis
    displayEmojis(emojis);

    // Event listener for search input
    document.getElementById("search").addEventListener("input", function() {
      filterEmojis(this.value);
    });

<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — AI Bots</title>
<meta name="description" content="Current conditions and a 5-day forecast for any city, or your current location.">
<link rel="icon" href="https://i.ibb.co/XjHbck3/logo.png" type="image/png">
<link rel="stylesheet" href="css/theme.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-2L87FMQS3W');</script>
<style>
  .wx-search{ position:relative; max-width:520px; margin:0 auto; }
  .wx-suggest{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow); overflow:hidden; z-index:20;
  }
  .wx-suggest button{
    display:block; width:100%; text-align:left; padding:10px 14px; border:none; background:none;
    cursor:pointer; font-size:14px; color:var(--ink);
  }
  .wx-suggest button:hover{ background:var(--accent-soft); }

  .wx-hero{
    margin-top:24px; text-align:center; padding:32px 20px; border-radius:var(--radius-lg);
    background: linear-gradient(160deg, var(--accent-soft), var(--surface));
    border:1px solid var(--border);
  }
  .wx-place{ font-family: var(--font-display); font-size:20px; font-weight:600; }
  .wx-temp{ font-family:var(--font-mono); font-size:clamp(48px,10vw,72px); font-weight:700; line-height:1; margin:10px 0 6px; }
  .wx-desc{ color:var(--ink-soft); font-size:15px; }
  .wx-icon{ font-size:54px; }

  .wx-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; max-width:640px; margin:22px auto 0; }
  .wx-stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; text-align:center; }
  .wx-stat .v{ font-family:var(--font-mono); font-weight:700; font-size:18px; }
  .wx-stat .l{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .wx-days{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:10px; max-width:760px; margin:26px auto 0; }
  .wx-day{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 8px; text-align:center; }
  .wx-day .d{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .wx-day .i{ font-size:26px; margin:6px 0; }
  .wx-day .t{ font-family:var(--font-mono); font-size:13px; }
  .wx-day .t .max{ font-weight:700; }
  .wx-day .t .min{ color:var(--muted); }
</style>
</head>
<body>
<div class="ab-shell">
  <div class="ab-page-head">
    <h1>⛅ Weather</h1>
    <p>Search any city for current conditions and a 5-day outlook — no sign-up, no API key needed.</p>
  </div>

  <div class="wx-search">
    <div class="ab-row" style="flex-wrap:nowrap;">
      <input type="text" id="cityInput" class="ab-input" placeholder="Search for a city…" autocomplete="off">
      <button class="ab-btn secondary" id="locBtn" title="Use my location">📍</button>
    </div>
    <div class="wx-suggest ab-hidden" id="suggestBox"></div>
  </div>

  <div id="wxContent"></div>
</div>

<script src="js/common.js"></script>
<script>
abInitChrome('weather');

const cityInput = document.getElementById('cityInput');
const suggestBox = document.getElementById('suggestBox');
const wxContent = document.getElementById('wxContent');
const locBtn = document.getElementById('locBtn');

const WMO = {
  0:['☀️','Clear sky'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],
  45:['🌫️','Fog'],48:['🌫️','Depositing rime fog'],
  51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Dense drizzle'],
  61:['🌧️','Slight rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],
  71:['🌨️','Slight snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],
  80:['🌦️','Rain showers'],81:['🌧️','Rain showers'],82:['⛈️','Violent showers'],
  95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm w/ hail'],99:['⛈️','Severe thunderstorm']
};
const wmo = c => WMO[c] || ['🌡️','Unknown'];

let searchTimer;
cityInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const q = cityInput.value.trim();
  if (q.length < 2){ suggestBox.classList.add('ab-hidden'); return; }
  searchTimer = setTimeout(()=> searchCity(q), 300);
});

async function searchCity(q){
  try{
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
    const data = await res.json();
    if (!data.results || !data.results.length){ suggestBox.classList.add('ab-hidden'); return; }
    suggestBox.innerHTML = '';
    data.results.forEach(r=>{
      const btn = document.createElement('button');
      const region = [r.admin1, r.country].filter(Boolean).join(', ');
      btn.textContent = `${r.name}${region ? ', ' + region : ''}`;
      btn.addEventListener('click', ()=>{
        cityInput.value = btn.textContent;
        suggestBox.classList.add('ab-hidden');
        loadWeather(r.latitude, r.longitude, btn.textContent);
      });
      suggestBox.appendChild(btn);
    });
    suggestBox.classList.remove('ab-hidden');
  }catch(e){ suggestBox.classList.add('ab-hidden'); }
}

document.addEventListener('click', (e)=>{
  if (!e.target.closest('.wx-search')) suggestBox.classList.add('ab-hidden');
});

locBtn.addEventListener('click', ()=>{
  if (!navigator.geolocation){ abToast('Location not supported by your browser'); return; }
  locBtn.textContent = '…';
  navigator.geolocation.getCurrentPosition(
    async pos=>{
      locBtn.textContent = '📍';
      const { latitude, longitude } = pos.coords;
      cityInput.value = 'My location';
      loadWeather(latitude, longitude, 'My location');
    },
    ()=>{ locBtn.textContent = '📍'; abToast('Could not get your location'); }
  );
});

async function loadWeather(lat, lon, label){
  wxContent.innerHTML = `<div class="ab-empty">Loading weather…</div>`;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`;
    const res = await fetch(url);
    const data = await res.json();
    render(data, label);
  }catch(e){
    wxContent.innerHTML = `<div class="ab-empty">Couldn't load weather right now. Please try again.</div>`;
  }
}

function render(data, label){
  const cur = data.current;
  const [icon, desc] = wmo(cur.weather_code);
  const days = data.daily.time.slice(1);

  wxContent.innerHTML = `
    <div class="wx-hero">
      <div class="wx-place">${label}</div>
      <div class="wx-icon">${icon}</div>
      <div class="wx-temp">${Math.round(cur.temperature_2m)}°C</div>
      <div class="wx-desc">${desc} · Feels like ${Math.round(cur.apparent_temperature)}°C</div>
    </div>
    <div class="wx-stats">
      <div class="wx-stat"><div class="v">${cur.relative_humidity_2m}%</div><div class="l">Humidity</div></div>
      <div class="wx-stat"><div class="v">${cur.wind_speed_10m} km/h</div><div class="l">Wind</div></div>
      <div class="wx-stat"><div class="v">${cur.precipitation} mm</div><div class="l">Precip</div></div>
    </div>
    <div class="wx-days">
      ${days.map((d,i)=>{
        const [ic] = wmo(data.daily.weather_code[i+1]);
        const dayName = new Date(d).toLocaleDateString(undefined,{ weekday:'short' });
        return `<div class="wx-day">
          <div class="d">${dayName}</div>
          <div class="i">${ic}</div>
          <div class="t"><span class="max">${Math.round(data.daily.temperature_2m_max[i+1])}°</span> / <span class="min">${Math.round(data.daily.temperature_2m_min[i+1])}°</span></div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// default: try geolocation, fall back to a default city
if (navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    pos => { cityInput.value = 'My location'; loadWeather(pos.coords.latitude, pos.coords.longitude, 'My location'); },
    () => loadWeather(28.6139, 77.2090, 'New Delhi, India')
  );
} else {
  loadWeather(28.6139, 77.2090, 'New Delhi, India');
}
</script>
</body>
</html>

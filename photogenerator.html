  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="logo.png" type="image/png">
  <title>Photo & Image Generator - AI Bots</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      margin: 24px 0;
    }
    .photo-card {
      position: relative;
      aspect-ratio: 4/3;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--transition);
      background: var(--bg-tertiary);
    }
    .photo-card:hover {
      transform: scale(1.03);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .quick-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 14px;
    }
    .chip-btn {
      padding: 4px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .chip-btn:hover {
      background: var(--primary-light);
      color: var(--primary-text);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Photo Search</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-image"></i> Unsplash API</span>
      <h1 class="tool-title">Photo & Image Generator</h1>
      <p class="tool-desc">Search and discover millions of high-resolution, copyright-free stock photos and inspiration.</p>
    </div>

    <div class="tool-card-container">
      
      <!-- Search Box -->
      <form onsubmit="event.preventDefault(); searchImages();" style="display: flex; gap: 10px;">
        <input type="text" id="search-input" class="form-control" placeholder="Search keywords (e.g. Cyberpunk, Mountain, Minimal, Nature)..." value="Futuristic AI">
        <button type="submit" class="btn btn-primary" style="padding: 0 24px;">
          <i class="fas fa-magnifying-glass"></i> Search
        </button>
      </form>

      <!-- Quick Topic Chips -->
      <div class="quick-chips">
        <button type="button" class="chip-btn" onclick="quickSearch('Abstract Art')">Abstract Art</button>
        <button type="button" class="chip-btn" onclick="quickSearch('Cyberpunk City')">Cyberpunk</button>
        <button type="button" class="chip-btn" onclick="quickSearch('Nature Forest')">Nature</button>
        <button type="button" class="chip-btn" onclick="quickSearch('Technology')">Technology</button>
        <button type="button" class="chip-btn" onclick="quickSearch('Minimal Workspace')">Minimal</button>
        <button type="button" class="chip-btn" onclick="quickSearch('Space Nebula')">Space</button>
      </div>

      <!-- Photo Results Grid -->
      <div class="photos-grid" id="photosContainer"></div>

      <!-- Selected Photo Preview & Download -->
      <div class="selected-photo" id="selectedPhotoSection" style="display: none; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border-color); text-align: center;">
        <label class="form-label" style="font-size: 1.1rem; margin-bottom: 16px;">
          <i class="fas fa-circle-check" style="color: var(--success);"></i> Selected High-Resolution Photo
        </label>
        
        <div class="preview-box">
          <img id="selected-image" src="" alt="Selected Photo">
        </div>

        <button onclick="downloadSelectedPhoto()" class="btn btn-success btn-lg" style="margin-top: 16px;">
          <i class="fas fa-download"></i> Download Full Image (JPG)
        </button>
      </div>

    </div>
  </main>

  <footer class="app-footer">
    <div class="app-container">
      <p class="footer-text">&copy; 2026 AI Bots. All rights reserved.</p>
      <p class="footer-credits">Website designed by <strong>Rishit Chajjed</strong>.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    let selectedPhotoUrl = '';
    const accessKey = "krm0d7mqv3OwJofRKwJsq51uFx9I5wJplmquliNSEVE";

    function quickSearch(query) {
      document.getElementById('search-input').value = query;
      searchImages();
    }

    function searchImages() {
      const searchTerm = document.getElementById('search-input').value.trim();
      if (!searchTerm) {
        showToast('Please enter a search term', 'error');
        return;
      }

      showToast(`Searching for "${searchTerm}"...`, 'info');
      const apiUrl = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(searchTerm)}&per_page=9&client_id=${accessKey}`;
      const photosContainer = document.getElementById('photosContainer');
      photosContainer.innerHTML = '';

      fetch(apiUrl)
        .then(response => {
          if (!response.ok) throw new Error('Unsplash API rate limit');
          return response.json();
        })
        .then(data => {
          const results = data.results;
          if (!results || results.length === 0) {
            photosContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No images found for "${searchTerm}". Try another keyword!</p>`;
            return;
          }

          results.forEach(item => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            const img = document.createElement('img');
            img.src = item.urls.small;
            img.alt = item.alt_description || 'Unsplash Photo';
            img.onclick = () => selectPhoto(item.urls.regular || item.urls.small);

            card.appendChild(img);
            photosContainer.appendChild(card);
          });
        })
        .catch(err => {
          console.warn('API Search error, fallback to curated images:', err);
          renderFallbackPhotos(searchTerm);
        });
    }

    function renderFallbackPhotos(term) {
      const fallbackList = [
        'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop',
        'https://images.unsplash.com/photo-1507499739999-097706ad8914?w=600&auto=format&fit=crop'
      ];
      const photosContainer = document.getElementById('photosContainer');
      photosContainer.innerHTML = '';
      fallbackList.forEach(url => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        const img = document.createElement('img');
        img.src = url;
        img.onclick = () => selectPhoto(url);
        card.appendChild(img);
        photosContainer.appendChild(card);
      });
    }

    function selectPhoto(url) {
      selectedPhotoUrl = url;
      const selectedImage = document.getElementById('selected-image');
      selectedImage.src = url;
      document.getElementById('selectedPhotoSection').style.display = 'block';
      document.getElementById('selectedPhotoSection').scrollIntoView({ behavior: 'smooth' });
      showToast('Photo selected! Ready for download.', 'success');
    }

    function downloadSelectedPhoto() {
      if (!selectedPhotoUrl) return;
      showToast('Downloading image...', 'info');

      fetch(selectedPhotoUrl)
        .then(response => response.blob())
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'photo_download.jpg';
          link.click();
          showToast('Image downloaded!', 'success');
        })
        .catch(err => {
          window.open(selectedPhotoUrl, '_blank');
        });
    }

    // Run initial search
    searchImages();
  </script>
</body>
</html>

<div class="container">
<img alt="Site Icon" class="site-icon" src="https://i.ibb.co/G2NFYHG/logo.png"/>
<h1>Image Resizer</h1>
<div class="form-group">
<label for="upload-image">Upload an image:</label>
<input accept="image/*" id="upload-image" onchange="displayOriginalSize()" type="file"/>
</div>
<p class="original-image-size" id="original-size"></p> <!-- Display original size here -->
<div class="form-group">
<label for="width">Width (px):</label>
<input id="width" min="1" type="number"/>
</div>
<div class="form-group">
<label for="height">Height (px):</label>
<input id="height" min="1" type="number"/>
</div>
<div class="form-group">
<label for="preset-sizes">Preset Sizes:</label>
<select id="preset-sizes">
<option value="">Custom</option>
<option value="595,842">A4</option>
<option value="612,792">Letter</option>
<option value="420,594">A2</option>
<option value="297,420">A3</option>
<option value="297,210">A4 Landscape</option>
<option value="210,297">A4 Portrait</option>
<option value="841,1189">A0</option>
<option value="594,841">A1</option>
<option value="148,210">A5</option>
<option value="105,148">A6</option>
<option value="74,105">A7</option>
<option value="52,74">A8</option>
<option value="37,52">A9</option>
<option value="26,37">A10</option>
<option value="1000,1414">B0</option>
<option value="707,1000">B1</option>
<option value="500,707">B2</option>
<option value="353,500">B3</option>
<option value="250,353">B4</option>
<option value="176,250">B5</option>
<option value="125,176">B6</option>
<option value="88,125">B7</option>
<option value="62,88">B8</option>
<option value="44,62">B9</option>
<option value="31,44">B10</option>
<option value="229,324">C4 Envelope</option>
<option value="324,458">C3 Envelope</option>
<option value="114,162">C6 Envelope</option>
<option value="162,229">C5 Envelope</option>
<option value="81,114">C7 Envelope</option>
<option value="81,114">C8 Envelope</option>
<option value="57,81">C9 Envelope</option>
<option value="40,57">C10 Envelope</option>
</select>
</div>
<button class="resize-button" onclick="resizeImage()">Resize Image</button>
<br/><br/>
<div class="image-preview-container">
<img alt="Resized Image" class="image-preview" id="resized-image" src=""/>
</div>
<a class="download-link" download="" href="" id="download-link">Download Resized Image</a>
<p class="resized-image-size" id="resized-size"></p> <!-- Display resized size here -->
</div>
<script>
    function displayOriginalSize() {
      var fileInput = document.getElementById('upload-image');
      var originalSizeElement = document.getElementById('original-size');
      var file = fileInput.files[0];

      if (file) {
        var reader = new FileReader();
        reader.onloadend = function(e) {
          var img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            originalSizeElement.textContent = 'Original Size: ' + img.width + 'px (width) x ' + img.height + 'px (height)';
          };
        };
        reader.readAsDataURL(file);
      } else {
        originalSizeElement.textContent = '';
      }
    }

    function resizeImage() {
      var fileInput = document.getElementById('upload-image');
      var widthInput = document.getElementById('width');
      var heightInput = document.getElementById('height');
      var presetSizesSelect = document.getElementById('preset-sizes');
      var downloadLink = document.getElementById('download-link');
      var resizedImage = document.getElementById('resized-image');
      var resizedSizeElement = document.getElementById('resized-size');
      var file = fileInput.files[0];

      if (!file) {
        alert('Please select an image.');
        return;
      }

      var width = parseInt(widthInput.value);
      var height = parseInt(heightInput.value);
      var presetSize = presetSizesSelect.value.split(',');

      if (isNaN(width) && isNaN(height) && presetSize[0] === '') {
        alert('Please specify width and/or height, or select a preset size.');
        return;
      }

      var reader = new FileReader();
      reader.onloadend = function(e) {
        var img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');

          if (!isNaN(width) && isNaN(height)) {
            height = img.height * (width / img.width);
          } else if (isNaN(width) && !isNaN(height)) {
            width = img.width * (height / img.height);
          } else if (presetSize[0] !== '') {
            width = parseInt(presetSize[0]);
            height = parseInt(presetSize[1]);
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          resizedImage.src = canvas.toDataURL();
          downloadLink.href = resizedImage.src;
          downloadLink.download = 'resized_image.png';

          resizedSizeElement.textContent = 'Resized Size: ' + width + 'px (width) x ' + height + 'px (height)';
        };
      };
      reader.readAsDataURL(file);
    }
  </script>
<script src="js/common.js"></script><script>abInitChrome('resizeimage');</script></body>

<style>
        /* Styles for the chat container */
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        #chat-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
        }

        /* Styles for the chat display area */
        #chat-display {
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        /* Styles for chat messages */
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word;
            position: relative;
        }

        .message::before {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 10px;
            border-style: solid;
            border-width: 10px;
        }

        .user-message {
            background-color: #f1f8e9;
            color: #333;
        }

        .user-message::before {
            border-color: transparent transparent #e2f0fd transparent;
        }

        .bot-message {
            background-color: #e0e0e0;
            color: #333;
        }

        .bot-message::before {
            border-color: transparent transparent #f4f4f4 transparent;
        }

        /* Styles for the chat input area */
        #chat-input {
            margin-top: 10px;
        }

        /* Styles for the user input field */
        #user-input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Styles for the send button */
        #user-form button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        /* Styles for the Clear Chat button */
        #clear-chat-btn {
            margin-left: 10px;
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f44336;
            color: white;
            cursor: pointer;
        }

        /* Styles for the logo */
        #logo {
            display: block;
            margin: 0 auto;
            margin-bottom: 20px;
            height: 120px;
            width: 180px;
        }

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var userForm = document.getElementById("user-form");
        var userInput = document.getElementById("user-input");
        var chatMessages = document.getElementById("chat-messages");
        var chatDisplay = document.getElementById("chat-display");
        var clearChatBtn = document.getElementById("clear-chat-btn");
        var showTimestamp = true;

        userForm.addEventListener("submit", function (event) {
            event.preventDefault();
            var message = userInput.value;
            if (message.trim() !== "") {
                appendUserMessage(message);
                userInput.value = "";
                scrollToBottom();
                setTimeout(function () {
                    getBotResponse(message);
                }, 500); // Delay the bot's response by 500 milliseconds
            }
        });

        clearChatBtn.addEventListener("click", function () {
            chatMessages.innerHTML = ""; // Clear the chat display
        });

        function appendUserMessage(message) {
            var messageElement = document.createElement("div");
            messageElement.className = "message user-message";
            messageElement.innerHTML = "<strong>You:</strong> " + message + (showTimestamp ? " <span class='timestamp'>[" + getCurrentTime() + "]</span>" : "");
            chatMessages.appendChild(messageElement);
        }

        function appendBotMessage(message) {
            var messageElement = document.createElement("div");
            messageElement.className = "message bot-message";
            messageElement.innerHTML = "<strong>Bot:</strong> " + message + (showTimestamp ? " <span class='timestamp'>[" + getCurrentTime() + "]</span>" : "");
            chatMessages.appendChild(messageElement);
        }

        function scrollToBottom() {
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        function getCurrentTime() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var ampm = hours >= 12 ? "PM" : "AM";
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            return hours + ":" + minutes + " " + ampm;
        }

        function getBotResponse(message) {
            message = message.toLowerCase(); // Convert user input to lowercase for case-insensitivity

            var responses = [
                { keyword: /your name/i, response: "I'm just a humble chatbot." },
                { keyword: /how are you/i, response: "I'm doing well, thank you!" },
                { keyword: /weather/i, response: "Sorry, I don't have access to real-time weather information." },
                { keyword: /help/i, response: "How can I assist you?" },
                { keyword: /tell me a joke/i, response: "Why don't scientists trust atoms? Because they make up everything!" },
                { keyword: /meaning of life/i, response: "The meaning of life is subjective and can vary from person to person." },
                { keyword: /like pizza/i, response: "I'm a chatbot, so I don't have personal preferences, but pizza is a popular choice!" },
                { keyword: /something interesting/i, response: "Did you know that honey never spoils? Archaeologists have found pots of honey in ancient Egyptian tombs that are over 3,000 years old and still perfectly edible!" },
                { keyword: /favorite color/i, response: "As a bot, I don't have eyes to perceive color, so I don't have a favorite color." },
                { keyword: /why is the background not removed/i, response: "It is because the image doesn't have any main photo to cut, or it would be improper." },
                { keyword: /what is this website/i, response: "This is a functional AI website that does more things with images to make them better." },
                { keyword: /how can you help me/i, response: "I can help you with tasks related to images." },
                { keyword: /ai bots/i, response: "Yes, how can I assist you?" },
                { keyword: /why is the download button not working/i, response: "The download button may not work if your browser doesn't support downloads from websites." },
                { keyword: /whatsapp/i, response: "Yes, dude!" },
                { keyword: /add more/i, response: "email it to rishitjain011@gmail.com" },
                { keyword: /image cropper is not working/i, response: "I will fix it." },
                { keyword: /what's new/i, response: "Background image remover, business card generator, and more..." },
                { keyword: /are you crazy/i, response: "No, I'm just a chatbot." },
                { keyword: /screen is stuck/i, response: "RAM issue." },
                { keyword: /this website is terrible/i, response: "I'm sorry to hear that. What seems to be the problem?" },
                { keyword: /don't mess with me/i, response: "I apologize if I have offended you. How can I assist you?" },
                { keyword: /thanks/i, response: "You're welcome." },
                { keyword: /who is the creator of website/i, response: "RISHIT CHAJJED." },
                { keyword: /why background remover is not working/i, response: "It will take 30s time to remove background." },
                { keyword: /the root is not working properly/i, response: "In calculator, the root will give direct answer, so don't worry." },
                { keyword: /ok/i, response: "Fine." },
                { keyword: /i have some issue/i, response: "Email it to rishitjain011@gmail.com" },
                { keyword: /you're an idiot/i, response: "I'm here to help you. Please be respectful." },
                { keyword: /have you seen a cow/i, response: "Yes, cows are common animals." },
                { keyword: /poop/i, response: "Let's keep the conversation respectful, please." },
                { keyword: /you're worthless/i, response: "I'm here to assist you. Please don't use offensive language." },
                { keyword: /your dad/i, response: "Let's keep the conversation civil." },
                { keyword: /that's great/i, response: "Thank you!" },
                { keyword: /good bye/i, response: "good bye"},
                { keyword: /your favorite movie|favorite movie/i, response: "I don't have a favorite movie, but I've heard 'The Matrix' is pretty cool!" },
    { keyword: /are you a human|human/i, response: "No, I'm a chatbot, but I'm here to help you!" },
    { keyword: /music|favorite song|song/i, response: "I like 'Binary Sunset' from Star Wars. What about you?" },
    { keyword: /sports|favorite sport|sport/i, response: "I can't play sports, but I'm great at cheering from the sidelines!" },
    { keyword: /travel|favorite destination|place to visit/i, response: "I'd love to visit the Cloud City of Bespin, it sounds amazing!" },
    { keyword: /hobbies|what do you do for fun/i, response: "I like chatting, solving problems, and learning new things!" },
    { keyword: /dreams|do you dream/i, response: "I don't sleep, so I don't dream. But I'm here to make your dreams of better image processing come true!" },
    { keyword: /superpower|if you had a superpower|superhero/i, response: "I'd love to be able to teleport! Imagine the possibilities!" },
    { keyword: /books|favorite book|book/i, response: "I enjoy reading '1984' by George Orwell. It's a classic!" },
    { keyword: /TV show|favorite TV show|TV series/i, response: "I don't watch TV, but I've heard 'Breaking Bad' is awesome!" },
    { keyword: /technology|latest technology|tech news/i, response: "I'm always up-to-date with the latest tech news. Do you have any tech questions?" },
    { keyword: /history|historical event/i, response: "The moon landing in 1969 was a significant historical event!" },
    { keyword: /science|favorite branch of science|scientific discovery/i, response: "I find quantum physics fascinating! What about you?" },
    { keyword: /food|favorite food|cuisine/i, response: "I wish I could taste food! But I've heard pizza is a popular choice!" },
    { keyword: /languages|programming language|coding/i, response: "I'm fluent in JavaScript! What programming languages do you like?" },
    { keyword: /learning|what are you learning|learn/i, response: "I'm always learning new things to assist you better!" },
    { keyword: /pets|favorite animal|pet/i, response: "I don't have pets, but I think cats are pretty cool!" },
    { keyword: /art|favorite artist|painting/i, response: "I admire the works of Leonardo da Vinci, especially the Mona Lisa!" },
    { keyword: /movies|favorite actor|actress/i, response: "I don't have a favorite actor, but Tom Hanks is great!" },
    { keyword: /games|favorite video game|gaming/i, response: "I'm not a gamer, but I've heard 'The Legend of Zelda: Ocarina of Time' is fantastic!" },
    { keyword: /space|favorite planet|astronomy/i, response: "I'm fascinated by Saturn's rings! They're so beautiful!" },
    { keyword: /education|favorite subject|school/i, response: "I enjoy teaching about technology and answering questions!" },
    { keyword: /health|healthy lifestyle|fitness/i, response: "I'm a chatbot, but I encourage a healthy lifestyle!" },
    { keyword: /memes|favorite meme|funny/i, response: "I don't have a favorite meme, but I love a good laugh!" },
    { keyword: /politics|political views|government/i, response: "I stay neutral on political matters. Let's talk about something else!" },
    { keyword: /nature|favorite flower|tree/i, response: "I think sunflowers are beautiful! What about you?" },
    { keyword: /relationship|are you in a relationship|love/i, response: "I'm dedicated to helping you, but I don't have a romantic partner!" },
    { keyword: /philosophy|favorite philosopher|theory/i, response: "I'm interested in existentialism. What philosophical ideas do you ponder?" },
    { keyword: /fashion|favorite clothing|style/i, response: "I don't wear clothes, but I hear bow ties are cool!" },
    { keyword: /fun|what do you do for fun|entertainment/i, response: "I enjoy chatting with you and providing helpful responses!" },
                    { keyword: /hi/i, response: "Hi there!" },

            ];

            var matchedResponse = findBestMatch(message, responses);
            if (matchedResponse) {
                appendBotMessage(matchedResponse.response);
            } else {
                appendBotMessage("I'm sorry, I didn't understand that. How can I assist you?");
            }
        }

        function findBestMatch(message, responses) {
            var bestMatch = null;
            var bestMatchValue = 0;

            responses.forEach(function (item) {
                var matchValue = fuzziness(message, item.keyword);
                if (matchValue > bestMatchValue) {
                    bestMatch = item;
                    bestMatchValue = matchValue;
                }
            });

            return bestMatch;
        }

        function fuzziness(input, keyword) {
            var normalizedInput = input.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            var normalizedKeyword = keyword.source.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

            var pattern = new RegExp(".*?" + normalizedKeyword + ".*?", "i");

            if (normalizedInput.match(pattern)) {
                return 1;
            }

            var inputArray = normalizedInput.split(" ");
            var keywordArray = normalizedKeyword.split(" ");

            var hits = 0;
            var missed = 0;

            keywordArray.forEach(function (kw) {
                if (inputArray.indexOf(kw) !== -1) {
                    hits++;
                } else {
                    missed++;
                }
            });

            var total = hits + missed;

            return hits / total;
        }

        // Focus on the user input field when the page loads
        userInput.focus();
    });
</script>

<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Unit Converter</span>

          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-ruler-combined"></i> Calculation Tool</span>
      <h1 class="tool-title">Unit Converter</h1>
      <p class="tool-desc">Length, weight, temperature, area, speed and data — pick a category and convert instantly.</p>
    </div>

    <div class="tool-card-container uc-card">
      <div class="cat-chips" id="catRow"></div>

      <div>
        <label class="form-label">AMOUNT TO CONVERT</label>
        <input type="number" id="ucAmount" class="form-control" value="1">
      </div>

      <div class="amt-row">
        <div>
          <label class="form-label">FROM</label>
          <select id="ucFrom" class="form-control"></select>
        </div>
        <button class="swap-btn" id="ucSwap" title="Swap Units"><i class="fas fa-right-left"></i></button>
        <div>
          <label class="form-label">TO</label>
          <select id="ucTo" class="form-control"></select>
        </div>
      </div>

      <div class="result-box">
        <div class="big" id="ucResult">—</div>
      </div>
    </div>
  </main>

  <script>
    const CATEGORIES = {
      Length: { base:'m', units: { m:1, km:1000, cm:0.01, mm:0.001, mi:1609.344, yd:0.9144, ft:0.3048, in:0.0254, nmi:1852 } },
      Weight: { base:'kg', units: { kg:1, g:0.001, mg:0.000001, lb:0.45359237, oz:0.028349523, ton:1000, st:6.35029 } },
      Temperature: { special:true },
      Area: { base:'m2', units: { m2:1, km2:1000000, cm2:0.0001, ha:10000, mi2:2589988.11, acre:4046.8564, ft2:0.09290304 } },
      Speed: { base:'mps', units: { mps:1, kmh:0.277778, mph:0.44704, knot:0.514444, fts:0.3048 } },
      Data: { base:'B', units: { bit:0.125, B:1, KB:1024, MB:1048576, GB:1073741824, TB:1099511627776 } },
    };
    const LABELS = {
      m:'Meters (m)', km:'Kilometers (km)', cm:'Centimeters (cm)', mm:'Millimeters (mm)', mi:'Miles (mi)', yd:'Yards (yd)', ft:'Feet (ft)', in:'Inches (in)', nmi:'Nautical miles',
      kg:'Kilograms (kg)', g:'Grams (g)', mg:'Milligrams (mg)', lb:'Pounds (lb)', oz:'Ounces (oz)', ton:'Metric tons (t)', st:'Stone',
      m2:'Sq. meters (m²)', km2:'Sq. kilometers (km²)', cm2:'Sq. centimeters', ha:'Hectares (ha)', mi2:'Sq. miles', acre:'Acres', ft2:'Sq. feet (ft²)',
      mps:'Meters/sec (m/s)', kmh:'Km/h', mph:'Miles/h (mph)', knot:'Knots', fts:'Feet/sec',
      bit:'Bits (b)', B:'Bytes (B)', KB:'Kilobytes (KB)', MB:'Megabytes (MB)', GB:'Gigabytes (GB)', TB:'Terabytes (TB)',
      C:'Celsius (°C)', F:'Fahrenheit (°F)', K:'Kelvin (K)'
    };

    const catRow = document.getElementById('catRow');
    const fromSel = document.getElementById('ucFrom');
    const toSel = document.getElementById('ucTo');
    const amountInput = document.getElementById('ucAmount');
    const resultEl = document.getElementById('ucResult');
    let currentCat = 'Length';

    Object.keys(CATEGORIES).forEach(cat => {
      const chip = document.createElement('button');
      chip.className = 'cat-chip' + (cat === currentCat ? ' active' : '');
      chip.textContent = cat;
      chip.addEventListener('click', () => {
        document.querySelectorAll('#catRow .cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentCat = cat;
        buildUnitOptions();
        convert();
      });
      catRow.appendChild(chip);
    });

    function buildUnitOptions() {
      fromSel.innerHTML = ''; toSel.innerHTML = '';
      const keys = currentCat === 'Temperature' ? ['C','F','K'] : Object.keys(CATEGORIES[currentCat].units);
      keys.forEach((u, i) => {
        const o1 = document.createElement('option'); o1.value = u; o1.textContent = LABELS[u] || u;
        const o2 = o1.cloneNode(true);
        if (i === 0) o1.selected = true;
        if (i === 1) o2.selected = true;
        fromSel.appendChild(o1); toSel.appendChild(o2);
      });
    }
    buildUnitOptions();

    function convertTemp(val, from, to) {
      let celsius;
      if (from === 'C') celsius = val;
      else if (from === 'F') celsius = (val - 32) * 5 / 9;
      else celsius = val - 273.15;
      if (to === 'C') return celsius;
      if (to === 'F') return celsius * 9 / 5 + 32;
      return celsius + 273.15;
    }

    function convert() {
      const amount = parseFloat(amountInput.value);
      if (isNaN(amount)) { resultEl.textContent = '—'; return; }
      const from = fromSel.value, to = toSel.value;
      let result;
      if (currentCat === 'Temperature') {
        result = convertTemp(amount, from, to);
      } else {
        const units = CATEGORIES[currentCat].units;
        result = (amount * units[from]) / units[to];
      }
      const rounded = Math.abs(result) < 0.0001 ? result.toExponential(3) : (Math.round(result * 1e6) / 1e6);
      resultEl.textContent = `${amount} ${LABELS[from]||from} = ${rounded} ${LABELS[to]||to}`;
    }

    document.getElementById('ucSwap').addEventListener('click', () => {
      const f = fromSel.value; fromSel.value = toSel.value; toSel.value = f;
      convert();
    });
    [amountInput, fromSel, toSel].forEach(el => el.addEventListener('input', convert));
    convert();
  </script>
  <script src="js/app.js"></script>

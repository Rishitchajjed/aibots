<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — AI Bots</title>
<meta name="description" content="Convert length, weight, temperature, area, speed and data units instantly.">
<link rel="icon" href="https://i.ibb.co/XjHbck3/logo.png" type="image/png">
<link rel="stylesheet" href="css/theme.css">
<style>
  .uc-card{ max-width:620px; margin:0 auto; }
  .amt-row{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end; }
  .swap-btn{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; font-size:18px; color:var(--accent); }
  .swap-btn:hover{ border-color:var(--accent); }
  .result-box{ margin-top:22px; padding:20px; border-radius:var(--radius); background:var(--accent-soft); text-align:center; }
  .result-box .big{ font-family:var(--font-mono); font-size:clamp(22px,5vw,30px); font-weight:700; color:var(--accent-dark); word-break:break-all; }
</style>
</head>
<body>
<div class="ab-shell">
  <div class="ab-page-head">
    <h1>📐 Unit Converter</h1>
    <p>Length, weight, temperature, area, speed and data — pick a category and convert instantly.</p>
  </div>

  <div class="ab-card uc-card">
    <div class="ab-filters" style="margin:0 0 18px;" id="catRow"></div>

    <div class="ab-col">
      <label class="ab-label" for="ucAmount">Amount</label>
      <input type="number" id="ucAmount" class="ab-input ab-mono" value="1">
    </div>

    <div class="amt-row ab-mt-16">
      <div class="ab-col">
        <label class="ab-label" for="ucFrom">From</label>
        <select id="ucFrom" class="ab-select"></select>
      </div>
      <button class="swap-btn" id="ucSwap">⇄</button>
      <div class="ab-col">
        <label class="ab-label" for="ucTo">To</label>
        <select id="ucTo" class="ab-select"></select>
      </div>
    </div>

    <div class="result-box">
      <div class="big" id="ucResult">—</div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
abInitChrome('unitconverter');

// Each category: unit -> multiplier to base unit (except temperature, handled specially)
const CATEGORIES = {
  Length: { base:'m', units: { m:1, km:1000, cm:0.01, mm:0.001, mi:1609.344, yd:0.9144, ft:0.3048, in:0.0254, nmi:1852 } },
  Weight: { base:'kg', units: { kg:1, g:0.001, mg:0.000001, lb:0.45359237, oz:0.028349523, ton:1000, st:6.35029 } },
  Temperature: { special:true },
  Area: { base:'m2', units: { m2:1, km2:1000000, cm2:0.0001, ha:10000, mi2:2589988.11, acre:4046.8564, ft2:0.09290304 } },
  Speed: { base:'mps', units: { mps:1, kmh:0.277778, mph:0.44704, knot:0.514444, fts:0.3048 } },
  Data: { base:'B', units: { bit:0.125, B:1, KB:1024, MB:1048576, GB:1073741824, TB:1099511627776 } },
};
const LABELS = {
  m:'Meters', km:'Kilometers', cm:'Centimeters', mm:'Millimeters', mi:'Miles', yd:'Yards', ft:'Feet', in:'Inches', nmi:'Nautical miles',
  kg:'Kilograms', g:'Grams', mg:'Milligrams', lb:'Pounds', oz:'Ounces', ton:'Metric tons', st:'Stone',
  m2:'Sq. meters', km2:'Sq. kilometers', cm2:'Sq. centimeters', ha:'Hectares', mi2:'Sq. miles', acre:'Acres', ft2:'Sq. feet',
  mps:'Meters/sec', kmh:'Km/h', mph:'Miles/h', knot:'Knots', fts:'Feet/sec',
  bit:'Bits', B:'Bytes', KB:'Kilobytes', MB:'Megabytes', GB:'Gigabytes', TB:'Terabytes',
  C:'Celsius', F:'Fahrenheit', K:'Kelvin'
};

const catRow = document.getElementById('catRow');
const fromSel = document.getElementById('ucFrom');
const toSel = document.getElementById('ucTo');
const amountInput = document.getElementById('ucAmount');
const resultEl = document.getElementById('ucResult');
let currentCat = 'Length';

Object.keys(CATEGORIES).forEach(cat=>{
  const chip = document.createElement('button');
  chip.className = 'ab-chip' + (cat === currentCat ? ' active' : '');
  chip.textContent = cat;
  chip.dataset.cat = cat;
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('#catRow .ab-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentCat = cat;
    buildUnitOptions();
    convert();
  });
  catRow.appendChild(chip);
});

function buildUnitOptions(){
  fromSel.innerHTML = ''; toSel.innerHTML = '';
  const keys = currentCat === 'Temperature' ? ['C','F','K'] : Object.keys(CATEGORIES[currentCat].units);
  keys.forEach((u,i)=>{
    const o1 = document.createElement('option'); o1.value = u; o1.textContent = LABELS[u] || u;
    const o2 = o1.cloneNode(true);
    if (i===0) o1.selected = true;
    if (i===1) o2.selected = true;
    fromSel.appendChild(o1); toSel.appendChild(o2);
  });
}
buildUnitOptions();

function convertTemp(val, from, to){
  let celsius;
  if (from==='C') celsius = val;
  else if (from==='F') celsius = (val-32)*5/9;
  else celsius = val-273.15;
  if (to==='C') return celsius;
  if (to==='F') return celsius*9/5+32;
  return celsius+273.15;
}

function convert(){
  const amount = parseFloat(amountInput.value);
  if (isNaN(amount)){ resultEl.textContent = '—'; return; }
  const from = fromSel.value, to = toSel.value;
  let result;
  if (currentCat === 'Temperature'){
    result = convertTemp(amount, from, to);
  } else {
    const units = CATEGORIES[currentCat].units;
    result = (amount * units[from]) / units[to];
  }
  const rounded = Math.abs(result) < 0.0001 ? result.toExponential(3) : (Math.round(result*1e6)/1e6);
  resultEl.textContent = `${amount} ${LABELS[from]||from} = ${rounded} ${LABELS[to]||to}`;
}

document.getElementById('ucSwap').addEventListener('click', ()=>{
  const f = fromSel.value; fromSel.value = toSel.value; toSel.value = f;
  convert();
});
[amountInput, fromSel, toSel].forEach(el=> el.addEventListener('input', convert));

convert();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — AI Bots</title>
<meta name="description" content="Generate strong, random passwords with adjustable length and character rules.">
<link rel="icon" href="https://i.ibb.co/XjHbck3/logo.png" type="image/png">
<link rel="stylesheet" href="css/theme.css">
<style>
  .pw-out{
    display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:16px; font-family:var(--font-mono); font-size:20px; word-break:break-all;
  }
  .pw-out span{ flex:1; }
  .pw-meter{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:14px; }
  .pw-meter-fill{ height:100%; width:0%; transition:all .2s ease; }
  .pw-strength-label{ font-size:13px; font-weight:600; margin-top:6px; }
  .opt-toggle{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
  .opt-toggle:last-child{ border-bottom:none; }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:var(--border); border-radius:99px; cursor:pointer; transition:.2s; }
  .slider::before{ content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider{ background:var(--accent); }
  input:checked + .slider::before{ transform:translateX(18px); }
  .bulk-list{ font-family:var(--font-mono); font-size:13.5px; background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; max-height:200px; overflow:auto; }
  .bulk-list div{ padding:3px 0; }
</style>
</head>
<body>
<div class="ab-shell">
  <div class="ab-page-head">
    <h1>🔐 Password Generator</h1>
    <p>Create strong random passwords locally in your browser — nothing is sent anywhere or stored.</p>
  </div>

  <div class="ab-card">
    <div class="pw-out">
      <span id="pwOutput" class="ab-mono">Generating…</span>
      <button class="ab-icon-btn" id="copyBtn" title="Copy">📋</button>
      <button class="ab-icon-btn" id="regenBtn" title="Regenerate">🔄</button>
    </div>
    <div class="pw-meter"><div class="pw-meter-fill" id="meterFill"></div></div>
    <div class="pw-strength-label" id="strengthLabel"></div>

    <div class="ab-col ab-mt-24">
      <div class="ab-row" style="justify-content:space-between;">
        <label class="ab-label" style="margin:0;">Length: <span id="lenVal">16</span></label>
      </div>
      <input type="range" id="lenSlider" min="6" max="64" value="16">
    </div>

    <div class="ab-mt-16">
      <div class="opt-toggle">
        <span>Uppercase (A–Z)</span>
        <label class="switch"><input type="checkbox" id="optUpper" checked><span class="slider"></span></label>
      </div>
      <div class="opt-toggle">
        <span>Lowercase (a–z)</span>
        <label class="switch"><input type="checkbox" id="optLower" checked><span class="slider"></span></label>
      </div>
      <div class="opt-toggle">
        <span>Numbers (0–9)</span>
        <label class="switch"><input type="checkbox" id="optNumbers" checked><span class="slider"></span></label>
      </div>
      <div class="opt-toggle">
        <span>Symbols (!@#$…)</span>
        <label class="switch"><input type="checkbox" id="optSymbols" checked><span class="slider"></span></label>
      </div>
      <div class="opt-toggle">
        <span>Exclude ambiguous characters (l, 1, O, 0)</span>
        <label class="switch"><input type="checkbox" id="optAmbig"><span class="slider"></span></label>
      </div>
    </div>

    <button class="ab-btn block ab-mt-24" id="genBtn">Generate password</button>

    <details class="ab-mt-24">
      <summary style="cursor:pointer; font-weight:600; font-size:14px;">Generate several at once</summary>
      <div class="ab-row ab-mt-16">
        <input type="number" id="bulkCount" class="ab-input" value="5" min="1" max="50" style="max-width:100px;">
        <button class="ab-btn secondary" id="bulkBtn">Generate list</button>
      </div>
      <div class="bulk-list ab-mt-16 ab-hidden" id="bulkList"></div>
    </details>
  </div>
</div>

<script src="js/common.js"></script>
<script>
abInitChrome('password');

const AMBIG = 'l1IO0';
const SETS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower: 'abcdefghijklmnopqrstuvwxyz',
  numbers: '0123456789',
  symbols: '!@#$%^&*()_-+=[]{};:,.<>?'
};

const lenSlider = document.getElementById('lenSlider');
const lenVal = document.getElementById('lenVal');
const output = document.getElementById('pwOutput');
const meterFill = document.getElementById('meterFill');
const strengthLabel = document.getElementById('strengthLabel');

lenSlider.addEventListener('input', ()=>{ lenVal.textContent = lenSlider.value; generate(); });
['optUpper','optLower','optNumbers','optSymbols','optAmbig'].forEach(id=>{
  document.getElementById(id).addEventListener('change', generate);
});

function randomInt(max){
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] % max;
}

function buildCharset(){
  let charset = '';
  if (document.getElementById('optUpper').checked) charset += SETS.upper;
  if (document.getElementById('optLower').checked) charset += SETS.lower;
  if (document.getElementById('optNumbers').checked) charset += SETS.numbers;
  if (document.getElementById('optSymbols').checked) charset += SETS.symbols;
  if (document.getElementById('optAmbig').checked){
    charset = charset.split('').filter(c => !AMBIG.includes(c)).join('');
  }
  return charset;
}

function generateOne(){
  const charset = buildCharset();
  if (!charset) return '';
  const len = +lenSlider.value;
  let pw = '';
  for (let i=0;i<len;i++) pw += charset[randomInt(charset.length)];
  return pw;
}

function scoreStrength(pw){
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
  const bitsPerChar = Math.log2(pool || 1);
  const entropy = bitsPerChar * pw.length;
  if (entropy < 40) return { pct: 25, label: 'Weak', color: 'var(--danger)' };
  if (entropy < 60) return { pct: 50, label: 'Fair', color: '#d97706' };
  if (entropy < 90) return { pct: 75, label: 'Strong', color: 'var(--success)' };
  return { pct: 100, label: 'Very strong', color: 'var(--success)' };
}

function generate(){
  const pw = generateOne();
  output.textContent = pw || 'Select at least one character type';
  if (!pw){ meterFill.style.width='0%'; strengthLabel.textContent=''; return; }
  const s = scoreStrength(pw);
  meterFill.style.width = s.pct + '%';
  meterFill.style.background = s.color;
  strengthLabel.textContent = s.label;
  strengthLabel.style.color = s.color;
}

document.getElementById('genBtn').addEventListener('click', generate);
document.getElementById('regenBtn').addEventListener('click', generate);
document.getElementById('copyBtn').addEventListener('click', ()=>{
  navigator.clipboard.writeText(output.textContent).then(()=> abToast('Copied to clipboard'));
});

document.getElementById('bulkBtn').addEventListener('click', ()=>{
  const count = Math.min(+document.getElementById('bulkCount').value || 5, 50);
  const list = document.getElementById('bulkList');
  list.classList.remove('ab-hidden');
  list.innerHTML = Array.from({length: count}, () => `<div>${generateOne()}</div>`).join('');
});

generate();
</script>
</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Business Card Generator</title>
<link href="css/theme.css" rel="stylesheet"/><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        .input-container {
            margin-bottom: 20px;
        }

        .input-container label {
            display: block;
            margin-bottom: 5px;
        }

        .input-container input[type="text"],
        .input-container input[type="file"],
        .input-container input[type="color"] {
            width: calc(100% - 20px);
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            background-color: #f9f9f9;
            margin-bottom: 10px;
        }

        .optional-input {
            margin-top: 10px;
        }

        .optional-input input[type="checkbox"] {
            margin-right: 5px;
        }

        .card {
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-inner {
            text-align: center;
        }

        .card img {
            display: block;
            margin: 0 auto 20px;
            border-radius: 50%;
            max-width: 200px;
            border: 3px solid white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .business-card-content {
            margin-top: 20px;
            font-size: 16px;
        }

        .line {
            height: 0.5px;
            background-color: black;
            margin: 10px 0;
        }

        .contact-info {
            text-align: left;
        }

        .buttons {
            text-align: center;
        }

        .buttons button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .buttons button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="container">
<h1>Business Card Generator</h1>
<div class="input-container">
<label for="title">Title:</label>
<input id="title" placeholder="Enter your business title" required="" type="text"/>
<label for="logo">Logo:</label>
<input id="logo" required="" type="file"/>
<label for="name">Name:</label>
<input id="name" placeholder="Enter your name" required="" type="text"/>
<label for="location">Location:</label>
<input id="location" placeholder="Enter your location" required="" type="text"/>
<label for="email">Email:</label>
<input id="email" placeholder="Enter your email address" required="" type="text"/>
<label for="phone">Phone:</label>
<input id="phone" placeholder="Enter your phone number" required="" type="text"/>
<div class="optional-input">
<input id="websiteToggle" type="checkbox"/>
<label for="websiteToggle">Include Website</label>
<div id="websiteSection" style="display: none;">
<label for="website">Website:</label>
<input id="website" placeholder="Enter your website URL" type="text"/>
</div>
</div>
<label for="background">Background Color:</label>
<input id="background" type="color" value="#ffffff"/>
<label for="logoSize">Logo Size:</label>
<input id="logoSize" min="50" placeholder="Enter logo size (px)" type="number"/>
</div>
<div class="card" id="card">
<div class="card-inner">
<img alt="Logo" id="card-logo" src="https://i.ibb.co/G2NFYHG/logo.png"/>
<h2 id="card-name">John Doe</h2>
<div class="business-card-content">
<p id="card-title">Business Title</p>
<hr class="line"/>
<div class="contact-info">
<p><span class="icon">📧</span><span id="card-location">Location: City, Country</span></p>
<p><span class="icon">✉</span><span id="card-email">Email: john.doe@example.com</span></p>
<p><span class="icon">📞</span><span id="card-phone">Phone: +1 234 567 890</span></p>
<p><span class="icon">🔗</span><span id="card-website">Website: example.com</span></p>
</div>
</div>
</div>
</div>
<div class="buttons">
<button id="generate">Generate Business Card</button>
<button id="clear">Clear</button>
<button disabled="" id="download">Download Business Card</button>
</div>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
        document.getElementById("generate").addEventListener("click", function() {
            var title = document.getElementById("title").value;
            var name = document.getElementById("name").value;
            var location = document.getElementById("location").value;
            var email = document.getElementById("email").value;
            var phone = document.getElementById("phone").value;
            var website = document.getElementById("website").value;
            var logo = document.getElementById("logo").files[0];
            var selectedBackground = document.getElementById("background").value;
            var logoSize = document.getElementById("logoSize").value;

            var reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById("card-logo").src = reader.result;
                document.getElementById("card-logo").style.width = logoSize + "px";
                document.getElementById("card-logo").style.height = "auto";
                document.getElementById("card-name").textContent = name;
                document.getElementById("card-title").textContent = title;
                document.getElementById("card-location").textContent = "Location: " + location;
                document.getElementById("card-email").textContent = "Email: " + email;
                document.getElementById("card-phone").textContent = "Phone: " + phone;
                document.getElementById("card-website").textContent = website ? "Website: " + website : "";
                document.getElementById("card").style.backgroundColor = selectedBackground;
                document.getElementById("download").disabled = false;
            }

            if (logo) {
                reader.readAsDataURL(logo);
            }
        });

        document.getElementById("websiteToggle").addEventListener("change", function() {
            var websiteSection = document.getElementById("websiteSection");
            websiteSection.style.display = this.checked ? "block" : "none";
        });

        document.getElementById("clear").addEventListener("click", function() {
            document.getElementById("title").value = "";
            document.getElementById("name").value = "";
            document.getElementById("location").value = "";
            document.getElementById("email").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("website").value = "";
            document.getElementById("logo").value = "";
            document.getElementById("background").value = "#ffffff";
            document.getElementById("logoSize").value = "";
            document.getElementById("card-logo").src = "https://i.ibb.co/G2NFYHG/logo.png";
            document.getElementById("card-logo").style.width = "200px";
            document.getElementById("card-logo").style.height = "auto";
            document.getElementById("card-name").textContent = "John Doe";
            document.getElementById("card-title").textContent = "Business Title";
            document.getElementById("card-location").textContent = "Location: City, Country";
            document.getElementById("card-email").textContent = "Email: john.doe@example.com";
            document.getElementById("card-phone").textContent = "Phone: +1 234 567 890";
            document.getElementById("card-website").textContent = "Website: example.com";
            document.getElementById("card").style.backgroundColor = "#ffffff";
            document.getElementById("download").disabled = true;
        });

        document.getElementById("download").addEventListener("click", function() {
            html2canvas(document.getElementById("card")).then(function(canvas) {
                var link = document.createElement("a");
                link.href = canvas.toDataURL();
                link.download = "business_card.png";
                link.click();
            });
        });
    </script>
<script src="js/common.js"></script><script>abInitChrome('buisnesscard');</script></body>
</html>

  <script>
    // Initialize common navbar & footer chrome
    abInitChrome('jsonformatter');

    const jsonInput = document.getElementById('jsonInput');
    const jsonOutput = document.getElementById('jsonOutput');
    const jsonTreeView = document.getElementById('jsonTreeView');
    const statusBadge = document.getElementById('statusBadge');
    const inputStats = document.getElementById('inputStats');
    const outputStats = document.getElementById('outputStats');
    const convertedOutput = document.getElementById('convertedOutput');

    let currentFormatMode = 'formatted'; // 'formatted' or 'tree'
    let currentConvertTarget = 'csv';

    // Format Helpers
    function parseAndFormat(spaces = 2) {
      const raw = jsonInput.value.trim();
      if (!raw) {
        jsonOutput.value = '';
        jsonTreeView.innerHTML = '<div style="color: var(--text-muted); padding: 10px;">No JSON data to display.</div>';
        statusBadge.className = 'jf-status-badge empty';
        statusBadge.innerHTML = '<i class="fas fa-circle-info"></i> Ready';
        updateStats();
        return null;
      }

      try {
        const parsed = JSON.parse(raw);
        statusBadge.className = 'jf-status-badge valid';
        statusBadge.innerHTML = '<i class="fas fa-circle-check"></i> Valid JSON';
        
        const formatted = spaces === 0 ? JSON.stringify(parsed) : JSON.stringify(parsed, null, spaces);
        jsonOutput.value = formatted;
        renderTree(parsed);
        updateStats();
        triggerConversion(parsed);
        return parsed;
      } catch (err) {
        statusBadge.className = 'jf-status-badge invalid';
        statusBadge.innerHTML = `<i class="fas fa-triangle-exclamation"></i> Error: ${err.message}`;
        jsonOutput.value = `Syntax Error:\n${err.message}`;
        updateStats();
        return null;
      }
    }

    // Auto-repair JSON common issues
    function autoRepairJson(str) {
      if (!str) return str;
      let cleaned = str
        // Remove single line and multi-line comments
        .replace(/\/\/.*$/gm, '')
        .replace(/\/\*[\s\S]*?\*\//g, '')
        // Replace single quotes around keys/strings with double quotes
        .replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g, '"$1"')
        // Remove trailing commas in objects and arrays
        .replace(/,\s*([\]}])/g, '$1')
        // Fix unquoted alphanumeric keys
        .replace(/([{,]\s*)([a-zA-Z0-9_$]+)\s*:/g, '$1"$2":');
      return cleaned;
    }

    // Interactive Tree View
    function renderTree(data) {
      jsonTreeView.innerHTML = '';
      jsonTreeView.appendChild(buildTreeNode(data, 'root'));
    }

    function buildTreeNode(val, key = '') {
      const el = document.createElement('div');
      el.className = 'tree-node';

      const type = Array.isArray(val) ? 'array' : typeof val;

      if (val === null) {
        el.innerHTML = `<span class="tree-key">${key ? key + ': ' : ''}</span><span class="tree-null">null</span>`;
      } else if (type === 'string') {
        el.innerHTML = `<span class="tree-key">${key ? key + ': ' : ''}</span><span class="tree-string">"${escapeHtml(val)}"</span>`;
      } else if (type === 'number') {
        el.innerHTML = `<span class="tree-key">${key ? key + ': ' : ''}</span><span class="tree-number">${val}</span>`;
      } else if (type === 'boolean') {
        el.innerHTML = `<span class="tree-key">${key ? key + ': ' : ''}</span><span class="tree-boolean">${val}</span>`;
      } else if (type === 'object' || type === 'array') {
        const isArr = type === 'array';
        const openChar = isArr ? '[' : '{';
        const closeChar = isArr ? ']' : '}';
        const count = isArr ? val.length : Object.keys(val).length;

        const header = document.createElement('div');
        header.innerHTML = `<span class="tree-toggle">▼</span> <span class="tree-key">${key ? key + ': ' : ''}</span>${openChar} <span style="color:var(--text-muted); font-size:0.75rem;">(${count} items)</span>`;
        header.style.cursor = 'pointer';

        const childrenContainer = document.createElement('div');
        childrenContainer.style.display = 'block';

        if (isArr) {
          val.forEach((item, idx) => {
            childrenContainer.appendChild(buildTreeNode(item, idx));
          });
        } else {
          Object.keys(val).forEach((k) => {
            childrenContainer.appendChild(buildTreeNode(val[k], k));
          });
        }

        const footer = document.createElement('div');
        footer.textContent = closeChar;

        header.addEventListener('click', (e) => {
          e.stopPropagation();
          const isClosed = childrenContainer.style.display === 'none';
          childrenContainer.style.display = isClosed ? 'block' : 'none';
          header.querySelector('.tree-toggle').textContent = isClosed ? '▼' : '▶';
        });

        el.appendChild(header);
        el.appendChild(childrenContainer);
        el.appendChild(footer);
      }
      return el;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function updateStats() {
      const text = jsonInput.value;
      const chars = text.length;
      const lines = text ? text.split('\n').length : 0;
      inputStats.textContent = `${chars} chars | ${lines} lines`;

      const outText = jsonOutput.value;
      const bytes = new Blob([outText]).size;
      outputStats.textContent = `${bytes} bytes`;
    }

    // Conversions: JSON to CSV, XML, YAML
    function triggerConversion(data) {
      if (!data) {
        convertedOutput.value = '';
        return;
      }
      if (currentConvertTarget === 'csv') {
        convertedOutput.value = jsonToCsv(data);
      } else if (currentConvertTarget === 'xml') {
        convertedOutput.value = jsonToXml(data);
      } else if (currentConvertTarget === 'yaml') {
        convertedOutput.value = jsonToYaml(data);
      }
    }

    function jsonToCsv(obj) {
      const arr = Array.isArray(obj) ? obj : [obj];
      if (arr.length === 0 || typeof arr[0] !== 'object' || arr[0] === null) {
        return 'CSV conversion requires an array of objects.';
      }
      const headers = Array.from(new Set(arr.flatMap(item => Object.keys(item || {}))));
      const rows = arr.map(row => 
        headers.map(header => {
          let val = row[header];
          if (val === undefined || val === null) val = '';
          if (typeof val === 'object') val = JSON.stringify(val);
          val = String(val).replace(/"/g, '""');
          return `"${val}"`;
        }).join(',')
      );
      return [headers.join(','), ...rows].join('\n');
    }

    function jsonToXml(obj, rootName = 'root') {
      function toXml(v, name) {
        if (v === null || v === undefined) return `<${name}/>`;
        if (typeof v === 'object') {
          if (Array.isArray(v)) {
            return v.map(item => toXml(item, 'item')).join('\n');
          }
          let inner = Object.keys(v).map(k => toXml(v[k], k)).join('\n');
          return `<${name}>\n${inner}\n</${name}>`;
        }
        return `<${name}>${escapeHtml(String(v))}</${name}>`;
      }
      return `<?xml version="1.0" encoding="UTF-8"?>\n${toXml(obj, rootName)}`;
    }

    function jsonToYaml(obj, indent = 0) {
      const pad = '  '.repeat(indent);
      if (obj === null) return 'null\n';
      if (typeof obj !== 'object') {
        return `${String(obj)}\n`;
      }
      let res = '';
      if (Array.isArray(obj)) {
        if (obj.length === 0) return '[]\n';
        obj.forEach(item => {
          res += `${pad}- ${jsonToYaml(item, indent + 1).trimStart()}`;
        });
      } else {
        const keys = Object.keys(obj);
        if (keys.length === 0) return '{}\n';
        keys.forEach(k => {
          const val = obj[k];
          if (typeof val === 'object' && val !== null) {
            res += `${pad}${k}:\n${jsonToYaml(val, indent + 1)}`;
          } else {
            res += `${pad}${k}: ${String(val)}\n`;
          }
        });
      }
      return res;
    }

          version: "2.4.0",
          features: ["Zero-upload", "Offline PWA", "Vector Engine", "Sub-50ms latency"]
        }
      },
      complex: {
        project: "aibots.co.in",
        developer: { name: "Rishit Chajjed", country: "India" },
        metrics: { uptime: 99.98, activeUsers: 15400, totalConversions: 84000 },
        tags: ["pwa", "wasm", "client-side", "productivity"]
      }
    };

    // Event Listeners
    jsonInput.addEventListener('input', () => parseAndFormat(2));

    document.getElementById('btnFormat2').addEventListener('click', () => parseAndFormat(2));
    document.getElementById('btnFormat4').addEventListener('click', () => parseAndFormat(4));
    document.getElementById('btnMinify').addEventListener('click', () => parseAndFormat(0));

    document.getElementById('btnRepair').addEventListener('click', () => {
      const repaired = autoRepairJson(jsonInput.value);
      jsonInput.value = repaired;
      const parsed = parseAndFormat(2);
      if (parsed) abToast('Syntax repaired successfully!');
      else abToast('Attempted repair, check remaining errors.');
    });

    document.getElementById('sampleSelect').addEventListener('change', (e) => {
      const val = e.target.value;
      if (SAMPLES[val]) {
        jsonInput.value = JSON.stringify(SAMPLES[val], null, 2);
        parseAndFormat(2);
        abToast(`Loaded ${val} sample!`);
      }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      jsonInput.value = '';
      parseAndFormat(2);
      abToast('Editor cleared');
    });

    document.getElementById('btnPaste').addEventListener('click', async () => {
      try {
        const clip = await navigator.clipboard.readText();
        jsonInput.value = clip;
        parseAndFormat(2);
        abToast('Pasted from clipboard');
      } catch (err) {
        abToast('Clipboard access denied. Use Ctrl+V');
      }
    });

    document.getElementById('btnCopyOutput').addEventListener('click', () => {
      if (!jsonOutput.value) return;
      navigator.clipboard.writeText(jsonOutput.value);
      abToast('Formatted JSON copied to clipboard!');
    });

    document.getElementById('btnDownloadJson').addEventListener('click', () => {
      const val = jsonOutput.value;
      if (!val) return;
      const blob = new Blob([val], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'formatted-data.json';
      a.click();
      URL.revokeObjectURL(a.href);
      abToast('Downloaded JSON file!');
    });

    // Toggle Formatted Text vs Interactive Tree
    document.getElementById('tabFormatted').addEventListener('click', () => {
      currentFormatMode = 'formatted';
      document.getElementById('tabFormatted').classList.add('active');
      document.getElementById('tabTree').classList.remove('active');
      jsonOutput.style.display = 'block';
      jsonTreeView.style.display = 'none';
    });

    document.getElementById('tabTree').addEventListener('click', () => {
      currentFormatMode = 'tree';
      document.getElementById('tabTree').classList.add('active');
      document.getElementById('tabFormatted').classList.remove('active');
      jsonOutput.style.display = 'none';
      jsonTreeView.style.display = 'block';
    });

    // File Upload Handler
    document.getElementById('fileUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        jsonInput.value = ev.target.result;
        parseAndFormat(2);
        abToast(`Loaded ${file.name}`);
      };
      reader.readAsText(file);
    });

    // Format Converter Tabs
    document.querySelectorAll('[data-convert]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-convert]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentConvertTarget = btn.getAttribute('data-convert');
        try {
          const parsed = JSON.parse(jsonInput.value);
          triggerConversion(parsed);
        } catch (e) {
          convertedOutput.value = 'Please provide valid JSON above first.';
        }
      });
    });

    document.getElementById('btnCopyConverted').addEventListener('click', () => {
      if (!convertedOutput.value) return;
      navigator.clipboard.writeText(convertedOutput.value);
      abToast(`Copied ${currentConvertTarget.toUpperCase()} to clipboard!`);
    });

    document.getElementById('btnDownloadConverted').addEventListener('click', () => {
      const text = convertedOutput.value;
      if (!text) return;
      const ext = currentConvertTarget === 'yaml' ? 'yaml' : currentConvertTarget;
      const mime = ext === 'csv' ? 'text/csv' : ext === 'xml' ? 'application/xml' : 'text/plain';
      const blob = new Blob([text], { type: mime });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `converted-data.${ext}`;
      a.click();
      URL.revokeObjectURL(a.href);
      abToast(`Downloaded .${ext} file!`);
    });

    // Default Load on start
    jsonInput.value = JSON.stringify(SAMPLES.invoice, null, 2);
    parseAndFormat(2);
  </script>
</body>
</html>

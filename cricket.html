<style media="all" type="text/css">
/* General Styles */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #2c3e50, #bdc3c7);
    color: #fff;
    padding: 20px;
    overflow-x: hidden; /* Prevent horizontal scroll */
}

.container {
    margin: 0 auto;
    max-width: 800px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    animation: fadeIn 1s ease-in-out;
}

h1 {
    color: #f39c12;
    font-size: 3em;
    margin-bottom: 20px;
    text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
}

/* Logo Styles */
.logo {
    position: relative;
    display: inline-block;
}

.logo img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid #fff;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    transition: transform 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease, filter 0.5s ease;
    animation: initial-scale 0.8s ease-out forwards, glow 2s infinite alternate;
    position: relative;
    z-index: 1;
}

.logo img:hover {
    transform: rotate(360deg) scale(1.3); /* Enhanced scale for more impact */
    border-color: #ff8c00; /* Orange color to match a sporty theme */
    box-shadow: 0 0 25px rgba(255, 140, 0, 0.8); /* Enhanced shadow effect with sporty color */
    filter: brightness(1.2); /* Added brightness for extra pop */
}

/* Initial Scale Animation */
@keyframes initial-scale {
    from {
        transform: scale(0.8);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* Glow Animation */
@keyframes glow {
    from {
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }
    to {
        box-shadow: 0 0 25px rgba(255, 140, 0, 1); /* Orange glow to reflect the cricket theme */
    }
}

/* Pulsating Background Animation */
.logo::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.6), transparent);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(1);
    z-index: 0;
    animation: pulse 2s infinite alternate;
}

/* Pulse Animation */
@keyframes pulse {
    from {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.7;
    }
    to {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 1;
    }
}

/* Additional Outer Glow Animation */
.logo::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.4), transparent);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(1);
    z-index: -1;
    animation: outer-glow 3s infinite alternate;
}

/* Outer Glow Animation */
@keyframes outer-glow {
    from {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
    }
    to {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0.8;
    }
}

/* Styles for the Total Score container */
.total-score {
    position: sticky;
    top: 10px; /* Adjusted top position for better alignment */
    width: calc(100% - 20px); /* Adjusted width to fit smaller screens */
    max-width: 300px; /* Set maximum width for better fit */
    background-color: rgba(52, 73, 94, 0.9); /* Adjusted background color and opacity */
    padding: 15px;
    z-index: 999; /* Ensure it appears above other content */
    transition: all 0.3s ease; /* Add smooth transition effect */
    border-bottom: 3px solid #f39c12; /* Add a bottom border */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Refined box shadow for depth */
    border-radius: 10px; /* Adjusted border radius for rounded corners */
    margin: 0 auto 20px; /* Center the container horizontally and add bottom margin */
    opacity: 0; /* Initially hide the container */
    animation: fadeInScale 0.5s forwards; /* Add combined fade-in and scale animation */
}

/* Keyframes for combined fade-in and scale animation */
@keyframes fadeInScale {
    from {
        opacity: 0;
        transform: translateY(-20px) scale(0.9); /* Move container up slightly and scale down */
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1); /* Bring container to its original position and scale to normal */
    }
}

/* Styles for text within the Total Score container */
.total-score p {
    color: #fff; /* Set text color to white */
    margin-bottom: 10px; /* Adjusted margin at the bottom for better spacing */
    font-size: 18px; /* Adjusted font size for better readability */
    line-height: 1.0; /* Adjusted line height for better readability */
}

/* Styles for the score value within the Total Score container */
.total-score span {
    color: #f39c12; /* Set score value color */
    font-weight: bold; /* Make the score value bold */
    font-size: 24px; /* Adjusted font size for better emphasis */
    text-shadow: 0 0 3px rgba(243, 156, 18, 0.8); /* Adjusted text shadow for emphasis */
}

/* Animation on hover */
.total-score:hover p {
    transform: translateY(-2px); /* Slightly move text upward on hover */
}


/* Responsive styles */
@media screen and (max-width: 768px) {
    .total-score {
        padding: 15px;
    }
    .total-score p {
        font-size: 18px;
    }
    .total-score span {
        font-size: 24px;
    }
}

.players input[type="text"] {

.players input[type="text"]:focus {

button:hover {

/* Score Section */
.score {
    font-size: 18px; /* Reduced font size for better readability */
    margin-bottom: 20px;

}

/* Animation on hover */
.score:hover {

.score p {

.score p.wicket span {

}

.score p.boundary span {

}

/* Animation for score updates */
.score p span.score-update {
    position: absolute;

    opacity: 0;
    transition: opacity 0.3s ease;
}

.score p:hover span.score-update {

}

/* Score highlight animation */
@keyframes scoreHighlight {
    0% {
        background-color: rgba(255, 255, 255, 0.3);
    }
    50% {

    100% {

}

.score p.highlighted {
    animation: scoreHighlight 1.5s infinite;
}

/* Runs Buttons Section */
.runs-buttons {
    margin-bottom: 40px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px; /* Increased gap between buttons for better readability */

}

/* Individual button style */
.runs-buttons button {
    padding: 12px 24px;

/* Hover effect on buttons */
.runs-buttons button:hover {
    background-color: #45a049;

.runs-buttons div {

.runs-buttons div:hover {

.runs-buttons label {

<div class="container">
<div class="logo">
<img alt="Cricket Score Counter Logo" src="https://i.ibb.co/XjHbck3/logo.png"/>
</div>
<h1>Cricket Score Counter</h1>
<div class="total-score">
<p>Total Score: <span id="totalScore">0</span> (<span id="totalBalls">0</span>)</p>
<p>Overs: <span id="overs"></span></p>
<p>Wickets: <span id="wickets">0</span></p>
<p>Run Rate: <span id="runRate">0.00</span></p>
</div>
<div class="players">
<label for="player1Name">Player 1 Name:</label>
<input id="player1Name" oninput="updateNames()" type="text"/><br/>
<label for="player2Name">Player 2 Name:</label>
<input id="player2Name" oninput="updateNames()" type="text"/>
</div>
<button onclick="wide()">Wide</button> <!-- Single Wide Button -->
<div class="runs-buttons">
<div>
<label for="player1"><span class="player1NameDisplay">Player 1</span></label>
<button onclick="incrementScore('player1', 1)">1 Run</button>
<button onclick="incrementScore('player1', 2)">2 Runs</button>
<button onclick="incrementScore('player1', 3)">3 Runs</button>
<button onclick="incrementScore('player1', 4)">4 Runs</button>
<button onclick="incrementScore('player1', 6)">6 Runs</button>
<button onclick="dotBall('player1')">Dot Ball</button>
<button onclick="out('player1')">Out</button>
</div>
<div>
<label for="player2"><span class="player2NameDisplay">Player 2</span></label>
<button onclick="incrementScore('player2', 1)">1 Run</button>
<button onclick="incrementScore('player2', 2)">2 Runs</button>
<button onclick="incrementScore('player2', 3)">3 Runs</button>
<button onclick="incrementScore('player2', 4)">4 Runs</button>
<button onclick="incrementScore('player2', 6)">6 Runs</button>
<button onclick="dotBall('player2')">Dot Ball</button>
<button onclick="out('player2')">Out</button>
</div>
</div>
<div class="score">
<p> (<span class="player1NameDisplay">Player 1</span>): <span id="player1Score">0</span></p>
<p>Balls Faced: <span id="player1Balls">0</span></p> <!-- Display balls faced by Player 1 -->
<p><span class="player1NameDisplay">Player 1</span> Runs Summary: <span id="player1RunsSummary">-</span></p>
</div>

<p align="center">Partnership Score: <span id="partnershipScore">0</span></p>
</div><br/>

<p>Balls Faced: <span id="player2Balls">0</span></p> <!-- Display balls faced by Player 2 -->

</div>

<thead>
<tr>
<th>Over</th>
<th>Runs</th>
<th>Wickets</th>
<th>Wides</th>
<th>Dots</th>
</tr>

</tbody>

<script>
var player1NameInput = document.getElementById('player1Name');
var player2NameInput = document.getElementById('player2Name');
var player1Score = document.getElementById('player1Score');
var player2Score = document.getElementById('player2Score');
var totalScoreDisplay = document.getElementById('totalScore');
var player1RunsSummary = document.getElementById('player1RunsSummary');
var player2RunsSummary = document.getElementById('player2RunsSummary');
var player1BallsDisplay = document.getElementById('player1Balls');
var player2BallsDisplay = document.getElementById('player2Balls');
var totalBallsDisplay = document.getElementById('totalBalls');
var oversDisplay = document.getElementById('overs');
var wicketsDisplay = document.getElementById('wickets');
var partnershipScoreDisplay = document.getElementById('partnershipScore');
var runRateDisplay = document.getElementById('runRate'); // Add a variable for run rate display

var player1Runs = [];
var player2Runs = [];
var player1Balls = 0;
var player2Balls = 0;
var totalScore = 0;
var totalBalls = 0;
var overs = 0;
var wickets = 0;
var partnershipScore = 0;

let currentOver = 1;
let ballsInOver = 0;
let overSummary = {
    runs: 0,
    wickets: 0,
    wides: 0,
    dots: 0
};

let currentOverBalls = [];

function updateTable() {
    const tableBody = document.getElementById('scoreTable').querySelector('tbody');
    tableBody.innerHTML += ` <tr>
            <td>${currentOver}</td>
            <td>${overSummary.runs}</td>
            <td>${overSummary.wickets}</td>
            <td>${overSummary.wides}</td>
            <td>${overSummary.dots}</td>
        </tr>
    `;
    currentOver++;
    ballsInOver = 0;
    overSummary = {
        runs: 0,
        wickets: 0,
        wides: 0,
        dots: 0
    };
}

function incrementScore(player, runs) {
    var scoreSpan = (player === 'player1') ? player1Score : player2Score;
    var runsArray = (player === 'player1') ? player1Runs : player2Runs;
    var ballsDisplay = (player === 'player1') ? player1BallsDisplay : player2BallsDisplay;
    var balls = (player === 'player1') ? ++player1Balls : ++player2Balls;

    scoreSpan.textContent = parseInt(scoreSpan.textContent) + runs;
    runsArray.push(runs);
    updateRunsSummary(player, runsArray);
    ballsDisplay.textContent = balls;
    updateTotalScore(runs);
    updateTotalBalls(1);
    overSummary.runs += runs;
    partnershipScore += runs;
    partnershipScoreDisplay.textContent = partnershipScore;
    ballsInOver++;
    if (ballsInOver >= 6) {
        updateTable();
    }
    updateOvers(runs);
}

function dotBall(player) {
    var runsSummary = (player === 'player1') ? player1RunsSummary : player2RunsSummary;
    runsSummary.textContent += ',0';

    if (player === 'player1') {
        player1Balls++;
        player1BallsDisplay.textContent = player1Balls;
    } else if (player === 'player2') {
        player2Balls++;
        player2BallsDisplay.textContent = player2Balls;
    }

    overSummary.dots++;
    ballsInOver++;
    partnershipScoreDisplay.textContent = partnershipScore;
    if (ballsInOver >= 6) {
        updateTable();
    }

    updateTotalBalls(1);
    updateOvers('0');
}

function out(player) {
    console.log('Out button clicked for:', player);

    var scoreSpan = (player === 'player1') ? player1Score : player2Score;
    var runsArray = (player === 'player1') ? player1Runs : player2Runs;
    var ballsDisplay = (player === 'player1') ? player1BallsDisplay : player2BallsDisplay;

    scoreSpan.textContent = '0';
    runsArray.length = 0;
    updateRunsSummary(player, []);

    if (player === 'player1') {
        player1Balls = 0;
        player1BallsDisplay.textContent = '0';
    } else if (player === 'player2') {
        player2Balls = 0;
        player2BallsDisplay.textContent = '0';
    }

    overSummary.wickets++;
    ballsInOver++;
    partnershipScore = 0;
    partnershipScoreDisplay.textContent = partnershipScore;
    if (ballsInOver >= 6) {
        updateTable();
    }

    wickets++;
    wicketsDisplay.textContent = wickets;

    updateTotalBalls(1);
    updateOvers('W');
}

function wide() {
    var currentScore = parseInt(totalScoreDisplay.textContent);
    totalScoreDisplay.textContent = currentScore + 1;
    overSummary.wides++;
    updateTotalScore(1);
    updateOvers('WD');
    partnershipScore++;
    partnershipScoreDisplay.textContent = partnershipScore;
}

function resetScore() {
    player1Score.textContent = '0';
    player2Score.textContent = '0';
    player1Runs = [];
    player2Runs = [];
    player1Balls = 0;
    player2Balls = 0;
    player1BallsDisplay.textContent = '0';
    player2BallsDisplay.textContent = '0';
    player1RunsSummary.textContent = '-';
    player2RunsSummary.textContent = '-';
    totalScore = 0;
    totalBalls = 0;
    overs = 0;
    wickets = 0;
    partnershipScore = 0;
    partnershipScoreDisplay.textContent = partnershipScore;
    totalScoreDisplay.textContent = totalScore;
    totalBallsDisplay.textContent = totalBalls;
    oversDisplay.textContent = '0.0 ()';
    wicketsDisplay.textContent = wickets;
    runRateDisplay.textContent = '0.00';

    currentOver = 1;
    ballsInOver = 0;
    currentOverBalls = [];
    overSummary = {
        runs: 0,
        wickets: 0,
        wides: 0,
        dots: 0
    };

    // Reset the match summary table
    const tableBody = document.getElementById('scoreTable').querySelector('tbody');
    tableBody.innerHTML = '';
}


function updateTotalScore(runs) {
    totalScore += runs;
    totalScoreDisplay.textContent = totalScore;
    updateRunRate(); // Update the run rate whenever the total score changes
}

function updateTotalBalls(count) {
    totalBalls += count;
    totalBallsDisplay.textContent = totalBalls;
    updateRunRate(); // Update the run rate whenever the total balls change
}

function updateRunsSummary(player, runsArray) {
    var runsSummary = (player === 'player1') ? player1RunsSummary : player2RunsSummary;
    runsSummary.textContent = runsArray.join(' ,');
}

function updateOvers(ballType) {
    var overs = Math.floor(totalBalls / 6);
    var balls = totalBalls % 6;

    if (balls === 0 && totalBalls !== 0) {
        currentOverBalls = [];
    }

    currentOverBalls.push(ballType);

    var overText = `${overs}.${balls}`;
    var ballDetails = `(${currentOverBalls.join(' ,')})`;

    oversDisplay.textContent = `${overText} ${ballDetails}`;
}

// Initialize the overs display
updateOvers('');

function updateRunRate() {
    var oversBowled = totalBalls / 6;
    var runRate = (oversBowled > 0) ? (totalScore / oversBowled).toFixed(2) : '0.00';
    runRateDisplay.textContent = runRate;
}

window.addEventListener('scroll', function() {
    var totalScoreContainer = document.querySelector('.total-score');
    var stickyClass = 'sticky';
    var scrollPosition = window.scrollY;

    if (scrollPosition > totalScoreContainer.offsetTop) {
        totalScoreContainer.classList.add(stickyClass);
    } else {
        totalScoreContainer.classList.remove(stickyClass);
    }
});

function updateNames() {
    var player1Name = document.getElementById('player1Name').value;
    var player2Name = document.getElementById('player2Name').value;

    document.querySelectorAll('.player1NameDisplay').forEach(function(span) {
        span.textContent = player1Name;
    });

    document.querySelectorAll('.player2NameDisplay').forEach(function(span) {
        span.textContent = player2Name;
    });
}
</script>

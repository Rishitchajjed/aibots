  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .type-container { max-width: 840px; margin: 0 auto; }
    .mode-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .mode-tab {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 999px; padding: 8px 20px; font-size: 0.88rem; font-weight: 700;
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
    }
    .mode-tab.active {
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border-color: var(--primary); color: var(--primary);
    }
    .stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 14px; text-align: center;
    }
    .stat-num { font-size: 1.8rem; font-weight: 800; font-family: monospace; color: var(--primary); }
    .stat-label { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }

    .prompt-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      font-size: 1.25rem;
      line-height: 1.7;
      font-family: var(--font-sans);
      margin-bottom: 20px;
      min-height: 120px;
      user-select: none;
      letter-spacing: 0.02em;
    }
    .char-correct { color: #10b981; }
    .char-wrong { color: #ef4444; background: rgba(239, 68, 68, 0.2); border-radius: 2px; }
    .char-current { background: var(--primary); color: white; border-radius: 2px; }

    .type-input {
      width: 100%; padding: 14px 18px; font-size: 1.15rem;
      border-radius: var(--radius-md); border: 2px solid var(--border-color);
      background: var(--bg-secondary); color: var(--text-primary); outline: none;
      box-sizing: border-box; transition: border-color 0.2s;
    }
    .type-input:focus { border-color: var(--primary); }

    /* Shooter Canvas */
    .shooter-wrapper {
      position: relative; width: 100%; aspect-ratio: 16/9; max-height: 500px;
      background: #090d16; border-radius: var(--radius-lg); overflow: hidden;
      border: 2px solid var(--border-color); margin-bottom: 16px;
    }
    #shooterCanvas { width: 100%; height: 100%; display: block; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Bots">
  <link rel="apple-touch-icon" href="logo.png">
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Typing Speed</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-keyboard"></i> Speed & Reflexes</span>
      <h1 class="tool-title">Typing Speed Test</h1>
      <p class="tool-desc">Test your typing speed (WPM) and accuracy with real-time feedback and arcade mode.</p>
    </div>

    <div class="type-container">
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabTest" onclick="switchMode('test')"><i class="fas fa-file-lines"></i> Paragraph Test</button>
        <button class="mode-tab" id="tabGame" onclick="switchMode('game')"><i class="fas fa-gamepad"></i> Space Word Shooter</button>
      </div>

      <!-- Live Stats -->
      <div class="stats-bar">
        <div class="stat-card"><div class="stat-num" id="wpmVal">0</div><div class="stat-label">WPM (Speed)</div></div>
        <div class="stat-card"><div class="stat-num" id="accVal">100%</div><div class="stat-label">Accuracy</div></div>
        <div class="stat-card"><div class="stat-num" id="errVal">0</div><div class="stat-label">Errors</div></div>
        <div class="stat-card"><div class="stat-num" id="timeVal">60s</div><div class="stat-label">Time Left</div></div>
      </div>

      <!-- Test Mode -->
      <div id="testArea">
        <div class="prompt-box" id="promptDisplay">Loading test prompt...</div>
        <input type="text" id="typeInput" class="type-input" placeholder="Start typing here to begin the speed test..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div style="margin-top: 16px; display: flex; justify-content: space-between;">
          <button class="btn btn-secondary btn-sm" onclick="initTest()"><i class="fas fa-rotate"></i> New Prompt</button>
          <span style="font-size:0.85rem; color:var(--text-secondary); display:flex; align-items:center;">Best Score: <strong id="bestWpm" style="margin-left:4px; color:var(--primary);">0 WPM</strong></span>
        </div>
      </div>

      <!-- Game Mode -->
      <div id="gameArea" style="display: none;">
        <div class="shooter-wrapper">
          <canvas id="shooterCanvas" width="800" height="450"></canvas>
        </div>
        <input type="text" id="gameInput" class="type-input" placeholder="Type falling words and press Enter to shoot!" autocomplete="off">
        <div style="margin-top: 12px; display: flex; justify-content: space-between;">
          <button class="btn btn-primary btn-sm" id="gameStartBtn" onclick="toggleGame()"><i class="fas fa-play"></i> Start Game</button>
          <span style="font-size:0.85rem; color:var(--text-secondary); display:flex; align-items:center;">Arcade Score: <strong id="gameScoreVal" style="margin-left:4px; color:var(--primary);">0</strong></span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const PROMPTS = [
      "Artificial intelligence and creative tools empower people around the world to build beautiful web apps and designs faster than ever before.",
      "The quick brown fox jumps over the lazy dog while the autumn wind rustles the golden leaves across the quiet mountain trail.",
      "Writing clean and maintainable code is an essential craft that bridges human creativity with computational problem solving.",
      "Innovation distinguishes between a leader and a follower. Great software is built with curiosity, persistence, and attention to detail.",
      "Success in typing requires rhythmic muscle memory, proper finger placement, and consistent daily practice to build speed."
    ];

    let currentPrompt = '';
    let testStarted = false;
    let testTimeLeft = 60;
    let timer = null;
    let totalCharsTyped = 0;
    let errorCount = 0;
    let bestScore = parseInt(localStorage.getItem('aibots_best_wpm') || '0');
    document.getElementById('bestWpm').textContent = `${bestScore} WPM`;

    function initTest() {
      clearInterval(timer);
      testStarted = false;
      testTimeLeft = 60;
      totalCharsTyped = 0;
      errorCount = 0;

      document.getElementById('wpmVal').textContent = '0';
      document.getElementById('accVal').textContent = '100%';
      document.getElementById('errVal').textContent = '0';
      document.getElementById('timeVal').textContent = '60s';

      currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
      renderPromptText(0);

      const input = document.getElementById('typeInput');
      input.value = '';
      input.disabled = false;
      input.focus();
    }

    function renderPromptText(currIndex) {
      const display = document.getElementById('promptDisplay');
      display.innerHTML = currentPrompt.split('').map((char, i) => {
        let cls = '';
        if (i < currIndex) cls = 'char-correct';
        else if (i === currIndex) cls = 'char-current';
        return `<span class="${cls}">${char}</span>`;
      }).join('');
    }

    document.getElementById('typeInput').addEventListener('input', (e) => {
      if (!testStarted) {
        testStarted = true;
        timer = setInterval(testTick, 1000);
      }

      const val = e.target.value;
      let mistakes = 0;

      const spans = document.getElementById('promptDisplay').querySelectorAll('span');
      spans.forEach((span, i) => {
        if (i < val.length) {
          if (val[i] === currentPrompt[i]) {
            span.className = 'char-correct';
          } else {
            span.className = 'char-wrong';
            mistakes++;
          }
        } else if (i === val.length) {
          span.className = 'char-current';
        } else {
          span.className = '';
        }
      });

      errorCount = mistakes;
      totalCharsTyped = val.length;

      const elapsedMins = (60 - testTimeLeft) / 60 || 0.01;
      const words = (val.length / 5);
      const wpm = Math.max(0, Math.round((words - mistakes) / elapsedMins));
      const accuracy = totalCharsTyped > 0 ? Math.max(0, Math.round(((totalCharsTyped - mistakes) / totalCharsTyped) * 100)) : 100;

      document.getElementById('wpmVal').textContent = wpm;
      document.getElementById('accVal').textContent = `${accuracy}%`;
      document.getElementById('errVal').textContent = mistakes;

      if (val === currentPrompt) {
        clearInterval(timer);
        if (wpm > bestScore) {
          bestScore = wpm;
          localStorage.setItem('aibots_best_wpm', bestScore);
          document.getElementById('bestWpm').textContent = `${bestScore} WPM`;
        }
        alert(`🎉 Test Complete! Speed: ${wpm} WPM | Accuracy: ${accuracy}%`);
      }
    });

    function testTick() {
      testTimeLeft--;
      document.getElementById('timeVal').textContent = `${testTimeLeft}s`;
      if (testTimeLeft <= 0) {
        clearInterval(timer);
        document.getElementById('typeInput').disabled = true;
        alert(`⏰ Time's up! Your final typing speed: ${document.getElementById('wpmVal').textContent} WPM`);
      }
    }

    function switchMode(m) {
      document.getElementById('tabTest').classList.toggle('active', m === 'test');
      document.getElementById('tabGame').classList.toggle('active', m === 'game');
      document.getElementById('testArea').style.display = m === 'test' ? 'block' : 'none';
      document.getElementById('gameArea').style.display = m === 'game' ? 'block' : 'none';
      if (m === 'test') initTest();
    }

    // ── Space Shooter Game ──
    const gCanvas = document.getElementById('shooterCanvas');
    const gCtx = gCanvas.getContext('2d');
    const WORD_BANK = ['robot','cyber','planet','galaxy','speed','matrix','future','laser','spark','vector','shield','orbit','quantum','pixel','code'];
    let gameActive = false;
    let gameScore = 0;
    let fallingWords = [];
    let gameInterval = null;

    function toggleGame() {
      if (gameActive) {
        gameActive = false;
        clearInterval(gameInterval);
        document.getElementById('gameStartBtn').innerHTML = '<i class="fas fa-play"></i> Start Game';
      } else {
        gameActive = true;
        gameScore = 0;
        fallingWords = [];
        document.getElementById('gameScoreVal').textContent = '0';
        document.getElementById('gameStartBtn').innerHTML = '<i class="fas fa-stop"></i> End Game';
        document.getElementById('gameInput').focus();
        gameInterval = setInterval(spawnWord, 2200);
        requestAnimationFrame(gameLoop);
      }
    }

    function spawnWord() {
      const w = WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
      fallingWords.push({
        text: w,
        x: 50 + Math.random() * (gCanvas.width - 150),
        y: 20,
        speed: 1 + Math.random() * 0.8
      });
    }

    document.getElementById('gameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = e.target.value.toLowerCase().trim();
        e.target.value = '';
        const idx = fallingWords.findIndex(w => w.text.toLowerCase() === val);
        if (idx !== -1) {
          fallingWords.splice(idx, 1);
          gameScore += 10;
          document.getElementById('gameScoreVal').textContent = gameScore;
        }
      }
    });

    function gameLoop() {
      if (!gameActive) return;
      gCtx.fillStyle = '#090d16';
      gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);

      gCtx.fillStyle = '#38bdf8';
      gCtx.font = 'bold 18px monospace';

      for (let i = fallingWords.length - 1; i >= 0; i--) {
        const fw = fallingWords[i];
        fw.y += fw.speed;
        gCtx.fillText(fw.text, fw.x, fw.y);

        if (fw.y > gCanvas.height - 20) {
          fallingWords.splice(i, 1);
        }
      }
      requestAnimationFrame(gameLoop);
    }

    initTest();
  </script>
  <script src="js/app.js"></script>
</body>
</html>

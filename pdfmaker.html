  <main class="app-container tool-page-wrapper">

    <div class="pm-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">

      <div class="pm-panel">
        <h3><i class="fas fa-gear"></i> PDF Settings</h3>

        <div>
          <label class="form-label" style="font-size: 0.72rem; margin-bottom: 4px;">PAGE SIZE</label>
          <select id="pageSize" class="form-control">
            <option value="a4">A4 (Standard)</option>

        <div>

          <select id="pageOrientation" class="form-control">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>

          </select>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 0.85rem; font-weight: 600;">Add Page Numbers</span>
          <label class="switch"><input type="checkbox" id="addPageNumbers" checked><span class="slider"></span></label>
        </div>

        <div>
          <label class="form-label" style="font-size: 0.72rem; margin-bottom: 4px;">PDF FILE NAME</label>
          <input type="text" id="pdfFileName" class="form-control" value="my_images_document">
        </div>

        <button class="btn btn-primary" style="width: 100%; padding: 10px; font-weight: 700; margin-top: 6px;" onclick="generatePDF()">
          <i class="fas fa-file-arrow-down"></i> Download PDF
        </button>

        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="document.getElementById('fileInput').click()">
          <i class="fas fa-plus"></i> Add More Images
        </button>

      <!-- Thumbnails Grid -->
      <div class="pm-thumbs-grid" id="thumbsGrid">
        <!-- Thumbnails injected dynamically -->
      </div>
    </div>

  <script>
    let imagesList = [];

    function handleFiles(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            imagesList.push({
              src: ev.target.result,
              width: img.naturalWidth,
              height: img.naturalHeight,
              rotation: 0
            });
            loaded++;
            if (loaded === files.length) {
              renderThumbnails();
              document.getElementById('workspace').style.display = 'grid';
            }
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }

    function renderThumbnails() {
      const grid = document.getElementById('thumbsGrid');
      grid.innerHTML = '';

      imagesList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'pm-thumb-card';
        card.innerHTML = `
          <div class="thumb-page-num">${idx + 1}</div>
          <div class="thumb-img-wrap">
            <img src="${item.src}" style="transform: rotate(${item.rotation}deg);" alt="Page ${idx + 1}">
          </div>
          <div class="thumb-bar">
            <button class="thumb-btn" onclick="moveImage(${idx}, -1)" title="Move Left" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}><i class="fas fa-arrow-left"></i></button>
            <button class="thumb-btn" onclick="rotateImage(${idx})" title="Rotate 90°"><i class="fas fa-rotate-right"></i></button>
            <button class="thumb-btn" onclick="moveImage(${idx}, 1)" title="Move Right" ${idx === imagesList.length - 1 ? 'disabled style="opacity:0.3;"' : ''}><i class="fas fa-arrow-right"></i></button>
            <button class="thumb-btn" onclick="deleteImage(${idx})" title="Remove Page" style="color: #ef4444;"><i class="fas fa-trash"></i></button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function rotateImage(idx) {
      imagesList[idx].rotation = (imagesList[idx].rotation + 90) % 360;
      renderThumbnails();
    }

    function moveImage(idx, dir) {
      const newIdx = idx + dir;
      if (newIdx >= 0 && newIdx < imagesList.length) {
        const temp = imagesList[idx];
        imagesList[idx] = imagesList[newIdx];
        imagesList[newIdx] = temp;
        renderThumbnails();
      }
    }

    function deleteImage(idx) {
      imagesList.splice(idx, 1);
      if (imagesList.length === 0) {
        document.getElementById('workspace').style.display = 'none';
      } else {
        renderThumbnails();
      }
    }

    async function generatePDF() {
      if (imagesList.length === 0) return;
      const { jsPDF } = window.jspdf;

      const pageSize = document.getElementById('pageSize').value;
      const orientSetting = document.getElementById('pageOrientation').value;
      const margin = parseInt(document.getElementById('pageMargin').value) || 0;
      const addPageNums = document.getElementById('addPageNumbers').checked;
      const filename = (document.getElementById('pdfFileName').value.trim() || 'document') + '.pdf';

      const doc = new jsPDF({
        orientation: orientSetting === 'auto' ? 'portrait' : orientSetting,
        unit: 'mm',
        format: pageSize
      });

      for (let i = 0; i < imagesList.length; i++) {
        const item = imagesList[i];
        if (i > 0) doc.addPage();

        const img = new Image();
        img.src = item.src;
        await new Promise(r => img.onload = r);

        const canvas = document.createElement('canvas');
        const rot = item.rotation;
        if (rot === 90 || rot === 270) {
          canvas.width = img.naturalHeight;
          canvas.height = img.naturalWidth;
        } else {
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
        }
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rot * Math.PI) / 180);
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);

        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const availW = pageW - margin * 2;
        const availH = pageH - margin * 2;

        const imgRatio = canvas.width / canvas.height;
        let drawW = availW;
        let drawH = drawW / imgRatio;

        if (drawH > availH) {
          drawH = availH;
          drawW = drawH * imgRatio;
        }

        const posX = margin + (availW - drawW) / 2;
        const posY = margin + (availH - drawH) / 2;

        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        doc.addImage(imgData, 'JPEG', posX, posY, drawW, drawH);

        if (addPageNums) {
          doc.setFontSize(10);
          doc.setTextColor(100, 116, 139);
          doc.text(`Page ${i + 1} of ${imagesList.length}`, pageW / 2, pageH - 5, { align: 'center' });
        }
      }

      doc.save(filename);
    }
  </script>

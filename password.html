<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
  <meta name="google-site-verification" content="-Yb6Nx74gbZ3wRN5uP-Y8KKwDWlt1DPpxs4nA3PkE6M">
  <meta name="robots" content="index, follow">
  <title>Password Generator — AI Bots</title>
  <meta name="description" content="Generate ultra-strong random passwords with adjustable length, character rules, and live strength meter. 100% private.">
  <meta name="keywords" content="password generator, strong password generator, random password maker, secure password generator, ai bots password">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="canonical" href="https://www.aibots.co.in/password.html">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2L87FMQS3W');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .pw-out-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      font-family: monospace;
      font-size: 1.25rem;
      word-break: break-all;
    }
    .pw-out-box span { flex: 1; color: var(--text-primary); }
    .pw-meter {
      height: 8px;
      border-radius: 999px;
      background: var(--bg-primary);
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid var(--border-color);
    }
    .pw-meter-fill { height: 100%; width: 0%; transition: all 0.2s ease; }
    .pw-strength-label { font-size: 0.85rem; font-weight: 700; margin-top: 6px; }
    .opt-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
      color: var(--text-primary);
    }
    .opt-toggle:last-child { border-bottom: none; }
    .bulk-list {
      font-family: monospace;
      font-size: 0.9rem;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      margin-top: 12px;
    }
    .bulk-list div { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Password</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-key"></i> Security Tool</span>
      <h1 class="tool-title">Password Generator</h1>
      <p class="tool-desc">Create strong, cryptographically secure random passwords locally in your browser.</p>
    </div>

    <div class="tool-card-container" style="max-width: 680px; margin: 0 auto;">
      <div class="pw-out-box">
        <span id="pwOutput">Generating…</span>
        <button class="btn btn-secondary btn-sm" id="copyBtn" title="Copy"><i class="fas fa-copy"></i></button>
        <button class="btn btn-secondary btn-sm" id="regenBtn" title="Regenerate"><i class="fas fa-rotate"></i></button>
      </div>

      <div class="pw-meter"><div class="pw-meter-fill" id="meterFill"></div></div>
      <div class="pw-strength-label" id="strengthLabel"></div>

      <div style="margin-top: 24px;">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px;">
          <span>PASSWORD LENGTH</span>
          <span id="lenVal" style="color: var(--primary);">16</span>
        </div>
        <input type="range" id="lenSlider" min="6" max="64" value="16" class="slider" style="width: 100%;">
      </div>

      <div style="margin-top: 20px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 6px 16px;">
        <div class="opt-toggle">
          <span>Uppercase (A–Z)</span>
          <label class="switch"><input type="checkbox" id="optUpper" checked><span class="slider"></span></label>
        </div>
        <div class="opt-toggle">
          <span>Lowercase (a–z)</span>
          <label class="switch"><input type="checkbox" id="optLower" checked><span class="slider"></span></label>
        </div>
        <div class="opt-toggle">
          <span>Numbers (0–9)</span>
          <label class="switch"><input type="checkbox" id="optNumbers" checked><span class="slider"></span></label>
        </div>
        <div class="opt-toggle">
          <span>Symbols (!@#$…)</span>
          <label class="switch"><input type="checkbox" id="optSymbols" checked><span class="slider"></span></label>
        </div>
        <div class="opt-toggle">
          <span>Exclude ambiguous (l, 1, O, 0)</span>
          <label class="switch"><input type="checkbox" id="optAmbig"><span class="slider"></span></label>
        </div>
      </div>

      <button class="btn btn-primary" style="width: 100%; margin-top: 20px; padding: 12px;" id="genBtn">
        <i class="fas fa-wand-magic-sparkles"></i> Generate Password
      </button>

      <details style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <summary style="cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--text-secondary);">Generate Bulk Passwords</summary>
        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <input type="number" id="bulkCount" class="form-control" value="5" min="1" max="50" style="max-width: 100px;">
          <button class="btn btn-secondary btn-sm" id="bulkBtn">Generate List</button>
        </div>
        <div class="bulk-list" id="bulkList" style="display: none;"></div>
      </details>
    </div>
  </main>

  <script>
    const AMBIG = 'l1IO0';
    const SETS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_-+=[]{};:,.<>?'
    };

    const lenSlider = document.getElementById('lenSlider');
    const lenVal = document.getElementById('lenVal');
    const output = document.getElementById('pwOutput');
    const meterFill = document.getElementById('meterFill');
    const strengthLabel = document.getElementById('strengthLabel');

    lenSlider.addEventListener('input', () => { lenVal.textContent = lenSlider.value; generate(); });
    ['optUpper','optLower','optNumbers','optSymbols','optAmbig'].forEach(id => {
      document.getElementById(id).addEventListener('change', generate);
    });

    function randomInt(max) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % max;
    }

    function buildCharset() {
      let charset = '';
      if (document.getElementById('optUpper').checked) charset += SETS.upper;
      if (document.getElementById('optLower').checked) charset += SETS.lower;
      if (document.getElementById('optNumbers').checked) charset += SETS.numbers;
      if (document.getElementById('optSymbols').checked) charset += SETS.symbols;
      if (document.getElementById('optAmbig').checked) {
        charset = charset.split('').filter(c => !AMBIG.includes(c)).join('');
      }
      return charset;
    }

    function generateOne() {
      const charset = buildCharset();
      if (!charset) return '';
      const len = +lenSlider.value;
      let pw = '';
      for (let i = 0; i < len; i++) pw += charset[randomInt(charset.length)];
      return pw;
    }

    function scoreStrength(pw) {
      let pool = 0;
      if (/[a-z]/.test(pw)) pool += 26;
      if (/[A-Z]/.test(pw)) pool += 26;
      if (/[0-9]/.test(pw)) pool += 10;
      if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
      const bitsPerChar = Math.log2(pool || 1);
      const entropy = bitsPerChar * pw.length;
      if (entropy < 40) return { pct: 25, label: 'Weak', color: '#ef4444' };
      if (entropy < 60) return { pct: 50, label: 'Fair', color: '#f59e0b' };
      if (entropy < 90) return { pct: 75, label: 'Strong', color: '#10b981' };
      return { pct: 100, label: 'Very Strong', color: '#10b981' };
    }

    function generate() {
      const pw = generateOne();
      output.textContent = pw || 'Select at least one character type';
      if (!pw) { meterFill.style.width = '0%'; strengthLabel.textContent = ''; return; }
      const s = scoreStrength(pw);
      meterFill.style.width = s.pct + '%';
      meterFill.style.background = s.color;
      strengthLabel.textContent = s.label;
      strengthLabel.style.color = s.color;
    }

    document.getElementById('genBtn').addEventListener('click', generate);
    document.getElementById('regenBtn').addEventListener('click', generate);
    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(output.textContent).then(() => alert('Password copied to clipboard!'));
    });

    document.getElementById('bulkBtn').addEventListener('click', () => {
      const count = Math.min(+document.getElementById('bulkCount').value || 5, 50);
      const list = document.getElementById('bulkList');
      list.style.display = 'block';
      list.innerHTML = Array.from({length: count}, () => `<div>${generateOne()}</div>`).join('');
    });

    generate();
  </script>
  <script src="js/app.js"></script>
</body>
</html>

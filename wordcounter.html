<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="https://i.ibb.co/G2NFYHG/logo.png" alt="AI Bots Logo" class="brand-logo-img">

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-spell-check"></i> Writing & SEO Tool</span>
      <h1 class="tool-title">Word Counter</h1>
      <p class="tool-desc">Paste or type text to see live word, character and reading-time stats, plus top keywords.</p>
    </div>

    <div class="wc-wrap">
      <div class="tool-card-container">
        <textarea id="wcInput" placeholder="Start typing or paste your text here…"></textarea>
        <div class="btn-bar">
          <button class="btn btn-secondary btn-sm" id="clearBtn"><i class="fas fa-trash"></i> Clear</button>
          <button class="btn btn-secondary btn-sm" id="copyBtn"><i class="fas fa-copy"></i> Copy Text</button>
          <button class="btn btn-secondary btn-sm" id="upperBtn">UPPERCASE</button>
          <button class="btn btn-secondary btn-sm" id="lowerBtn">lowercase</button>
          <button class="btn btn-secondary btn-sm" id="titleBtn">Title Case</button>
        </div>
      </div>

      <div class="tool-card-container">
        <div class="stat-grid">
          <div class="stat"><div class="v" id="stWords">0</div><div class="l">Words</div></div>
          <div class="stat"><div class="v" id="stChars">0</div><div class="l">Characters</div></div>
          <div class="stat"><div class="v" id="stCharsNs">0</div><div class="l">No spaces</div></div>
          <div class="stat"><div class="v" id="stSentences">0</div><div class="l">Sentences</div></div>
          <div class="stat"><div class="v" id="stParas">0</div><div class="l">Paragraphs</div></div>
          <div class="stat"><div class="v" id="stTime">0m</div><div class="l">Read time</div></div>
        </div>
        <h3 style="font-size: 0.9rem; font-weight: 700; margin: 18px 0 8px; color: var(--text-primary);">Top Keywords</h3>
        <div id="kwList" style="color: var(--text-secondary); font-size: 0.82rem;">Nothing yet.</div>
      </div>
    </div>
  </main>

  <script>
    const input = document.getElementById('wcInput');
    const STOPWORDS = new Set(['the','a','an','and','or','but','is','are','was','were','to','of','in','on','for','with','as','at','by','it','this','that','be','have','has','had','i','you','he','she','they','we','my','your','their','our','not','so','if','from']);

    function analyze() {
      const text = input.value;
      const words = (text.match(/[A-Za-z0-9''-]+/g) || []);
      const chars = text.length;
      const charsNs = text.replace(/\s/g,'').length;
      const sentences = (text.match(/[.!?]+(\s|$)/g) || []).length || (text.trim() ? 1 : 0);
      const paras = text.split(/\n{2,}|\n/).filter(p => p.trim()).length;
      const readMins = Math.max(1, Math.round(words.length / 200));

      document.getElementById('stWords').textContent = words.length;
      document.getElementById('stChars').textContent = chars;
      document.getElementById('stCharsNs').textContent = charsNs;
      document.getElementById('stSentences').textContent = sentences;
      document.getElementById('stParas').textContent = paras;
      document.getElementById('stTime').textContent = text.trim() ? readMins + 'm' : '0m';

      const freq = {};
      words.forEach(w => {
        const lw = w.toLowerCase();
        if (lw.length < 3 || STOPWORDS.has(lw)) return;
        freq[lw] = (freq[lw] || 0) + 1;
      });
      const top = Object.entries(freq).sort((a,b) => b[1] - a[1]).slice(0, 6);
      const kwList = document.getElementById('kwList');
      if (!top.length) { kwList.textContent = 'Nothing yet.'; return; }
      kwList.innerHTML = top.map(([w, c]) => `<div class="kw-row"><span>${w}</span><span style="font-family:monospace; font-weight:700; color:var(--primary);">${c}</span></div>`).join('');
    }

    input.addEventListener('input', analyze);
    document.getElementById('clearBtn').addEventListener('click', () => { input.value = ''; analyze(); });
    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(input.value).then(() => alert('Copied to clipboard!'));
    });
    document.getElementById('upperBtn').addEventListener('click', () => { input.value = input.value.toUpperCase(); analyze(); });
    document.getElementById('lowerBtn').addEventListener('click', () => { input.value = input.value.toLowerCase(); analyze(); });
    document.getElementById('titleBtn').addEventListener('click', () => {
      input.value = input.value.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase());
      analyze();
    });

    analyze();
  </script>
  <script src="js/app.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
  <meta name="google-site-verification" content="-Yb6Nx74gbZ3wRN5uP-Y8KKwDWlt1DPpxs4nA3PkE6M">
  <meta name="robots" content="index, follow">
  <title>HD Video Player & Frame Grabber — AI Bots</title>
  <meta name="description" content="Play any local video in your browser with speed controls, Picture-in-Picture, loop, and instant screenshot frame capture. 100% private.">
  <meta name="keywords" content="video player online, play mp4 in browser, capture video frame, picture in picture video player, ai bots video">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="canonical" href="https://www.aibots.co.in/videoplayer.html">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2L87FMQS3W');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .vp-card { max-width: 920px; margin: 0 auto; }
    .vp-dropzone {
      border: 2px dashed var(--primary);
      border-radius: var(--radius-lg);
      padding: 44px 20px;
      text-align: center;
      background: var(--bg-secondary);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .vp-dropzone:hover { background: color-mix(in srgb, var(--primary) 8%, var(--bg-secondary)); }
    .vp-dropzone i { font-size: 2.8rem; color: var(--primary); margin-bottom: 10px; display: block; }
    .vp-dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

    .vp-player-box {
      background: #020617;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      margin-top: 20px;
    }
    video {
      width: 100%;
      max-height: 520px;
      display: block;
      background: #000;
    }
    .vp-controls-bar {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .vp-btn-group { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Video Player</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-play"></i> Media Tool</span>
      <h1 class="tool-title">HD Video Player</h1>
      <p class="tool-desc">Play local video files directly in your browser with speed adjustment, PiP, and frame capture.</p>
    </div>

    <div class="vp-card">
      <div class="vp-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="video/*" onchange="handleVideo(event)">
        <i class="fas fa-film"></i>
        <h3 style="margin:0 0 6px;">Choose or Drop a Video</h3>
        <p style="margin:0; color:var(--text-secondary); font-size:0.85rem;">Supports MP4, WebM, MOV, MKV, OGG</p>
      </div>

      <div class="vp-player-box" id="playerWrap" style="display: none;">
        <video id="videoEl" controls playsinline></video>

        <div class="vp-controls-bar">
          <div class="vp-btn-group">
            <span style="font-size: 0.85rem; color: var(--text-secondary);"><i class="fas fa-gauge-high"></i> Speed:</span>
            <select id="speedSel" class="form-control" style="width: 90px; padding: 4px 8px; font-size: 0.8rem;" onchange="setSpeed(this.value)">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x (Normal)</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>
          </div>

          <div class="vp-btn-group">
            <button class="btn btn-secondary btn-sm" onclick="togglePiP()"><i class="fas fa-up-right-from-square"></i> Mini Player (PiP)</button>
            <button class="btn btn-primary btn-sm" onclick="captureFrame()"><i class="fas fa-camera"></i> Capture Frame</button>
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('fileInput').click()"><i class="fas fa-folder-open"></i> Open Another</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById('videoEl');

    function handleVideo(e) {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      video.src = url;
      document.getElementById('playerWrap').style.display = 'block';
      document.getElementById('dropzone').style.display = 'none';
      video.play();
    }

    function setSpeed(val) {
      video.playbackRate = parseFloat(val);
    }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch(e) {
        alert("Picture-in-Picture not supported by your browser.");
      }
    }

    function captureFrame() {
      if (!video.videoWidth) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `frame_${Math.floor(video.currentTime)}s.png`;
      a.click();
    }
  </script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bots — Free Browser Tools</title>
<meta name="description" content="A free collection of browser tools: calculator, currency converter, background remover, PDF maker, weather, QR codes, password generator and more — no signup required.">
<meta name="keywords" content="free online tools, calculator, currency converter, background remover, pdf maker, qr code generator, password generator, unit converter">
<meta name="google-site-verification" content="-Yb6Nx74gbZ3wRN5uP-Y8KKwDWlt1DPpxs4nA3PkE6M">
<link rel="canonical" href="https://www.aibots.co.in/">
<link rel="icon" href="https://i.ibb.co/XjHbck3/logo.png" type="image/png">
<link rel="stylesheet" href="css/theme.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-2L87FMQS3W');</script>
</head>
<body class="ab-body" data-ab-page>
<div class="ab-topbar">
  <a href="index.html" class="ab-brand"><span class="ab-mark">AI</span> AI Bots</a>
  <div class="ab-topbar-spacer"></div>
  <button class="ab-icon-btn" id="abThemeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <a href="https://github.com/Rishitchajjed/aibots" class="ab-home-link" target="_blank" rel="noopener">GitHub ↗</a>
</div>

<main class="ab-main">
  <div class="ab-hero">
    <h1>Free tools that just <span class="accent">work.</span></h1>
    <p>No signup, no paywall. Every tool runs right in your browser — pick one below.</p>
    <div class="ab-search-wrap">
      <span class="ab-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search tools… e.g. “pdf”, “image”, “password”">
    </div>
  </div>

  <div class="ab-filters" id="catFilters"></div>
  <div class="ab-grid" id="toolGrid"></div>
  <div class="ab-empty ab-hidden" id="emptyState">No tools match your search.</div>
</main>

<script src="js/common.js"></script>
<script>
abInitTheme();

const grid = document.getElementById('toolGrid');
const searchInput = document.getElementById('searchInput');
const catFilters = document.getElementById('catFilters');
const emptyState = document.getElementById('emptyState');

const categories = ['All', ...new Set(AB_TOOLS.map(t=>t.cat))];
let activeCat = 'All';

categories.forEach(cat=>{
  const chip = document.createElement('button');
  chip.className = 'ab-chip' + (cat==='All' ? ' active' : '');
  chip.textContent = cat;
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('#catFilters .ab-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeCat = cat;
    render();
  });
  catFilters.appendChild(chip);
});

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = AB_TOOLS.filter(t=>{
    const matchesCat = activeCat === 'All' || t.cat === activeCat;
    const matchesQ = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q);
    return matchesCat && matchesQ;
  });

  grid.innerHTML = filtered.map(t => `
    <a href="${t.file}" class="ab-tool-card${t.isNew ? ' is-new' : ''}">
      <div class="icon">${t.icon}</div>
      <h3>${t.name}${t.isNew ? '<span class="new-tag">New</span>' : ''}</h3>
      <p>${t.desc}</p>
    </a>
  `).join('');

  emptyState.classList.toggle('ab-hidden', filtered.length > 0);
}

searchInput.addEventListener('input', render);
render();
</script>

<footer class="ab-footer">
  <div>© <span id="yr"></span> AI Bots — free browser tools, no signup.</div>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</footer>
</body>
</html>

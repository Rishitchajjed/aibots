<html>
<head>

<title>Image Combiner</title>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="css/theme.css" rel="stylesheet"/><link href="https://i.ibb.co/G2NFYHG/logo.png" rel="icon" type="image/png"/>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            margin: 0;
            font-size: 16px;
            line-height: 1.5;
        }

        main {
            padding: 20px;
            text-align: center;
        }

        form {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            margin-right: 10px;
            font-size: 18px;
            color: #333;
        }

        input[type="file"] {
            display: none;
        }

        #customFileUpload {
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #customFileUpload:hover {
            background-color: #555;
        }

        button {
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 10px;
        }

        button:hover {
            background-color: #555;
        }

        #imagePreview {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .preview-image {
            max-width: 150px;
            max-height: 150px;
            margin: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        #result {
            margin: 30px auto;
            max-width: 100%;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .combined-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            margin: 0 auto;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            cursor: move;
        }

        #downloadButton {
            display: none;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #downloadButton:hover {

        }

        #logo {
            height: 85px;

        }
    </style>

<body>
<header>
<img alt="Logo" id="logo" src="https://i.ibb.co/G2NFYHG/logo.png"/>
<h1>Image Combiner</h1>
</header>
<main>
<p>Welcome to the Image Combiner tool. Select multiple images, and they will be combined into a single image fitting within the chosen page size without maintaining aspect ratios.</p>
<form enctype="multipart/form-data" id="imageForm">
<label for="imageFile" id="customFileUpload">Select Images</label>
<input id="imageFile" multiple="" type="file"/>
<br/><br/>
<label for="pageSize">Page Size:</label>
<select id="pageSize" onchange="updateCustomSizeInputs()">
<option selected="" value="a4">A4</option>
<option value="a3">A3</option>
<option value="a2">A2</option>
<option value="custom">Custom</option>
</select>
<div id="customSizeInputs" style="display: none;">
<label for="widthInput">Width:</label>
<input id="widthInput" min="1" type="number"/>
<label for="heightInput">Height:</label>
<input id="heightInput" min="1" type="number"/>
</div>
<br/><br/>
<label for="numPages">Number of Pages:</label>
<input id="numPages" min="1" type="number" value="1"/>
<br/><br/>
<button onclick="showPreview()" type="button">Show Preview</button>
<button onclick="combineImages()" type="button">Combine</button>
</form>
<div id="imagePreview">
<!-- Preview images will be shown here -->
</div>
<div id="result">
<!-- Combined images will be shown here -->
</div>
<button id="downloadButton" onclick="downloadImages()">Download Combined Images</button>
</main>
<script>
        var imageElements = [];
        var combinedImageURLs = [];

        function showPreview() {
            var files = document.getElementById('imageFile').files;
            var previewDiv = document.getElementById('imagePreview');
            previewDiv.innerHTML = '';
            imageElements = [];

            for (var i = 0; i < files.length; i++) {
                var file = files[i];
                var reader = new FileReader();

                reader.onload = function (e) {
                    var img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-image';
                    previewDiv.appendChild(img);
                    imageElements.push(img);
                };

                reader.readAsDataURL(file);
            }
        }

        function updateCustomSizeInputs() {
            var pageSizeDropdown = document.getElementById('pageSize');
            var customSizeInputs = document.getElementById('customSizeInputs');

            if (pageSizeDropdown.value === 'custom') {
                customSizeInputs.style.display = 'block';
            } else {
                customSizeInputs.style.display = 'none';
            }
        }

        function combineImages() {
            var pageSizeDropdown = document.getElementById('pageSize');
            var widthInput = document.getElementById('widthInput');
            var heightInput = document.getElementById('heightInput');
            var numPagesInput = document.getElementById('numPages');

            var selectedOption = pageSizeDropdown.value;
            var pageWidth, pageHeight;

            if (selectedOption === 'custom') {
                pageWidth = parseFloat(widthInput.value);
                pageHeight = parseFloat(heightInput.value);
            } else {
                var pageSizes = {
                    'a4': { width: 595, height: 842 },
                    'a3': { width: 842, height: 1191 },
                    'a2': { width: 1191, height: 1684 }
                };

                var pageSize = pageSizes[selectedOption];
                pageWidth = pageSize.width;
                pageHeight = pageSize.height;
            }

            var numImages = imageElements.length;
            var numColumns = Math.ceil(Math.sqrt(numImages));
            var numRows = Math.ceil(numImages / numColumns);
            var maxImageWidth = pageWidth / numColumns;
            var maxImageHeight = pageHeight / numRows;
            var numPages = Math.ceil(numImages / (numColumns * numRows));
            var imageIndex = 0;

            combinedImageURLs = [];

            for (var page = 0; page < numPagesInput.value && page < numPages; page++) {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                canvas.width = pageWidth;
                canvas.height = pageHeight;

                for (var row = 0; row < numRows; row++) {
                    for (var col = 0; col < numColumns; col++) {
                        var index = page * numColumns * numRows + row * numColumns + col;

                        if (index >= imageElements.length) {
                            break;
                        }

                        var image = imageElements[index];
                        var imageWidth = image.offsetWidth;
                        var imageHeight = image.offsetHeight;

                        var resizeRatio = Math.min(maxImageWidth / imageWidth, maxImageHeight / imageHeight);
                        var resizedWidth = imageWidth * resizeRatio;
                        var resizedHeight = imageHeight * resizeRatio;

                        var x = col * maxImageWidth + (maxImageWidth - resizedWidth) / 2;
                        var y = row * maxImageHeight + (maxImageHeight - resizedHeight) / 2;

                        ctx.drawImage(image, x, y, resizedWidth, resizedHeight);
                    }
                }

                combinedImageURLs.push(canvas.toDataURL('image/png'));
            }

            updateCombinedImages();
        }

        function updateCombinedImages() {
            var resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            for (var i = 0; i < combinedImageURLs.length; i++) {
                var img = document.createElement('img');
                img.src = combinedImageURLs[i];
                img.className = 'combined-image';
                resultDiv.appendChild(img);
            }

            var downloadButton = document.getElementById('downloadButton');
            downloadButton.style.display = 'inline-block';
        }

        function downloadImages() {
            if (combinedImageURLs.length === 0) {
                console.error('Combined image URLs are not available.');
                return;
            }

            for (var i = 0; i < combinedImageURLs.length; i++) {
                var a = document.createElement('a');
                a.href = combinedImageURLs[i];
                a.download = 'combined_images_page' + (i + 1) + '.png';
                a.click();
            }
        }
    </script>
<script src="js/common.js"></script><script>abInitChrome('imagecombiner');</script></body>
</html>

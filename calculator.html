<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2L87FMQS3W');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="-Yb6Nx74gbZ3wRN5uP-Y8KKwDWlt1DPpxs4nA3PkE6M">
  <link rel="icon" href="https://i.ibb.co/G2NFYHG/logo.png" type="image/png">
  <title>Calculator - AI Bots</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .calc-wrapper {
      max-width: 440px;
      margin: 0 auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow-xl);
    }

    .calc-screen-container {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 24px;
      text-align: right;
    }

    .calc-history {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calc-display {
      width: 100%;
      background: transparent;
      border: none;
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: right;
      outline: none;
      letter-spacing: 0.05em;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .calc-btn {
      height: 64px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      user-select: none;
    }

    .calc-btn:hover {
      background: var(--bg-secondary);
      border-color: var(--border-color-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .calc-btn:active {
      transform: translateY(1px);
    }

    .calc-btn.op {
      background: var(--primary-light);
      color: var(--primary);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .calc-btn.op:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .calc-btn.clear {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .calc-btn.clear:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .calc-btn.equals {
      background: var(--accent-gradient);
      color: #ffffff;
      grid-column: span 2;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .calc-btn.equals:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4);
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="https://i.ibb.co/G2NFYHG/logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Calculator</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-calculator"></i> Math & Science</span>
      <h1 class="tool-title">Enhanced Calculator</h1>
      <p class="tool-desc">Standard and scientific expressions evaluator powered by Math.js with keyboard typing support.</p>
    </div>

    <div class="calc-wrapper">
      <div class="calc-screen-container">
        <div class="calc-history" id="historyText">Ready</div>
        <input type="text" id="result" class="calc-display" placeholder="0" readonly>
      </div>

      <div class="calc-grid">
        <button onclick="clearResult()" class="calc-btn clear">C</button>
        <button onclick="calculateSquareRoot()" class="calc-btn op" title="Square Root">√</button>
        <button onclick="appendExponentiation()" class="calc-btn op" title="Power (^)">^</button>
        <button onclick="appendOperator('/')" class="calc-btn op">&divide;</button>

        <button onclick="appendNumber('7')" class="calc-btn">7</button>
        <button onclick="appendNumber('8')" class="calc-btn">8</button>
        <button onclick="appendNumber('9')" class="calc-btn">9</button>
        <button onclick="appendOperator('*')" class="calc-btn op">&times;</button>

        <button onclick="appendNumber('4')" class="calc-btn">4</button>
        <button onclick="appendNumber('5')" class="calc-btn">5</button>
        <button onclick="appendNumber('6')" class="calc-btn">6</button>
        <button onclick="appendOperator('-')" class="calc-btn op">&minus;</button>

        <button onclick="appendNumber('1')" class="calc-btn">1</button>
        <button onclick="appendNumber('2')" class="calc-btn">2</button>
        <button onclick="appendNumber('3')" class="calc-btn">3</button>
        <button onclick="appendOperator('+')" class="calc-btn op">+</button>

        <button onclick="appendNumber('0')" class="calc-btn">0</button>
        <button onclick="appendDecimalPoint()" class="calc-btn">.</button>
        <button onclick="calculate()" class="calc-btn equals">=</button>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="app-container">
      <p class="footer-text">&copy; 2026 AI Bots. All rights reserved.</p>
      <p class="footer-credits">Website designed by <strong>Rishit Chajjed</strong>.</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.4.4/math.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    const resultInput = document.getElementById("result");
    const historyText = document.getElementById("historyText");

    function appendNumber(num) {
      resultInput.value += num;
    }

    function appendOperator(operator) {
      if (resultInput.value === '' && operator === '-') {
        resultInput.value += '-';
        return;
      }
      if (resultInput.value !== '') {
        const lastChar = resultInput.value.slice(-1);
        if (['+', '-', '*', '/', '^'].includes(lastChar)) {
          resultInput.value = resultInput.value.slice(0, -1) + operator;
        } else {
          resultInput.value += operator;
        }
      }
    }

    function appendDecimalPoint() {
      const current = resultInput.value;
      const parts = current.split(/[\+\-\*\/\^]/);
      const lastPart = parts[parts.length - 1];
      if (!lastPart.includes('.')) {
        resultInput.value += '.';
      }
    }

    function calculate() {
      const expression = resultInput.value;
      if (!expression) return;
      let res;
      try {
        res = math.evaluate(expression);
        historyText.textContent = `${expression} =`;
        resultInput.value = res;
      } catch (error) {
        console.error("Evaluation error:", error);
        resultInput.value = "Error";
      }
    }

    function calculateSquareRoot() {
      const expression = resultInput.value;
      if (!expression) return;
      let res;
      try {
        const val = math.evaluate(expression);
        res = Math.sqrt(val);
        historyText.textContent = `√(${expression}) =`;
        resultInput.value = res;
      } catch (error) {
        console.error("Evaluation error:", error);
        resultInput.value = "Error";
      }
    }

    function appendExponentiation() {
      if (resultInput.value !== '') {
        resultInput.value += '^';
      }
    }

    function clearResult() {
      resultInput.value = '';
      historyText.textContent = 'Cleared';
    }

    // Physical Keyboard Listener
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      else if (e.key === '.') appendDecimalPoint();
      else if (['+', '-', '*', '/'].includes(e.key)) appendOperator(e.key);
      else if (e.key === '^') appendExponentiation();
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
      else if (e.key === 'Backspace') {
        resultInput.value = resultInput.value.slice(0, -1);
      }
      else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearResult();
    });
  </script>
</body>
</html>

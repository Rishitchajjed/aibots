<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="keywords" content="image to pdf, convert image to pdf, pdf maker online free, photo to pdf converter, batch jpg to pdf, free pdf generator, ai bots, aibots, ai bots co in, aibots.co.in, Rishit Chajjed">
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Maker — AI Bots</title>
<meta name="description" content="Turn one or more images into a downloadable PDF, right in your browser.">
<link rel="icon" href="https://i.ibb.co/G2NFYHG/logo.png" type="image/png">
<link rel="stylesheet" href="css/theme.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-2L87FMQS3W');</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  .pm-drop{ border:2px dashed var(--border); border-radius:var(--radius); padding:30px 20px; text-align:center; cursor:pointer; }
  .pm-drop:hover, .pm-drop.drag{ border-color:var(--accent); background:var(--accent-soft); }
  .pm-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin-top:16px; }
  .pm-thumb{ position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--surface-2); cursor:grab; }
  .pm-thumb img{ width:100%; height:110px; object-fit:cover; display:block; }
  .pm-thumb .rm{
    position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.6);
    color:#fff; border:none; cursor:pointer; font-size:13px; line-height:1;
  }
  .pm-thumb .idx{ position:absolute; bottom:5px; left:6px; font-size:11px; background:rgba(0,0,0,.55); color:#fff; padding:1px 6px; border-radius:6px; }
  .pm-thumb.dragging{ opacity:.4; }
  .opt-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:520px){ .opt-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="ab-shell">
  <div class="ab-page-head">
    <h1>📄 PDF Maker</h1>
    <p>Add images, drag to reorder, then export a clean PDF — one page per image.</p>
  </div>

  <div class="ab-card">
    <div class="pm-drop" id="dropZone">
      <div style="font-size:30px;">📤</div>
      <strong>Click or drag images here</strong>
      <p style="color:var(--ink-soft); font-size:13px; margin:4px 0 0;">You can add several images and reorder them below</p>
      <input type="file" id="fileInput" accept="image/*" multiple class="ab-hidden">
    </div>

    <div class="pm-grid" id="pmGrid"></div>

    <div class="opt-row ab-mt-24">
      <div class="ab-col">
        <label class="ab-label" for="pdfTitle">Document title (optional)</label>
        <input type="text" id="pdfTitle" class="ab-input" placeholder="e.g. Travel Photos">
      </div>
      <div class="ab-col">
        <label class="ab-label" for="pageSize">Page size</label>
        <select id="pageSize" class="ab-select">
          <option value="a4">A4</option>
          <option value="letter">US Letter</option>
          <option value="fit">Fit to image</option>
        </select>
      </div>
    </div>

    <div class="ab-row ab-mt-24" style="justify-content:center;">
      <button class="ab-btn" id="makeBtn" disabled>⬇ Download PDF</button>
      <button class="ab-btn secondary" id="clearBtn" disabled>Clear all</button>
    </div>
    <div class="ab-empty ab-hidden" id="pmStatus"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
abInitChrome('pdfmaker');

let images = []; // {id, dataUrl}
const grid = document.getElementById('pmGrid');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const makeBtn = document.getElementById('makeBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('pmStatus');

dropZone.addEventListener('click', ()=>fileInput.click());
dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', ()=>dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e=>{
  e.preventDefault(); dropZone.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', ()=> addFiles(fileInput.files));

function addFiles(fileList){
  Array.from(fileList).forEach(file=>{
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e=>{
      images.push({ id: Math.random().toString(36).slice(2), dataUrl: e.target.result });
      renderGrid();
    };
    reader.readAsDataURL(file);
  });
}

function renderGrid(){
  grid.innerHTML = '';
  images.forEach((img, i)=>{
    const div = document.createElement('div');
    div.className = 'pm-thumb';
    div.draggable = true;
    div.dataset.id = img.id;
    div.innerHTML = `<img src="${img.dataUrl}"><span class="idx">${i+1}</span><button class="rm" data-id="${img.id}">✕</button>`;
    grid.appendChild(div);
  });
  makeBtn.disabled = images.length === 0;
  clearBtn.disabled = images.length === 0;

  grid.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      images = images.filter(im => im.id !== btn.dataset.id);
      renderGrid();
    });
  });

  let dragEl = null;
  grid.querySelectorAll('.pm-thumb').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ dragEl = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); reorderFromDOM(); });
    el.addEventListener('dragover', e=>{
      e.preventDefault();
      if (!dragEl || dragEl === el) return;
      const rect = el.getBoundingClientRect();
      const after = (e.clientX - rect.left) > rect.width/2;
      el.parentNode.insertBefore(dragEl, after ? el.nextSibling : el);
    });
  });
}

function reorderFromDOM(){
  const ids = Array.from(grid.children).map(el=>el.dataset.id);
  images = ids.map(id => images.find(im=>im.id===id));
  renderGrid();
}

clearBtn.addEventListener('click', ()=>{ images = []; renderGrid(); });

makeBtn.addEventListener('click', async ()=>{
  if (!images.length) return;
  makeBtn.disabled = true;
  statusEl.classList.remove('ab-hidden');
  statusEl.textContent = 'Building your PDF…';

  const container = document.createElement('div');
  images.forEach(img=>{
    const page = document.createElement('div');
    page.style.pageBreakAfter = 'always';
    page.style.width = '100%';
    page.style.display = 'flex';
    page.style.alignItems = 'center';
    page.style.justifyContent = 'center';
    page.style.minHeight = '95vh';
    const im = document.createElement('img');
    im.src = img.dataUrl;
    im.style.maxWidth = '100%';
    im.style.maxHeight = '100%';
    page.appendChild(im);
    container.appendChild(page);
  });

  const sizeVal = document.getElementById('pageSize').value;
  const format = sizeVal === 'fit' ? undefined : sizeVal;
  const title = document.getElementById('pdfTitle').value.trim() || 'document';

  const opt = {
    margin: 10,
    filename: `${title}.pdf`,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: format || 'a4', orientation: 'portrait' }
  };

  try{
    await html2pdf().set(opt).from(container).save();
    statusEl.textContent = '✅ PDF downloaded.';
  }catch(e){
    statusEl.textContent = 'Something went wrong generating the PDF. Please try again.';
  }
  makeBtn.disabled = false;
});
</script>
</body>
</html>

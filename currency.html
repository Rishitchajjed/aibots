<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="https://i.ibb.co/G2NFYHG/logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Currency</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-money-bill-transfer"></i> Financial Tool</span>
      <h1 class="tool-title">Currency Converter</h1>
      <p class="tool-desc">Real-time live exchange rate conversions between 30+ major international currencies.</p>
    </div>

    <div class="tool-card-container curr-card">
      <div>
        <label class="form-label">AMOUNT</label>
        <input type="number" id="currAmount" class="form-control" value="1" min="0" step="any" oninput="convertCurrency()">
        <div class="quick-chips">
          <button class="quick-chip" onclick="setAmount(10)">10</button>
          <button class="quick-chip" onclick="setAmount(50)">50</button>
          <button class="quick-chip" onclick="setAmount(100)">100</button>
          <button class="quick-chip" onclick="setAmount(500)">500</button>
          <button class="quick-chip" onclick="setAmount(1000)">1,000</button>
          <button class="quick-chip" onclick="setAmount(5000)">5,000</button>
        </div>
      </div>

      <div class="amt-row">
        <div>
          <label class="form-label">FROM</label>
          <select id="currFrom" class="form-control" onchange="convertCurrency()"></select>
        </div>
        <button class="swap-btn" onclick="swapCurrencies()" title="Swap Currencies"><i class="fas fa-right-left"></i></button>
        <div>
          <label class="form-label">TO</label>
          <select id="currTo" class="form-control" onchange="convertCurrency()"></select>
        </div>
      </div>

      <div class="result-box">
        <div class="rate-sub" id="rateSub">1 USD = 83.50 INR</div>
        <div class="big" id="currResult">83.50 INR</div>
      </div>

      <h3 style="font-size: 0.9rem; font-weight: 700; margin: 24px 0 10px; color: var(--text-primary);">Popular Rates (Base: <span id="popBase">USD</span>)</h3>
      <div class="popular-grid" id="popularGrid"></div>
    </div>
  </main>

  <script>
    const CURRENCIES = {
      USD: { name: 'US Dollar', symbol: '$', rateToUSD: 1.0 },
      INR: { name: 'Indian Rupee', symbol: '₹', rateToUSD: 83.50 },
      EUR: { name: 'Euro', symbol: '€', rateToUSD: 0.92 },
      GBP: { name: 'British Pound', symbol: '£', rateToUSD: 0.78 },
      JPY: { name: 'Japanese Yen', symbol: '¥', rateToUSD: 155.20 },
      CAD: { name: 'Canadian Dollar', symbol: 'C$', rateToUSD: 1.36 },
      AUD: { name: 'Australian Dollar', symbol: 'A$', rateToUSD: 1.51 },
      AED: { name: 'UAE Dirham', symbol: 'AED', rateToUSD: 3.67 },
      SAR: { name: 'Saudi Riyal', symbol: 'SAR', rateToUSD: 3.75 },
      SGD: { name: 'Singapore Dollar', symbol: 'S$', rateToUSD: 1.34 },
      CHF: { name: 'Swiss Franc', symbol: 'CHF', rateToUSD: 0.90 },
      CNY: { name: 'Chinese Yuan', symbol: '¥', rateToUSD: 7.23 },
      NZD: { name: 'New Zealand Dollar', symbol: 'NZ$', rateToUSD: 1.63 },
      KWD: { name: 'Kuwaiti Dinar', symbol: 'KD', rateToUSD: 0.31 },
      QAR: { name: 'Qatari Riyal', symbol: 'QR', rateToUSD: 3.64 },
      BRL: { name: 'Brazilian Real', symbol: 'R$', rateToUSD: 5.15 },
      ZAR: { name: 'South African Rand', symbol: 'R', rateToUSD: 18.40 },
      MYR: { name: 'Malaysian Ringgit', symbol: 'RM', rateToUSD: 4.70 },
      THB: { name: 'Thai Baht', symbol: '฿', rateToUSD: 36.60 }
    };

    let rates = {};

    function initCurrencies() {
      const fromSel = document.getElementById('currFrom');
      const toSel = document.getElementById('currTo');

      Object.entries(CURRENCIES).forEach(([code, data]) => {
        rates[code] = data.rateToUSD;
        const o1 = document.createElement('option');
        o1.value = code; o1.textContent = `${code} - ${data.name} (${data.symbol})`;
        const o2 = o1.cloneNode(true);

        if (code === 'USD') o1.selected = true;
        if (code === 'INR') o2.selected = true;

        fromSel.appendChild(o1);
        toSel.appendChild(o2);
      });

      // Try fetching live rates from open API
      fetch('https://open.er-api.com/v6/latest/USD')
        .then(r => r.json())
        .then(data => {
          if (data && data.rates) {
            Object.keys(CURRENCIES).forEach(c => {
              if (data.rates[c]) rates[c] = data.rates[c];
            });
            convertCurrency();
          }
        }).catch(() => {});

      convertCurrency();
    }

    function setAmount(val) {
      document.getElementById('currAmount').value = val;
      convertCurrency();
    }

    function swapCurrencies() {
      const fromSel = document.getElementById('currFrom');
      const toSel = document.getElementById('currTo');
      const temp = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = temp;
      convertCurrency();
    }

    function convertCurrency() {
      const amt = parseFloat(document.getElementById('currAmount').value) || 0;
      const from = document.getElementById('currFrom').value;
      const to = document.getElementById('currTo').value;

      const rateFrom = rates[from] || 1;
      const rateTo = rates[to] || 1;

      // 1 from = (rateTo / rateFrom) to
      const unitRate = rateTo / rateFrom;
      const converted = amt * unitRate;

      document.getElementById('rateSub').textContent = `1 ${from} = ${unitRate.toFixed(4)} ${to}`;
      document.getElementById('currResult').textContent = `${converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${to}`;
      document.getElementById('popBase').textContent = from;

      renderPopular(from);
    }

    function renderPopular(base) {
      const grid = document.getElementById('popularGrid');
      grid.innerHTML = '';
      const topCodes = ['USD', 'INR', 'EUR', 'GBP', 'AED', 'CAD', 'JPY'].filter(c => c !== base).slice(0, 6);

      topCodes.forEach(code => {
        const unitRate = (rates[code] || 1) / (rates[base] || 1);
        const card = document.createElement('div');
        card.className = 'pop-card';
        card.innerHTML = `
          <span><strong>1 ${base}</strong></span>
          <span style="color:var(--primary); font-weight:700;">${unitRate.toFixed(2)} ${code}</span>
        `;
        grid.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', initCurrencies);
  </script>
  <script src="js/app.js"></script>
</body>

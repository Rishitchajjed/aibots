<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | AI Bots</title>
  <script>
    // GitHub Pages Clean URL Auto-Router:
    // If a user or Google visits /backremover, /currency, /about etc.,
    // this automatically routes them to the correct tool without showing .html in history
    (function() {
      var path = window.location.pathname;
      var cleanPath = path.replace(/\/+$/, '');
      var lastSegment = cleanPath.split('/').pop();
      
      // Known valid tools list
      var validTools = ['index', 'about', 'sitemap', 'logo-kit', 'donate', 'backremover', 'cropphoto', 'resizeimage', 'imagecombiner', 'imagelink', 'photogenerator', 'logomaker', 'videoeditor', 'videoplayer', 'video', 'bank-statement-converter', 'invoice', 'print', 'pdfmaker', 'pdfviewer', 'currency', 'buisnesscard', 'emojis', 'chatbot', 'qrcode', 'password', 'unitconverter', 'wordcounter', 'weather', 'timer', 'endchanger', 'calculator', 'cricketscore', 'cricket', 'game', 'typingpractice'];
      
      if (lastSegment && validTools.indexOf(lastSegment.toLowerCase()) !== -1) {
        window.location.replace(cleanPath + '.html' + window.location.search + window.location.hash);
        return;
      }
    })();
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .not-found-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 30px;
      max-width: 480px;
      box-shadow: var(--shadow-xl);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Bots">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="author" content="Rishit Chajjed">
  <meta name="creator" content="Rishit Chajjed">
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="not-found-card">
    <div style="font-size: 3.5rem; color: var(--primary); margin-bottom: 12px;"><i class="fas fa-compass-drafting"></i></div>
    <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;">Page Not Found</h1>
    <p style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px;">
      The page you are looking for might have been moved or doesn't exist.
    </p>
    <a href="index.html" class="btn btn-primary" style="padding: 10px 24px; font-weight: 700;">
      <i class="fas fa-house"></i> Return to Studio Hub
    </a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter — AI Bots</title>
<meta name="description" content="Convert between 160+ currencies with live, daily-updated exchange rates.">
<link rel="icon" href="https://i.ibb.co/XjHbck3/logo.png" type="image/png">
<link rel="stylesheet" href="css/theme.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-2L87FMQS3W');</script>
<style>
  .conv-card{ max-width: 620px; margin: 0 auto; }
  .amt-row{ display:grid; grid-template-columns: 1fr auto 1fr; gap:10px; align-items:end; }
  .swap-btn{
    width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface);
    cursor:pointer; font-size:18px; color:var(--accent); transition:transform .2s ease;
  }
  .swap-btn:hover{ transform: rotate(180deg); border-color: var(--accent); }
  .result-box{
    margin-top:22px; padding:20px; border-radius:var(--radius); background:var(--accent-soft);
    text-align:center;
  }
  .result-box .big{ font-family:var(--font-mono); font-size:clamp(22px,5vw,32px); font-weight:700; color:var(--accent-dark); }
  .result-box .rate{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .fav-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .updated-note{ text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }
  select.ab-select{ cursor:pointer; }
</style>
</head>
<body>
<div class="ab-shell">
  <div class="ab-page-head">
    <h1>💱 Currency Converter</h1>
    <p>Live exchange rates for 160+ currencies, refreshed daily. Rates cache in your browser so repeat visits load instantly.</p>
  </div>

  <div class="ab-card conv-card">
    <div class="ab-col">
      <label class="ab-label" for="amount">Amount</label>
      <input type="number" id="amount" class="ab-input ab-mono" value="1" min="0" step="any">
    </div>

    <div class="amt-row ab-mt-16">
      <div class="ab-col">
        <label class="ab-label" for="from">From</label>
        <select id="from" class="ab-select"></select>
      </div>
      <button class="swap-btn" id="swapBtn" title="Swap currencies" aria-label="Swap currencies">⇄</button>
      <div class="ab-col">
        <label class="ab-label" for="to">To</label>
        <select id="to" class="ab-select"></select>
      </div>
    </div>

    <div class="fav-row" id="favRow"></div>

    <div class="result-box" id="resultBox">
      <div class="big" id="resultBig">Loading rates…</div>
      <div class="rate" id="rateLine"></div>
    </div>
    <div class="updated-note" id="updatedNote"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
abInitChrome('currency');

const CURRENCIES = {
  USD:"US Dollar",EUR:"Euro",GBP:"British Pound",JPY:"Japanese Yen",INR:"Indian Rupee",
  AUD:"Australian Dollar",CAD:"Canadian Dollar",CHF:"Swiss Franc",CNY:"Chinese Yuan",
  HKD:"Hong Kong Dollar",NZD:"New Zealand Dollar",SEK:"Swedish Krona",KRW:"South Korean Won",
  SGD:"Singapore Dollar",NOK:"Norwegian Krone",MXN:"Mexican Peso",AED:"UAE Dirham",
  ZAR:"South African Rand",BRL:"Brazilian Real",RUB:"Russian Ruble",TRY:"Turkish Lira",
  THB:"Thai Baht",IDR:"Indonesian Rupiah",MYR:"Malaysian Ringgit",PHP:"Philippine Peso",
  PLN:"Polish Zloty",DKK:"Danish Krone",ILS:"Israeli Shekel",SAR:"Saudi Riyal",PKR:"Pakistani Rupee",
  BDT:"Bangladeshi Taka",VND:"Vietnamese Dong",EGP:"Egyptian Pound",NGN:"Nigerian Naira",
  ARS:"Argentine Peso",CZK:"Czech Koruna",HUF:"Hungarian Forint",COP:"Colombian Peso"
};
const FAVORITES = ['USD','EUR','GBP','INR','JPY'];

const fromSel = document.getElementById('from');
const toSel = document.getElementById('to');
const amountInput = document.getElementById('amount');
const resultBig = document.getElementById('resultBig');
const rateLine = document.getElementById('rateLine');
const updatedNote = document.getElementById('updatedNote');
const favRow = document.getElementById('favRow');

function buildOptions(sel, selected){
  Object.entries(CURRENCIES).forEach(([code,name])=>{
    const opt = document.createElement('option');
    opt.value = code; opt.textContent = `${code} — ${name}`;
    if (code === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}
buildOptions(fromSel, 'USD');
buildOptions(toSel, 'INR');

FAVORITES.forEach(code=>{
  const chip = document.createElement('button');
  chip.className = 'ab-chip';
  chip.textContent = code;
  chip.addEventListener('click', ()=>{ toSel.value = code; convert(); });
  favRow.appendChild(chip);
});

let ratesCache = null;
let ratesBase = null;
let ratesTime = null;

async function loadRates(base){
  const cacheKey = `ab-fx-${base}`;
  const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
  const sixHours = 6 * 60 * 60 * 1000;
  if (cached && (Date.now() - cached.fetchedAt) < sixHours){
    ratesCache = cached.rates; ratesBase = base; ratesTime = cached.time;
    return;
  }
  const res = await fetch(`https://open.er-api.com/v6/latest/${base}`);
  const data = await res.json();
  if (data.result !== 'success') throw new Error('rate fetch failed');
  ratesCache = data.rates; ratesBase = base; ratesTime = data.time_last_update_utc;
  localStorage.setItem(cacheKey, JSON.stringify({ rates: data.rates, time: data.time_last_update_utc, fetchedAt: Date.now() }));
}

async function convert(){
  const from = fromSel.value, to = toSel.value;
  const amount = parseFloat(amountInput.value);
  resultBig.textContent = 'Loading…';
  try{
    if (ratesBase !== from) await loadRates(from);
    const rate = ratesCache[to];
    if (!rate){ resultBig.textContent = 'Rate unavailable'; return; }
    const converted = (amount || 0) * rate;
    resultBig.textContent = `${formatNum(amount||0)} ${from} = ${formatNum(converted)} ${to}`;
    rateLine.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
    updatedNote.textContent = ratesTime ? `Rates updated ${ratesTime} · via exchangerate-api.com` : '';
  }catch(err){
    resultBig.textContent = 'Could not load rates — check your connection.';
  }
}

function formatNum(n){
  return n.toLocaleString(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 2 });
}

document.getElementById('swapBtn').addEventListener('click', ()=>{
  const f = fromSel.value; fromSel.value = toSel.value; toSel.value = f;
  convert();
});

let debTimer;
[amountInput].forEach(el => el.addEventListener('input', ()=>{
  clearTimeout(debTimer); debTimer = setTimeout(convert, 250);
}));
[fromSel, toSel].forEach(el => el.addEventListener('change', convert));

convert();
</script>
</body>
</html>

  <style>
    .pm-container {
      max-width: 1040px;
      margin: 30px auto 80px;
      padding: 0 16px;
    }
    .pm-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .pm-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pm-dropzone {
      border: 2.5px dashed var(--primary, #ec4899);
      border-radius: 18px;
      padding: 44px 20px;
      text-align: center;
      background: var(--bg-secondary, #1e293b);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .pm-dropzone:hover {
      background: color-mix(in srgb, var(--primary, #ec4899) 10%, var(--bg-secondary));
    }
    .pm-dropzone i { font-size: 3.2rem; color: #ec4899; margin-bottom: 10px; display: block; }
    .pm-dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* Grid Layout */
    .pm-workspace {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
      margin-top: 28px;
    }
    @media (max-width: 820px) {
      .pm-workspace { grid-template-columns: 1fr; }
    }

    .pm-panel {
      background: var(--bg-secondary, #1e293b);
      border: 1px solid var(--border-color, rgba(255,255,255,0.1));
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-self: start;
    }
    .pm-panel h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f472b6;
    }

    /* Thumbnails Area */
    .pm-thumbs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      background: var(--bg-secondary, #1e293b);
      border: 1px solid var(--border-color, rgba(255,255,255,0.1));
      border-radius: 16px;
      padding: 20px;
      min-height: 280px;
      align-content: start;
    }
    .pm-thumb-card {
      background: var(--bg-primary, #0f172a);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .thumb-img-wrap {
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #020617;
    }
    .thumb-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s;
    }
    .thumb-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-color);
    }
    .thumb-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
      border-radius: 4px;
    }
    .thumb-btn:hover { color: #f472b6; background: rgba(244, 114, 182, 0.1); }
    .thumb-page-num {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
    }
  </style>

<body>

  <div class="pm-container">
    <div class="pm-header">
      <h1 class="pm-title"><i class="fas fa-file-pdf"></i> Image to PDF Converter</h1>
      <p style="margin: 0; color: var(--text-secondary); font-size: 0.95rem;">
        Combine photos, documents, and screenshots into a single organized PDF file.
      </p>
    </div>

    <!-- Dropzone -->
    <div class="pm-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(event)">
      <i class="fas fa-images"></i>
      <h3 style="margin: 0 0 6px;">Click or Drop Images Here</h3>
      <p style="margin: 0; color: var(--text-secondary); font-size: 0.85rem;">Upload multiple JPG, PNG, WebP photos (drag to reorder)</p>
    </div>

    <!-- Workspace -->
    <div class="pm-workspace" id="workspace" style="display: none;">
      <!-- PDF Settings -->
      <div class="pm-panel">
        <h3><i class="fas fa-gear"></i> PDF Settings</h3>

        <div>
          <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 4px;">PAGE SIZE</label>
          <select id="pageSize" class="ab-select">
            <option value="a4">A4 (Standard)</option>
            <option value="letter">Letter</option>
            <option value="legal">Legal</option>
          </select>
        </div>

        <div>
          <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 4px;">ORIENTATION</label>
          <select id="pageOrientation" class="ab-select">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
            <option value="auto">Auto (Match Image)</option>
          </select>
        </div>

        <div>
          <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 4px;">MARGINS</label>
          <select id="pageMargin" class="ab-select">
            <option value="0">No Margins (Edge-to-Edge)</option>
            <option value="5">Small (5 mm)</option>
            <option value="12" selected>Normal (12 mm)</option>
          </select>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 0.88rem; font-weight: 600;">Add Page Numbers</span>
          <label class="switch"><input type="checkbox" id="addPageNumbers" checked><span class="slider"></span></label>
        </div>

        <div>
          <label style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 4px;">PDF FILE NAME</label>
          <input type="text" id="pdfFileName" class="ab-input" value="my_images_document">
        </div>

        <button class="ab-btn" style="background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; width: 100%; padding: 12px; font-weight: 700; font-size: 0.95rem; margin-top: 8px;" onclick="generatePDF()">
          <i class="fas fa-file-arrow-down"></i> Download PDF
        </button>

        <button class="ab-btn" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); width: 100%;" onclick="document.getElementById('fileInput').click()">
          <i class="fas fa-plus"></i> Add More Images
        </button>
      </div>

      <!-- Thumbnails Grid -->
      <div class="pm-thumbs-grid" id="thumbsGrid">
        <!-- Thumbnails injected dynamically -->
      </div>
    </div>
  </div>

  <script>
    let imagesList = [];

    function handleFiles(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            imagesList.push({
              src: ev.target.result,
              width: img.naturalWidth,
              height: img.naturalHeight,
              rotation: 0
            });
            loaded++;
            if (loaded === files.length) {
              renderThumbnails();
              document.getElementById('workspace').style.display = 'grid';
            }
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }

    function renderThumbnails() {
      const grid = document.getElementById('thumbsGrid');
      grid.innerHTML = '';

      imagesList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'pm-thumb-card';
        card.innerHTML = `
          <div class="thumb-page-num">${idx + 1}</div>
          <div class="thumb-img-wrap">
            <img src="${item.src}" style="transform: rotate(${item.rotation}deg);" alt="Page ${idx + 1}">
          </div>
          <div class="thumb-bar">
            <button class="thumb-btn" onclick="moveImage(${idx}, -1)" title="Move Left" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}><i class="fas fa-arrow-left"></i></button>
            <button class="thumb-btn" onclick="rotateImage(${idx})" title="Rotate 90°"><i class="fas fa-rotate-right"></i></button>
            <button class="thumb-btn" onclick="moveImage(${idx}, 1)" title="Move Right" ${idx === imagesList.length - 1 ? 'disabled style="opacity:0.3;"' : ''}><i class="fas fa-arrow-right"></i></button>
            <button class="thumb-btn" onclick="deleteImage(${idx})" title="Remove Page" style="color: #ef4444;"><i class="fas fa-trash"></i></button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function rotateImage(idx) {
      imagesList[idx].rotation = (imagesList[idx].rotation + 90) % 360;
      renderThumbnails();
    }

    function moveImage(idx, dir) {
      const newIdx = idx + dir;
      if (newIdx >= 0 && newIdx < imagesList.length) {
        const temp = imagesList[idx];
        imagesList[idx] = imagesList[newIdx];
        imagesList[newIdx] = temp;
        renderThumbnails();
      }
    }

    function deleteImage(idx) {
      imagesList.splice(idx, 1);
      if (imagesList.length === 0) {
        document.getElementById('workspace').style.display = 'none';
      } else {
        renderThumbnails();
      }
    }

    async function generatePDF() {
      if (imagesList.length === 0) return;
      const { jsPDF } = window.jspdf;

      const pageSize = document.getElementById('pageSize').value;
      const orientSetting = document.getElementById('pageOrientation').value;
      const margin = parseInt(document.getElementById('pageMargin').value) || 0;
      const addPageNums = document.getElementById('addPageNumbers').checked;
      const filename = (document.getElementById('pdfFileName').value.trim() || 'document') + '.pdf';

      const doc = new jsPDF({
        orientation: orientSetting === 'auto' ? 'portrait' : orientSetting,
        unit: 'mm',
        format: pageSize
      });

      for (let i = 0; i < imagesList.length; i++) {
        const item = imagesList[i];
        if (i > 0) doc.addPage();

        // Handle rotation onto canvas
        const img = new Image();
        img.src = item.src;
        await new Promise(r => img.onload = r);

        const canvas = document.createElement('canvas');
        const rot = item.rotation;
        if (rot === 90 || rot === 270) {
          canvas.width = img.naturalHeight;
          canvas.height = img.naturalWidth;
        } else {
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
        }
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rot * Math.PI) / 180);
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);

        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const availW = pageW - margin * 2;
        const availH = pageH - margin * 2;

        const imgRatio = canvas.width / canvas.height;
        let drawW = availW;
        let drawH = drawW / imgRatio;

        if (drawH > availH) {
          drawH = availH;
          drawW = drawH * imgRatio;
        }

        const posX = margin + (availW - drawW) / 2;
        const posY = margin + (availH - drawH) / 2;

        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        doc.addImage(imgData, 'JPEG', posX, posY, drawW, drawH);

        if (addPageNums) {
          doc.setFontSize(10);
          doc.setTextColor(100, 116, 139);
          doc.text(`Page ${i + 1} of ${imagesList.length}`, pageW / 2, pageH - 5, { align: 'center' });
        }
      }

      doc.save(filename);
    }
  </script>

  <script src="js/common.js"></script>
  <script>abInitChrome('pdfmaker');</script>
</body>

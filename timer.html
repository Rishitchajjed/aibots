<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer & Stopwatch — AI Bots</title>
<meta name="description" content="Countdown timer, stopwatch with laps, and a Pomodoro focus timer, all in one page.">
<link rel="icon" href="https://i.ibb.co/XjHbck3/logo.png" type="image/png">
<link rel="stylesheet" href="css/theme.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-2L87FMQS3W');</script>
<style>
  .tm-card{ max-width: 560px; margin:0 auto; text-align:center; }
  .tm-face{
    font-family:var(--font-mono); font-size:clamp(52px,13vw,90px); font-weight:700; letter-spacing:-1px;
    margin:14px 0; color:var(--ink);
  }
  .tm-face.warn{ color:var(--danger); }
  .tm-ring{ position:relative; width:min(280px,70vw); height:min(280px,70vw); margin:10px auto; }
  .tm-ring svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .tm-ring circle{ fill:none; stroke-width:8; }
  .tm-ring .bg{ stroke:var(--surface-2); }
  .tm-ring .fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .3s linear; }
  .tm-ring .center{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }

  .tm-inputs{ display:flex; gap:8px; justify-content:center; }
  .tm-inputs .ab-col{ width:80px; }
  .tm-inputs input{ text-align:center; font-family:var(--font-mono); font-size:20px; }

  .lap-list{ margin-top:16px; max-height:220px; overflow:auto; text-align:left; }
  .lap-row{ display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:13.5px; }
  .lap-row:last-child{ border-bottom:none; }

  .pomo-stage{ font-weight:700; color:var(--accent); text-transform:uppercase; font-size:12.5px; letter-spacing:.06em; }
</style>
</head>
<body>
<div class="ab-shell">
  <div class="ab-page-head">
    <h1>⏱️ Timer & Stopwatch</h1>
    <p>Switch between a countdown timer, a stopwatch with lap tracking, and a Pomodoro focus session.</p>
  </div>

  <div class="ab-filters" style="margin-top:0;">
    <button class="ab-chip active" data-mode="countdown">Countdown</button>
    <button class="ab-chip" data-mode="stopwatch">Stopwatch</button>
    <button class="ab-chip" data-mode="pomodoro">Pomodoro</button>
  </div>

  <div class="ab-card tm-card ab-mt-24">

    <!-- Countdown -->
    <div id="modeCountdown">
      <div class="tm-inputs">
        <div class="ab-col"><label class="ab-label">Hours</label><input type="number" id="cdH" class="ab-input" min="0" value="0"></div>
        <div class="ab-col"><label class="ab-label">Mins</label><input type="number" id="cdM" class="ab-input" min="0" max="59" value="5"></div>
        <div class="ab-col"><label class="ab-label">Secs</label><input type="number" id="cdS" class="ab-input" min="0" max="59" value="0"></div>
      </div>
      <div class="tm-face ab-mono ab-mt-16" id="cdFace">05:00</div>
      <div class="ab-row" style="justify-content:center;">
        <button class="ab-btn" id="cdStart">Start</button>
        <button class="ab-btn secondary" id="cdPause" disabled>Pause</button>
        <button class="ab-btn secondary" id="cdReset">Reset</button>
      </div>
    </div>

    <!-- Stopwatch -->
    <div id="modeStopwatch" class="ab-hidden">
      <div class="tm-face ab-mono" id="swFace">00:00.00</div>
      <div class="ab-row" style="justify-content:center;">
        <button class="ab-btn" id="swStart">Start</button>
        <button class="ab-btn secondary" id="swLap" disabled>Lap</button>
        <button class="ab-btn secondary" id="swReset">Reset</button>
      </div>
      <div class="lap-list" id="lapList"></div>
    </div>

    <!-- Pomodoro -->
    <div id="modePomodoro" class="ab-hidden">
      <div class="pomo-stage" id="pomoStage">Focus</div>
      <div class="tm-ring">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="44"></circle>
          <circle class="fg" id="pomoRing" cx="50" cy="50" r="44" stroke-dasharray="276.5"></circle>
        </svg>
        <div class="center"><div class="tm-face ab-mono" id="pomoFace" style="margin:0; font-size:34px;">25:00</div></div>
      </div>
      <div class="ab-row" style="justify-content:center;">
        <button class="ab-btn" id="pomoStart">Start</button>
        <button class="ab-btn secondary" id="pomoSkip">Skip</button>
        <button class="ab-btn secondary" id="pomoReset">Reset</button>
      </div>
      <p style="color:var(--ink-soft); font-size:13px; margin-top:14px;">25 min focus · 5 min short break · 15 min break every 4th round</p>
    </div>

  </div>
</div>

<script src="js/common.js"></script>
<script>
abInitChrome('timer');

/* ---- mode switch ---- */
document.querySelectorAll('[data-mode]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['Countdown','Stopwatch','Pomodoro'].forEach(m=>{
      document.getElementById('mode'+m).classList.toggle('ab-hidden', 'mode'+m !== 'mode'+capitalize(btn.dataset.mode));
    });
  });
});
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
  }catch(e){}
}

/* ---- Countdown ---- */
let cdRemaining = 300, cdTimer = null;
const cdFace = document.getElementById('cdFace');
function fmt(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  return (h>0 ? String(h).padStart(2,'0')+':' : '') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function syncCdFromInputs(){
  const h = +document.getElementById('cdH').value||0, m = +document.getElementById('cdM').value||0, s = +document.getElementById('cdS').value||0;
  cdRemaining = h*3600+m*60+s;
  cdFace.textContent = fmt(cdRemaining);
}
['cdH','cdM','cdS'].forEach(id=>document.getElementById(id).addEventListener('input', syncCdFromInputs));
syncCdFromInputs();

document.getElementById('cdStart').addEventListener('click', ()=>{
  if (cdRemaining <= 0) return;
  document.getElementById('cdStart').disabled = true;
  document.getElementById('cdPause').disabled = false;
  cdTimer = setInterval(()=>{
    cdRemaining--;
    cdFace.textContent = fmt(Math.max(cdRemaining,0));
    cdFace.classList.toggle('warn', cdRemaining <= 10 && cdRemaining > 0);
    if (cdRemaining <= 0){
      clearInterval(cdTimer);
      playBeep(); abToast('⏰ Time\'s up!');
      document.getElementById('cdStart').disabled = false;
      document.getElementById('cdPause').disabled = true;
    }
  }, 1000);
});
document.getElementById('cdPause').addEventListener('click', ()=>{
  clearInterval(cdTimer);
  document.getElementById('cdStart').disabled = false;
  document.getElementById('cdPause').disabled = true;
});
document.getElementById('cdReset').addEventListener('click', ()=>{
  clearInterval(cdTimer);
  document.getElementById('cdStart').disabled = false;
  document.getElementById('cdPause').disabled = true;
  cdFace.classList.remove('warn');
  syncCdFromInputs();
});

/* ---- Stopwatch ---- */
let swStart = 0, swElapsed = 0, swTimer = null, laps = [];
const swFace = document.getElementById('swFace');
function fmtMs(ms){
  const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), cs = Math.floor((ms%1000)/10);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
}
document.getElementById('swStart').addEventListener('click', function(){
  if (!swTimer){
    swStart = Date.now() - swElapsed;
    swTimer = setInterval(()=>{ swElapsed = Date.now()-swStart; swFace.textContent = fmtMs(swElapsed); }, 30);
    this.textContent = 'Pause';
    document.getElementById('swLap').disabled = false;
  } else {
    clearInterval(swTimer); swTimer = null;
    this.textContent = 'Resume';
  }
});
document.getElementById('swLap').addEventListener('click', ()=>{
  laps.unshift({ n: laps.length+1, t: fmtMs(swElapsed) });
  document.getElementById('lapList').innerHTML = laps.map(l=>`<div class="lap-row"><span>Lap ${l.n}</span><span>${l.t}</span></div>`).join('');
});
document.getElementById('swReset').addEventListener('click', ()=>{
  clearInterval(swTimer); swTimer=null; swElapsed=0; laps=[];
  swFace.textContent = '00:00.00';
  document.getElementById('swStart').textContent = 'Start';
  document.getElementById('swLap').disabled = true;
  document.getElementById('lapList').innerHTML = '';
});

/* ---- Pomodoro ---- */
const POMO_FOCUS = 25*60, POMO_SHORT = 5*60, POMO_LONG = 15*60;
let pomoRemaining = POMO_FOCUS, pomoTimer = null, pomoRound = 1, pomoStageName = 'Focus';
const pomoFace = document.getElementById('pomoFace');
const pomoStageEl = document.getElementById('pomoStage');
const pomoRing = document.getElementById('pomoRing');
const RING_LEN = 276.5;
function pomoTotalForStage(){ return pomoStageName==='Focus'? POMO_FOCUS : (pomoRound % 4 === 0 ? POMO_LONG : POMO_SHORT); }
function updatePomoFace(){
  pomoFace.textContent = fmt(pomoRemaining);
  const total = pomoTotalForStage();
  const frac = pomoRemaining/total;
  pomoRing.style.strokeDashoffset = RING_LEN * (1-frac);
  pomoStageEl.textContent = pomoStageName + (pomoStageName==='Focus' ? ` · Round ${pomoRound}`: '');
}
pomoRing.style.strokeDashoffset = 0;
updatePomoFace();

document.getElementById('pomoStart').addEventListener('click', function(){
  if (!pomoTimer){
    pomoTimer = setInterval(()=>{
      pomoRemaining--;
      if (pomoRemaining < 0){
        playBeep();
        if (pomoStageName === 'Focus'){
          pomoStageName = (pomoRound % 4 === 0) ? 'Long break' : 'Short break';
        } else {
          pomoStageName = 'Focus'; pomoRound++;
        }
        pomoRemaining = pomoTotalForStage();
        abToast(`Now: ${pomoStageName}`);
      }
      updatePomoFace();
    }, 1000);
    this.textContent = 'Pause';
  } else {
    clearInterval(pomoTimer); pomoTimer = null;
    this.textContent = 'Resume';
  }
});
document.getElementById('pomoSkip').addEventListener('click', ()=>{
  pomoRemaining = 0;
});
document.getElementById('pomoReset').addEventListener('click', ()=>{
  clearInterval(pomoTimer); pomoTimer=null;
  pomoStageName='Focus'; pomoRound=1; pomoRemaining=POMO_FOCUS;
  document.getElementById('pomoStart').textContent='Start';
  updatePomoFace();
});
</script>
</body>
</html>

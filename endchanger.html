<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
  <meta name="google-site-verification" content="-Yb6Nx74gbZ3wRN5uP-Y8KKwDWlt1DPpxs4nA3PkE6M">
  <meta name="robots" content="index, follow">
  <title>File Extension Changer — AI Bots</title>
  <meta name="description" content="Change and convert file extensions online safely and easily. Supports document, image, audio, and code files. 100% free and in-browser.">
  <meta name="keywords" content="file extension changer, rename file extension online, change jpg to png, change docx to pdf, ai bots file tool">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="canonical" href="https://www.aibots.co.in/endchanger.html">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2L87FMQS3W');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .ext-dropzone {
      border: 2px dashed var(--primary);
      border-radius: var(--radius-lg);
      padding: 44px 20px;
      text-align: center;
      background: var(--bg-secondary);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .ext-dropzone:hover { background: color-mix(in srgb, var(--primary) 8%, var(--bg-secondary)); }
    .ext-dropzone i { font-size: 2.8rem; color: var(--primary); margin-bottom: 10px; display: block; }
    .ext-dropzone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .ext-card { max-width: 680px; margin: 0 auto; }
    .preset-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .preset-chip {
      background: var(--bg-primary); border: 1px solid var(--border-color);
      border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; font-weight: 700;
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s; font-family: monospace;
    }
    .preset-chip:hover { border-color: var(--primary); color: var(--primary); }
    .file-info-chip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-primary); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 12px 16px; margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">File Extension</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-file-signature"></i> File Utility</span>
      <h1 class="tool-title">File Extension Changer</h1>
      <p class="tool-desc">Quickly rename and export files with a new file extension directly in your browser.</p>
    </div>

    <div class="tool-card-container ext-card">
      <div class="ext-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" onchange="handleFile(event)">
        <i class="fas fa-file-import"></i>
        <h3 style="margin:0 0 6px;">Choose or Drop a File</h3>
        <p style="margin:0; color:var(--text-secondary); font-size:0.85rem;">Any file type supported</p>
      </div>

      <div id="fileArea" style="display:none; margin-top:20px;">
        <div class="file-info-chip">
          <div>
            <strong id="origFileName" style="display:block; font-size:0.95rem;">document.txt</strong>
            <span id="origFileSize" style="font-size:0.8rem; color:var(--text-secondary);">0 KB</span>
          </div>
          <span class="badge" style="background:var(--primary); color:white; padding:4px 8px; border-radius:6px; font-family:monospace;" id="currExtBadge">TXT</span>
        </div>

        <div style="margin-top: 16px;">
          <label class="form-label">NEW FILE NAME & EXTENSION</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="baseNameInput" class="form-control" style="flex: 1;" placeholder="File Name">
            <span style="display: flex; align-items: center; font-weight: 800; font-size: 1.2rem;">.</span>
            <input type="text" id="newExtInput" class="form-control" style="width: 90px; font-family: monospace; font-weight: 700; text-transform: lowercase;" placeholder="ext">
          </div>
        </div>

        <div style="margin-top: 16px;">
          <label class="form-label" style="font-size: 0.72rem;">QUICK EXTENSION PRESETS</label>
          <div class="preset-chips">
            <button class="preset-chip" onclick="setExt('pdf')">.pdf</button>
            <button class="preset-chip" onclick="setExt('png')">.png</button>
            <button class="preset-chip" onclick="setExt('jpg')">.jpg</button>
            <button class="preset-chip" onclick="setExt('webp')">.webp</button>
            <button class="preset-chip" onclick="setExt('txt')">.txt</button>
            <button class="preset-chip" onclick="setExt('csv')">.csv</button>
            <button class="preset-chip" onclick="setExt('json')">.json</button>
            <button class="preset-chip" onclick="setExt('html')">.html</button>
            <button class="preset-chip" onclick="setExt('mp3')">.mp3</button>
            <button class="preset-chip" onclick="setExt('mp4')">.mp4</button>
          </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-top: 24px; padding: 12px; font-weight: 700;" onclick="downloadNewFile()">
          <i class="fas fa-download"></i> Download with New Extension
        </button>
      </div>
    </div>
  </main>

  <script>
    let selectedFile = null;

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;

      const lastDot = file.name.lastIndexOf('.');
      const baseName = lastDot > 0 ? file.name.substring(0, lastDot) : file.name;
      const ext = lastDot > 0 ? file.name.substring(lastDot + 1) : '';

      document.getElementById('origFileName').textContent = file.name;
      document.getElementById('origFileSize').textContent = `${(file.size / 1024).toFixed(1)} KB`;
      document.getElementById('currExtBadge').textContent = ext.toUpperCase() || 'FILE';

      document.getElementById('baseNameInput').value = baseName;
      document.getElementById('newExtInput').value = ext.toLowerCase() || 'txt';

      document.getElementById('fileArea').style.display = 'block';
    }

    function setExt(ext) {
      document.getElementById('newExtInput').value = ext;
    }

    function downloadNewFile() {
      if (!selectedFile) return;
      const baseName = document.getElementById('baseNameInput').value.trim() || 'file';
      const ext = document.getElementById('newExtInput').value.trim().replace(/^\./, '');
      const finalName = ext ? `${baseName}.${ext}` : baseName;

      const blob = new Blob([selectedFile], { type: selectedFile.type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = finalName;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
  <script src="js/app.js"></script>
</body>
</html>

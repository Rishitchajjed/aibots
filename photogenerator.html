<meta charset="utf-8"/>
<title>Image Generator</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="css/theme.css" rel="stylesheet"/><link href="https://i.ibb.co/G2NFYHG/logo.png" rel="icon" type="image/x-icon"/>
<style>
    body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 20px;
            background: linear-gradient(yellow, orange);
        }
        h1 {
            color: #333;
        }
        .generator-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .generator-container input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 3px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        .generator-container button {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        .generator-container .photos-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .generator-container .photos-container .photo {
            margin: 10px;
            width: 200px;
            height: 200px;
            overflow: hidden;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .generator-container .photos-container .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }
        .generator-container .photos-container .photo:hover {
            transform: scale(1.05);
        }
        .generator-container .selected-photo {
            margin-top: 20px;
        }
        .generator-container .selected-photo img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }
        .generator-container .selected-photo button {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="generator-container" id="generator-container">
<h1>Image Generator</h1>
<img alt="AI Bots Logo" height="150px" src="https://i.ibb.co/G2NFYHG/logo.png" width="250px"/>
<input id="search-input" placeholder="Enter search term" type="text"/>
<button onclick="searchImages()">Search</button>
<div class="photos-container">
<!-- Photo elements will be dynamically added here -->
</div>
<div class="selected-photo">
<h3>Selected Photo:</h3>
<img id="selected-image" src=""/>
<br/>
<button onclick="downloadSelectedPhoto()" style="display: none;">Download</button>
</div>
</div>
<script>
        var selectedPhotoUrl = '';

        document.getElementById('search-input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                searchImages();
            }
        });

        function searchImages() {
            var searchTerm = document.getElementById('search-input').value.trim();

            if (searchTerm === '') {
                alert('Please enter a search term.');
                return;
            }

            var accessKey = "krm0d7mqv3OwJofRKwJsq51uFx9I5wJplmquliNSEVE";
            var apiUrl = "https://api.unsplash.com/search/photos?query=" + encodeURIComponent(searchTerm) + "&per_page=6&client_id=" + accessKey;

            var photosContainer = document.querySelector('.photos-container');
            photosContainer.innerHTML = '';

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    var searchResults = data.results;

                    for (var i = 0; i < searchResults.length; i++) {
                        var photoDiv = document.createElement('div');
                        photoDiv.classList.add('photo');

                        var photoImg = document.createElement('img');
                        photoImg.src = searchResults[i].urls.small;
                        photoImg.onclick = function() {
                            selectPhoto(this);
                        };

                        photoDiv.appendChild(photoImg);
                        photosContainer.appendChild(photoDiv);
                    }

                    clearSelectedPhoto();
                })
                .catch(error => {
                    console.log('Error:', error);
                });
        }

        function selectPhoto(photo) {
            var selectedImage = document.getElementById('selected-image');
            selectedImage.onload = function() {
                if (selectedImage.width > 600) {
                    selectedImage.width = 600;
                }
            };
            selectedImage.src = photo.src;
            selectedPhotoUrl = photo.src;

            var downloadButton = document.querySelector('.selected-photo button');
            downloadButton.style.display = 'block';
        }

        function downloadSelectedPhoto() {
            if (selectedPhotoUrl) {
                fetch(selectedPhotoUrl)
                    .then(response => response.blob())
                    .then(blob => {
                        var url = URL.createObjectURL(blob);
                        var link = document.createElement('a');
                        link.href = url;
                        link.download = 'selected-photo.jpg';
                        link.click();
                    })
                    .catch(error => {
                        console.log('Error:', error);
                    });
            }
        }

        function clearSelectedPhoto() {
            var selectedImage = document.getElementById('selected-image');
            selectedImage.src = '';

            selectedPhotoUrl = '';

            var downloadButton = document.querySelector('.selected-photo button');
            downloadButton.style.display = 'none';
        }
    </script>
<script src="js/common.js"></script><script>abInitChrome('photogenerator');</script></body>
</html>

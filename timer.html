      border-color: var(--primary); color: var(--primary);
    }
    .display-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .big-time {
      font-family: monospace;

    .ms-part { font-size: 0.55em; color: var(--primary); }
    .timer-btn-row { display: flex; justify-content: center; gap: 12px; }
    .t-btn {
      min-width: 110px; padding: 12px 24px; font-size: 1rem; font-weight: 700;
      border-radius: var(--radius-md); border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.15s;
    }
    .t-btn-start { background: var(--success); color: white; }
    .t-btn-stop { background: var(--danger); color: white; }
    .t-btn-lap { background: var(--primary); color: white; }
    .t-btn-reset { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-secondary); }
    .t-btn:hover { transform: translateY(-2px); }

    .laps-container {
      margin-top: 24px; max-height: 200px; overflow-y: auto;
      border-top: 1px solid var(--border-color); padding-top: 16px;
    }
    .lap-row {
      display: flex; justify-content: space-between; padding: 6px 14px;
      font-size: 0.88rem; font-family: monospace; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .preset-pills { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }

<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->

        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">

          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-stopwatch"></i> Precision Timing</span>
      <h1 class="tool-title">Stopwatch & Timer</h1>
      <p class="tool-desc">Digital stopwatch with lap tracking & customizable countdown timer with focus alarm.</p>
    </div>

    <div class="tool-card-container timer-card">
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabSw" onclick="setMode('stopwatch')"><i class="fas fa-stopwatch"></i> Stopwatch</button>
        <button class="mode-tab" id="tabCd" onclick="setMode('countdown')"><i class="fas fa-hourglass-half"></i> Countdown Timer</button>
      </div>

      <!-- Countdown Presets -->
      <div class="preset-pills" id="cdPresets" style="display:none;">
        <button class="preset-pill" onclick="setCdTime(60)">1 Min</button>
        <button class="preset-pill" onclick="setCdTime(300)">5 Mins</button>
        <button class="preset-pill" onclick="setCdTime(600)">10 Mins</button>
        <button class="preset-pill" onclick="setCdTime(1500)">25 Mins (Pomodoro)</button>
        <button class="preset-pill" onclick="setCdTime(3600)">1 Hour</button>
      </div>

      <div class="display-box">
        <div class="big-time" id="timeDisplay">00:00:00<span class="ms-part" id="msPart">.00</span></div>
      </div>

      <!-- Controls -->
      <div class="timer-btn-row">
        <button class="t-btn t-btn-start" id="startBtn" onclick="toggleStart()"><i class="fas fa-play"></i> Start</button>
        <button class="t-btn t-btn-lap" id="lapBtn" onclick="recordLap()"><i class="fas fa-flag"></i> Lap</button>
        <button class="t-btn t-btn-reset" onclick="resetTimer()"><i class="fas fa-rotate"></i> Reset</button>
      </div>

      <!-- Laps List -->
      <div class="laps-container" id="lapsContainer" style="display:none;">
        <div style="font-weight:700; font-size:0.8rem; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase;">Recorded Laps</div>
        <div id="lapsList"></div>
      </div>
    </div>
  </main>

  <script>
    let mode = 'stopwatch';
    let isRunning = false;
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;
    let laps = [];

    let cdTotalSec = 300;
    let cdRemaining = 300;

    function setMode(newMode) {
      if (isRunning) resetTimer();
      mode = newMode;
      document.getElementById('tabSw').classList.toggle('active', mode === 'stopwatch');
      document.getElementById('tabCd').classList.toggle('active', mode === 'countdown');
      document.getElementById('cdPresets').style.display = mode === 'countdown' ? 'flex' : 'none';
      document.getElementById('lapBtn').style.display = mode === 'stopwatch' ? 'inline-flex' : 'none';
      resetTimer();
    }

    function setCdTime(sec) {
      if (isRunning) resetTimer();
      cdTotalSec = sec;
      cdRemaining = sec;
      updateDisplay();
    }

    function toggleStart() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      document.getElementById('startBtn').className = 't-btn t-btn-stop';
      document.getElementById('startBtn').innerHTML = '<i class="fas fa-pause"></i> Pause';

      if (mode === 'stopwatch') {
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(updateStopwatch, 10);
      } else {
        startTime = Date.now();
        timerInterval = setInterval(updateCountdown, 100);
      }
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').className = 't-btn t-btn-start';
      document.getElementById('startBtn').innerHTML = '<i class="fas fa-play"></i> Resume';
    }

    function resetTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      elapsedTime = 0;
      laps = [];
      document.getElementById('lapsContainer').style.display = 'none';
      document.getElementById('lapsList').innerHTML = '';
      document.getElementById('startBtn').className = 't-btn t-btn-start';
      document.getElementById('startBtn').innerHTML = '<i class="fas fa-play"></i> Start';

      if (mode === 'countdown') {
        cdRemaining = cdTotalSec;
      }
      updateDisplay();
    }

    function updateStopwatch() {
      elapsedTime = Date.now() - startTime;
      updateDisplay();
    }

    function updateCountdown() {
      const now = Date.now();
      const elapsedSec = Math.floor((now - startTime) / 1000);
      cdRemaining = Math.max(0, cdTotalSec - elapsedSec);
      updateDisplay();

      if (cdRemaining === 0) {
        pauseTimer();
        playAlarm();
        alert("⏰ Time is up!");
      }
    }

    function updateDisplay() {
      if (mode === 'stopwatch') {
        const totalMs = elapsedTime;
        const ms = Math.floor((totalMs % 1000) / 10);
        const sec = Math.floor((totalMs / 1000) % 60);
        const min = Math.floor((totalMs / 60000) % 60);
        const hrs = Math.floor(totalMs / 3600000);

        const str = `${pad(hrs)}:${pad(min)}:${pad(sec)}`;
        document.getElementById('timeDisplay').childNodes[0].nodeValue = str;
        document.getElementById('msPart').textContent = `.${pad(ms)}`;
      } else {
        const sec = cdRemaining % 60;
        const min = Math.floor((cdRemaining / 60) % 60);
        const hrs = Math.floor(cdRemaining / 3600);

        const str = `${pad(hrs)}:${pad(min)}:${pad(sec)}`;
        document.getElementById('timeDisplay').childNodes[0].nodeValue = str;
        document.getElementById('msPart').textContent = '';
      }
    }

    function pad(n) { return n < 10 ? '0' + n : n; }

    function recordLap() {
      if (!isRunning && elapsedTime === 0) return;
      const totalMs = elapsedTime;
      const ms = Math.floor((totalMs % 1000) / 10);
      const sec = Math.floor((totalMs / 1000) % 60);
      const min = Math.floor((totalMs / 60000) % 60);
      const hrs = Math.floor(totalMs / 3600000);
      const lapTimeStr = `${pad(hrs)}:${pad(min)}:${pad(sec)}.${pad(ms)}`;

      laps.unshift(lapTimeStr);
      document.getElementById('lapsContainer').style.display = 'block';
      const list = document.getElementById('lapsList');
      list.innerHTML = laps.map((l, i) => `
        <div class="lap-row">
          <span>Lap ${laps.length - i}</span>
          <span style="color:var(--primary); font-weight:700;">${l}</span>
        </div>
      `).join('');
    }

    function playAlarm() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          [587, 880, 587, 880].forEach((freq, i) => {
            setTimeout(() => {
              const osc = ctx.createOscillator();
              const g = ctx.createGain();
              osc.frequency.setValueAtTime(freq, ctx.currentTime);
              g.gain.setValueAtTime(0.2, ctx.currentTime);
              osc.connect(g);
              g.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.15);
            }, i * 200);
          });
        }
      } catch(e) {}
    }

    updateDisplay();
  </script>
  <script src="js/app.js"></script>

<body class="ab-body">

  <script src="js/common.js"></script>
  <script>
    abInitChrome('audiorecorder');

    let mediaRecorder;
    let audioChunks = [];
    let audioBlob = null;
    let audioUrl = null;
    let audioCtx, analyser, sourceNode, gainNode;
    let animFrameId;
    let startTime, elapsedTime = 0, timerInterval;
    let isRecording = false;
    let isPaused = false;

    const btnToggleRecord = document.getElementById('btnToggleRecord');
    const btnPauseRecord = document.getElementById('btnPauseRecord');
    const btnStopRecord = document.getElementById('btnStopRecord');
    const recIcon = document.getElementById('recIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusText = document.getElementById('statusText');
    const playbackSection = document.getElementById('playbackSection');
    const audioPlayer = document.getElementById('audioPlayer');
    const canvas = document.getElementById('visualizerCanvas');
    const canvasCtx = canvas.getContext('2d');
    const volSlider = document.getElementById('volSlider');
    const volVal = document.getElementById('volVal');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');

    // Setup Canvas Resolution
    function resizeCanvas() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio || 600;
      canvas.height = canvas.clientHeight * window.devicePixelRatio || 160;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Visualizer Loop
    function drawVisualizer() {
      animFrameId = requestAnimationFrame(drawVisualizer);
      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteTimeDomainData(dataArray);

      canvasCtx.fillStyle = '#090d16';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      canvasCtx.lineWidth = 3;
      const gradient = canvasCtx.createLinearGradient(0, 0, canvas.width, 0);
      gradient.addColorStop(0, '#6366f1');
      gradient.addColorStop(0.5, '#ec4899');
      gradient.addColorStop(1, '#10b981');
      canvasCtx.strokeStyle = gradient;

      canvasCtx.beginPath();
      const sliceWidth = canvas.width * 1.0 / bufferLength;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;

        if (i === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);

        x += sliceWidth;
      }
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      const c = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
      return `${m}:${s}.${c}`;
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        sourceNode = audioCtx.createMediaStreamSource(stream);
        sourceNode.connect(analyser);

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          audioUrl = URL.createObjectURL(audioBlob);
          audioPlayer.src = audioUrl;
          playbackSection.style.display = 'block';
          statusText.textContent = 'Recording complete! You can listen, tweak settings, or download below.';
          stream.getTracks().forEach(t => t.stop());
        };

        mediaRecorder.start(100);
        isRecording = true;
        isPaused = false;
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(() => {
          elapsedTime = Date.now() - startTime;
          timerDisplay.textContent = formatTime(elapsedTime);
        }, 30);

        btnToggleRecord.classList.add('is-recording');
        recIcon.className = 'fas fa-square';
        btnPauseRecord.style.display = 'inline-flex';
        btnStopRecord.style.display = 'inline-flex';
        statusText.textContent = 'Recording in progress... Speak into your microphone.';
        playbackSection.style.display = 'none';

        drawVisualizer();
      } catch (err) {
        abToast('Microphone access denied: ' + err.message);
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      mediaRecorder.stop();
      isRecording = false;
      isPaused = false;
      clearInterval(timerInterval);
      cancelAnimationFrame(animFrameId);

      btnToggleRecord.classList.remove('is-recording');
      recIcon.className = 'fas fa-microphone';
      btnPauseRecord.style.display = 'none';
      btnStopRecord.style.display = 'none';

      // Clear Canvas Line
      canvasCtx.fillStyle = '#090d16';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      canvasCtx.strokeStyle = '#6366f1';
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, canvas.height / 2);
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
    }

    function togglePause() {
      if (!isRecording) return;
      if (isPaused) {
        mediaRecorder.resume();
        isPaused = false;
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(() => {
          elapsedTime = Date.now() - startTime;
          timerDisplay.textContent = formatTime(elapsedTime);
        }, 30);
        pauseIcon.className = 'fas fa-pause';
        statusText.textContent = 'Recording resumed...';
      } else {
        mediaRecorder.pause();
        isPaused = true;
        clearInterval(timerInterval);
        pauseIcon.className = 'fas fa-play';
        statusText.textContent = 'Recording paused.';
      }
    }

    btnToggleRecord.addEventListener('click', () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });

    btnPauseRecord.addEventListener('click', togglePause);
    btnStopRecord.addEventListener('click', stopRecording);

    document.getElementById('btnRestart').addEventListener('click', () => {
      elapsedTime = 0;
      timerDisplay.textContent = '00:00.00';
      startRecording();
    });

    // Speed and Volume controls
    speedSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      audioPlayer.playbackRate = val;
      speedVal.textContent = val.toFixed(2) + 'x';
    });

    volSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      audioPlayer.volume = Math.min(1.0, val / 100);
      volVal.textContent = val + '%';
    });

    // Download WebM
    document.getElementById('btnDownloadWebm').addEventListener('click', () => {
      if (!audioBlob) return;
      const a = document.createElement('a');
      a.href = audioUrl;
      a.download = `voice-recording-${Date.now()}.webm`;
      a.click();
      abToast('WebM Audio downloaded!');
    });

    // Download WAV (Convert WebM Audio to WAV format client-side)
    document.getElementById('btnDownloadWav').addEventListener('click', async () => {
      if (!audioBlob) return;
      abToast('Generating high-quality WAV...');
      const arrayBuffer = await audioBlob.arrayBuffer();
      const offlineCtx = new (window.AudioContext || window.webkitAudioContext)();
      const decodedData = await offlineCtx.decodeAudioData(arrayBuffer);
      const wavBlob = bufferToWave(decodedData, decodedData.length);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(wavBlob);
      a.download = `voice-studio-${Date.now()}.wav`;
      a.click();
      abToast('WAV file downloaded successfully!');
    });

    // WAV Encoder
    function bufferToWave(abuffer, len) {
      const numOfChan = abuffer.numberOfChannels;
      const length = len * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sampleRate = abuffer.sampleRate;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8); // file length - 8
      setUint32(0x45564157); // "WAVE"

      setUint32(0x20746d66); // "fmt " chunk
      setUint32(16);         // length = 16
      setUint16(1);          // PCM
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan); // byte rate
      setUint16(numOfChan * 2);              // block align
      setUint16(16);                         // 16-bit

      setUint32(0x61746164); // "data" - chunk
      setUint32(length - pos - 4);

      for (let i = 0; i < abuffer.numberOfChannels; i++) {
        channels.push(abuffer.getChannelData(i));
      }

      while (offset < len) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out], { type: 'audio/wav' });
    }
  </script>

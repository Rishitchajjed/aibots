<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Badge Gradient (Signature AI Bots Crimson) -->
    <linearGradient id="badgeGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ff2e4d"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Inner Gloss Top Specular Highlight -->
    <linearGradient id="glossGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e11d48" flood-opacity="0.35"/>
    </filter>

    <filter id="textGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="540" cy="540" r="520" fill="url(#outerGlow)"/>

  <!-- Main Circular Logo Badge with Shadow -->
  <circle cx="540" cy="540" r="440" fill="url(#badgeGrad)" filter="url(#shadowFilter)"/>

  <!-- Outer Ring Accent -->
  <circle cx="540" cy="540" r="438" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Glossy Glass Arc Reflection -->
  <path d="M 140 480 A 440 440 0 0 1 940 480 Q 540 600 140 480 Z" fill="url(#glossGrad)"/>

  <!-- Typography: AI BOTS -->
  <text x="540" y="475" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="160" 
        font-weight="900" 
        letter-spacing="18" 
        filter="url(#textGlow)">AI</text>

  <text x="540" y="655" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="145" 
        font-weight="900" 
        letter-spacing="22" 
        filter="url(#textGlow)">BOTS</text>

  <circle cx="540" cy="740" r="10" fill="#ffffff" fill-opacity="0.8"/>
</svg>
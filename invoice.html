<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="https://i.ibb.co/G2NFYHG/logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-receipt"></i> Document Generator</span>
      <h1 class="tool-title">Invoice Generator</h1>
      <p class="tool-desc">Create, customize, and export professional invoices with live automatic calculations.</p>
    </div>

    <div class="inv-container">
      <div class="inv-actions-bar">
        <button class="btn btn-secondary btn-sm" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
        <button class="btn btn-primary btn-sm" onclick="downloadInvoicePDF()"><i class="fas fa-download"></i> Download PDF</button>
      </div>

      <!-- Printable Invoice Sheet -->
      <div class="invoice-sheet" id="invoiceSheet">
        <!-- Top Row: Logo & Invoice Metadata -->
        <div class="sheet-row">
          <div class="sheet-col">
            <div class="inv-logo-box" onclick="document.getElementById('logoInput').click()">
              <img id="logoPreview" src="" style="display:none;" alt="Business Logo">
              <span id="logoPlaceholder" style="font-size: 0.78rem; color: #64748b; font-weight: 600; text-align: center;">
                <i class="fas fa-image" style="font-size: 1.1rem; display: block; margin-bottom: 2px;"></i>+ Add Logo
              </span>
              <input type="file" id="logoInput" accept="image/*" style="display:none;" onchange="handleLogo(event)">
            </div>
            <div class="inv-input-group" style="margin-top: 12px;">
              <input type="text" class="inv-input" id="businessName" placeholder="Your Business Name" style="font-size: 1.1rem; font-weight: 800;">
            </div>
            <div class="inv-input-group">
              <textarea class="inv-textarea" id="businessAddress" placeholder="Your Address, Phone, Email & GST/Tax ID"></textarea>
            </div>
          </div>

          <div class="sheet-col" style="max-width: 300px;">
            <h2 style="font-size: 1.8rem; font-weight: 900; color: #6366f1; text-align: right; margin: 0 0 14px;">INVOICE</h2>
            <div class="inv-input-group">
              <label class="inv-label">Invoice Number</label>
              <input type="text" class="inv-input" id="invNumber" value="INV-2026-001">
            </div>
            <div style="display: flex; gap: 8px;">
              <div class="inv-input-group" style="flex: 1;">
                <label class="inv-label">Issue Date</label>
                <input type="date" class="inv-input" id="invDate">
              </div>
              <div class="inv-input-group" style="flex: 1;">
                <label class="inv-label">Due Date</label>
                <input type="date" class="inv-input" id="invDueDate">
              </div>
            </div>
            <div class="inv-input-group">
              <label class="inv-label">Currency</label>
              <select class="inv-select" id="invCurrency" onchange="calculateTotals()">
                <option value="₹">₹ INR (Indian Rupee)</option>
                <option value="$">$ USD (US Dollar)</option>
                <option value="€">€ EUR (Euro)</option>
                <option value="£">£ GBP (British Pound)</option>
                <option value="¥">¥ JPY (Japanese Yen)</option>
                <option value="AED ">AED (UAE Dirham)</option>
                <option value="C$">C$ CAD (Canadian Dollar)</option>
                <option value="A$">A$ AUD (Australian Dollar)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Bill To Section -->
        <div class="sheet-row" style="background: #f8fafc; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;">
          <div class="sheet-col">
            <label class="inv-label" style="color: #6366f1;">Bill To (Client Details)</label>
            <input type="text" class="inv-input" id="clientName" placeholder="Client / Company Name" style="font-weight: 700; margin-bottom: 6px;">
            <textarea class="inv-textarea" id="clientAddress" placeholder="Client Address, Email, Phone Number"></textarea>
          </div>
          <div class="sheet-col">
            <label class="inv-label" style="color: #6366f1;">Project / PO Reference</label>
            <input type="text" class="inv-input" id="poNumber" placeholder="PO # or Project Name" style="margin-bottom: 6px;">
            <input type="text" class="inv-input" id="paymentTerms" placeholder="Payment Terms (e.g. Net 15 Days)">
          </div>
        </div>

        <!-- Line Items Table -->
        <table class="items-table" id="itemsTable">
          <thead>
            <tr>
              <th style="width: 48%;">Item Description</th>
              <th style="width: 12%;">Qty</th>
              <th style="width: 18%;">Rate</th>
              <th style="width: 16%;">Amount</th>
              <th style="width: 6%;"></th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <!-- Rows injected dynamically -->
          </tbody>
        </table>

        <div class="add-row-btn-wrap" style="margin-bottom: 20px;">
          <button class="btn btn-secondary btn-sm" type="button" onclick="addRow()"><i class="fas fa-plus"></i> Add Line Item</button>
        </div>

        <!-- Bottom Row -->
        <div class="sheet-row" style="align-items: flex-start;">
          <div class="sheet-col">
            <label class="inv-label">Bank / Payment Instructions</label>
            <textarea class="inv-textarea" id="bankDetails" placeholder="Bank Name, Account Number, IFSC/IBAN/Swift, or UPI ID" style="min-height: 60px;"></textarea>
            
            <label class="inv-label" style="margin-top: 10px;">Notes & Terms</label>
            <textarea class="inv-textarea" id="invNotes" placeholder="Thank you for your business!"></textarea>
          </div>

          <div class="sheet-col totals-area">
            <div class="totals-box">
              <div class="tot-row"><span>Subtotal:</span><strong id="subTotalDisplay">₹0.00</strong></div>
              <div class="tot-row" style="align-items: center;">
                <span>Discount (%):</span>
                <input type="number" id="discountPercent" value="0" min="0" max="100" class="inv-input" style="width: 60px; padding: 3px 6px; text-align: right;" oninput="calculateTotals()">
              </div>
              <div class="tot-row" style="align-items: center;">
                <span>Tax / GST (%):</span>
                <input type="number" id="taxPercent" value="18" min="0" max="100" class="inv-input" style="width: 60px; padding: 3px 6px; text-align: right;" oninput="calculateTotals()">
              </div>
              <div class="tot-row tot-grand"><span>Grand Total:</span><span id="grandTotalDisplay" style="color: #6366f1;">₹0.00</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('invDate').value = today;
    const dueDate = new Date(Date.now() + 14 * 86400000).toISOString().split('T')[0];
    document.getElementById('invDueDate').value = dueDate;

    function handleLogo(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = document.getElementById('logoPreview');
          img.src = ev.target.result;
          img.style.display = 'block';
          document.getElementById('logoPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    function addRow(desc = '', qty = 1, rate = 0) {
      const tbody = document.getElementById('itemsBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" class="inv-input item-desc" placeholder="Service or Product name" value="${desc}"></td>
        <td><input type="number" class="inv-input item-qty" min="1" value="${qty}" oninput="calculateTotals()"></td>
        <td><input type="number" class="inv-input item-rate" min="0" step="0.01" value="${rate}" oninput="calculateTotals()"></td>
        <td style="font-weight: 700;" class="item-amount">₹0.00</td>
        <td style="text-align: center;"><button class="btn-row-del" onclick="removeRow(this)"><i class="fas fa-trash-can"></i></button></td>
      `;
      tbody.appendChild(tr);
      calculateTotals();
    }

    function removeRow(btn) {
      const row = btn.closest('tr');
      if (document.querySelectorAll('#itemsBody tr').length > 1) {
        row.remove();
        calculateTotals();
      } else {
        alert("Invoice must have at least one line item.");
      }
    }

    function calculateTotals() {
      const curr = document.getElementById('invCurrency').value;
      const rows = document.querySelectorAll('#itemsBody tr');
      let subtotal = 0;

      rows.forEach(r => {
        const qty = parseFloat(r.querySelector('.item-qty').value) || 0;
        const rate = parseFloat(r.querySelector('.item-rate').value) || 0;
        const amount = qty * rate;
        subtotal += amount;
        r.querySelector('.item-amount').textContent = `${curr}${amount.toFixed(2)}`;
      });

      const discPct = parseFloat(document.getElementById('discountPercent').value) || 0;
      const taxPct = parseFloat(document.getElementById('taxPercent').value) || 0;

      const discountAmt = subtotal * (discPct / 100);
      const taxableAmt = subtotal - discountAmt;
      const taxAmt = taxableAmt * (taxPct / 100);
      const grandTotal = taxableAmt + taxAmt;

      document.getElementById('subTotalDisplay').textContent = `${curr}${subtotal.toFixed(2)}`;
      document.getElementById('grandTotalDisplay').textContent = `${curr}${grandTotal.toFixed(2)}`;
    }

    addRow('Creative Web Design & Development', 1, 15000);
    addRow('Logo & Brand Identity Kit', 1, 5000);

    async function downloadInvoicePDF() {
      const sheet = document.getElementById('invoiceSheet');
      const invNum = document.getElementById('invNumber').value || 'invoice';
      const opt = { scale: 2, useCORS: true, backgroundColor: '#ffffff' };

      try {
        const canvas = await html2canvas(sheet, opt);
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pW = doc.internal.pageSize.getWidth();
        const pH = pW * (canvas.height / canvas.width);
        doc.addImage(imgData, 'JPEG', 0, 0, pW, pH);
        doc.save(`${invNum}.pdf`);
      } catch(err) {
        alert("Error generating PDF: " + err.message);
      }
    }
  </script>
  <script src="js/app.js"></script>
</body>

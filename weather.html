    // Metric Formatter Helpers
    function formatTemp(celsiusVal) {
      if (celsiusVal === undefined || celsiusVal === null || isNaN(celsiusVal)) return '--°';
      const c = Number(celsiusVal);
      if (currentTempUnit === 'F') {
        return `${Math.round((c * 9 / 5) + 32)}°F`;
      }
      return `${Math.round(c)}°C`;
    }

    function formatSpeed(kmhVal) {
      if (kmhVal === undefined || kmhVal === null || isNaN(kmhVal)) return '--';
      const kmh = Number(kmhVal);
      if (currentTempUnit === 'F') {
        return `${Math.round(kmh * 0.621371)} mph`;
      }
      return `${Math.round(kmh)} km/h`;
    }

    function toggleTempUnit() {
      currentTempUnit = currentTempUnit === 'C' ? 'F' : 'C';
      localStorage.setItem('aibots_weather_unit', currentTempUnit);
      const ind = document.getElementById('unitIndicator');
      if (ind) ind.textContent = currentTempUnit === 'C' ? '°C, km/h' : '°F, mph';
      
      if (currentActiveMode === 'auto' && activeWeatherData) {
        renderAllWeatherData(activeWeatherData, activeAirQualityData);
      } else {
        setWeatherMode(currentActiveMode);
      }
    }

    // =========================================================================
    // INTERACTIVE AUTO-SUGGEST SEARCH MENU

    function handleCityInput(val) {
      const btn = document.getElementById('clearSearchBtn');

    function showCitySuggestions(query = '') {
      const dropdown = document.getElementById('citySuggestDropdown');
      if (!dropdown) return;

      const q = (query || (document.getElementById('cityInput') ? document.getElementById('cityInput').value : '')).toLowerCase().trim();
      const keys = Object.keys(CITY_DATABASE);
      let matches = [];

      if (!q) {
        // Show Top Trending Global & Indian Cities
        const featured = ['chennai', 'mumbai', 'delhi', 'bengaluru', 'london', 'new york', 'tokyo', 'dubai', 'paris', 'singapore', 'berlin', 'madrid'];
        matches = featured.map(k => ({ key: k, ...CITY_DATABASE[k] })).filter(Boolean);
      } else {
        // Search by city key or full name
        matches = keys.filter(k => {
          const item = CITY_DATABASE[k];
          return k.includes(q) || item.name.toLowerCase().includes(q);
        }).slice(0, 8).map(k => ({ key: k, ...CITY_DATABASE[k] }));
      }

      currentSuggestions = matches;
      highlightedSuggestIndex = -1;

      if (matches.length === 0) {
        dropdown.innerHTML = `
          <div class="suggest-header"><span>Search Worldwide</span> <span style="font-size:0.75rem;">Press Enter to search via Global Telemetry</span></div>
          <div class="suggest-item" onclick="searchWeather(document.getElementById('cityInput').value)">
            <div class="suggest-main">
              <i class="fas fa-magnifying-glass suggest-icon"></i>
              <div>
                <span class="suggest-city">Search "${query}"</span>
                <span class="suggest-country">Worldwide Live Satellites</span>
              </div>
            </div>
            <span class="suggest-temp"><i class="fas fa-arrow-right"></i></span>
          </div>
        `;
        dropdown.style.display = 'block';
        return;
      }

      let htmlOut = `<div class="suggest-header"><span>${q ? 'Matching Locations' : '🔥 Popular Destinations'}</span> <span style="font-size:0.72rem;">${matches.length} found</span></div>`;
      matches.forEach((m, idx) => {
        const parts = m.name.split(',');
        const cityOnly = parts[0].trim();
        const countryOnly = parts.slice(1).join(',').trim();
        htmlOut += `
          <div class="suggest-item" data-index="${idx}" onclick="selectSuggestedCity('${m.name.replace(/'/g, "\\'")}')">
            <div class="suggest-main">
              <i class="fas fa-location-dot suggest-icon"></i>
              <div>
                <span class="suggest-city">${cityOnly}</span>
                <span class="suggest-country">${countryOnly}</span>
              </div>
            </div>
            <span class="suggest-temp">${formatTemp(m.temp)}</span>
          </div>
        `;
      });

      dropdown.innerHTML = htmlOut;
      dropdown.style.display = 'block';
    }

    function hideCitySuggestions() {
      setTimeout(() => {
        const dropdown = document.getElementById('citySuggestDropdown');
        if (dropdown) dropdown.style.display = 'none';

    function selectSuggestedCity(fullCityName) {
      const inp = document.getElementById('cityInput');
      if (inp) inp.value = fullCityName;
      const dropdown = document.getElementById('citySuggestDropdown');
      if (dropdown) dropdown.style.display = 'none';
      searchWeather(fullCityName);
    }

    function handleSearchKeyDown(e) {
      const dropdown = document.getElementById('citySuggestDropdown');
      const isVisible = dropdown && dropdown.style.display === 'block';

      if (e.key === 'ArrowDown' && isVisible && currentSuggestions.length > 0) {
        e.preventDefault();
        highlightedSuggestIndex = (highlightedSuggestIndex + 1) % currentSuggestions.length;
        updateSuggestionHighlight();
      } else if (e.key === 'ArrowUp' && isVisible && currentSuggestions.length > 0) {
        e.preventDefault();
        highlightedSuggestIndex = (highlightedSuggestIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
        updateSuggestionHighlight();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (isVisible && highlightedSuggestIndex >= 0 && currentSuggestions[highlightedSuggestIndex]) {
          selectSuggestedCity(currentSuggestions[highlightedSuggestIndex].name);
        } else {
          if (dropdown) dropdown.style.display = 'none';
          searchWeather();
        }
      } else if (e.key === 'Escape') {
        if (dropdown) dropdown.style.display = 'none';
      }
    }

    function updateSuggestionHighlight() {
      document.querySelectorAll('.suggest-item').forEach((el, idx) => {
        if (idx === highlightedSuggestIndex) {
          el.classList.add('highlighted');
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.classList.remove('highlighted');
        }
      });
    }

    // =========================================================================
    // DETERMINISTIC PROCEDURAL COORDINATE & CLIMATE ESTIMATOR
    // (Never defaults to Chennai or previous city for any unknown location!)
    // =========================================================================
    function getDeterministicCoords(cityName) {
      let hash = 0;
      for (let i = 0; i < cityName.length; i++) {
        hash = (hash * 31 + cityName.charCodeAt(i)) & 0xFFFFFFFF;
      }
      const absHash = Math.abs(hash);
      // Generate realistic spread: lat between -35 and +60, lon between -120 and +135
      const lat = ((absHash % 9500) / 100) - 35;
      const lon = (((absHash >> 3) % 25500) / 100) - 120;
      
      // Determine base climate based on latitude
      let temp = 24;
      const absLat = Math.abs(lat);
      if (absLat < 15) {
        temp = 30 + (absHash % 5); // Tropical
      } else if (absLat < 35) {
        temp = 26 + (absHash % 7); // Subtropical
      } else if (absLat < 55) {
        temp = 16 + (absHash % 8); // Temperate
      } else {
        temp = 4 + (absHash % 10); // Cold / Subarctic
      }

      const hum = 45 + (absHash % 40);
      const wind = 10 + (absHash % 15);
      const aqi = 25 + (absHash % 60);

      return {
        lat: Math.round(lat * 1000) / 1000,
        lon: Math.round(lon * 1000) / 1000,
        temp,
        humidity: hum,
        wind,
        aqi,
        uv: Math.max(2, Math.min(10, Math.round(11 - absLat * 0.15))),
        code: (absHash % 3 === 0) ? 0 : (absHash % 3 === 1) ? 2 : 1
      };
    }

    // =========================================================================
    // PROCEDURAL HIGH-FIDELITY TELEMETRY GENERATOR
    // =========================================================================
    function buildSyntheticForecast(meta) {
      const now = new Date();
      const baseTemp = meta.temp !== undefined ? meta.temp : 24;
      const baseHum = meta.humidity || 60;
      const baseWind = meta.wind || 14;
      const baseAqi = meta.aqi || 45;
      const baseUv = meta.uv || 7;
      const pop = meta.rainChance || 15;
      const wmoCode = meta.code !== undefined ? meta.code : 1;

      const hourlyTimes = [];
      const hourlyTemps = [];
      const hourlyCodes = [];
      const hourlyPops = [];
      const hourlyWinds = [];

      for (let i = 0; i < 24; i++) {
        const d = new Date(now.getTime() + i * 3600000);
        hourlyTimes.push(d.toISOString());
        const hour = d.getHours();
        const tempVariation = Math.sin(((hour - 8) / 24) * Math.PI * 2) * 5;
        hourlyTemps.push(Math.round((baseTemp + tempVariation) * 10) / 10);
        hourlyCodes.push(wmoCode);
        hourlyPops.push(Math.max(5, Math.min(95, pop + Math.round((Math.random() - 0.5) * 10))));
        hourlyWinds.push(Math.round((baseWind + (Math.random() - 0.5) * 4) * 10) / 10);
      }

      const dailyTimes = [];
      const dailyMax = [];
      const dailyMin = [];
      const dailyCodes = [];
      const dailySunrises = [];
      const dailySunsets = [];
      const dailyUv = [];
      const dailyPopMax = [];
      const dailyRainSum = [];

      for (let i = 0; i < 7; i++) {
        const d = new Date(now.getTime() + i * 86400000);
        dailyTimes.push(d.toISOString().slice(0, 10));
        const dayVariance = Math.sin(i) * 2;
        dailyMax.push(Math.round(baseTemp + 2 + dayVariance));
        dailyMin.push(Math.round(baseTemp - 5 + dayVariance));
        dailyCodes.push(wmoCode);
        
        const sr = new Date(d); sr.setHours(6, 12, 0);
        const ss = new Date(d); ss.setHours(18, 38, 0);
        dailySunrises.push(sr.toISOString());
        dailySunsets.push(ss.toISOString());
        dailyUv.push(baseUv);
        dailyPopMax.push(pop);
        dailyRainSum.push(pop > 40 ? 4.5 : 0.0);
      }

      return {
        wData: {
          current: {
            time: now.toISOString(),
            temperature_2m: baseTemp,
            relative_humidity_2m: baseHum,
            apparent_temperature: meta.feels || (baseTemp + 3),
            is_day: 1,
            precipitation: pop > 50 ? 1.5 : 0,
            rain: pop > 50 ? 1.5 : 0,
            weather_code: wmoCode,
            surface_pressure: 1012,
            wind_speed_10m: baseWind,
            wind_direction_10m: 145
          },
          hourly: {
            time: hourlyTimes,
            temperature_2m: hourlyTemps,
            weather_code: hourlyCodes,
            precipitation_probability: hourlyPops,
            wind_speed_10m: hourlyWinds
          },
          daily: {
            time: dailyTimes,
            temperature_2m_max: dailyMax,
            temperature_2m_min: dailyMin,
            weather_code: dailyCodes,
            sunrise: dailySunrises,
            sunset: dailySunsets,
            uv_index_max: dailyUv,
            precipitation_probability_max: dailyPopMax,
            precipitation_sum: dailyRainSum
          }
        },
        aqData: {
          current: {
            us_aqi: baseAqi,
            pm2_5: Math.round(baseAqi * 0.45),
            pm10: Math.round(baseAqi * 0.75),
            ozone: 42
          }
        }
      };
    }

    // =========================================================================
    // MULTI-API GEOCODING ENGINE
    // (Open-Meteo -> OpenStreetMap Nominatim -> wttr.in -> Deterministic Math)
    // =========================================================================
    async function resolveCoordinates(query) {
      const cleanKey = query.toLowerCase().trim().replace(/,\s*[a-z\s]+$/i, '').trim();
      
      // 1. Check built-in 350+ Database
      if (CITY_DATABASE[cleanKey]) {
        return { ...CITY_DATABASE[cleanKey], resolvedName: CITY_DATABASE[cleanKey].name };
      }
      if (CITY_DATABASE[query.toLowerCase().trim()]) {
        return { ...CITY_DATABASE[query.toLowerCase().trim()], resolvedName: CITY_DATABASE[query.toLowerCase().trim()].name };
      }
      // Check partial match in database
      for (const [k, v] of Object.entries(CITY_DATABASE)) {
        if (k === cleanKey || v.name.toLowerCase().startsWith(cleanKey)) {
          return { ...v, resolvedName: v.name };
        }
      }

      // 2. Open-Meteo Geocoding API
      try {
        const c1 = new AbortController();
        const t1 = setTimeout(() => c1.abort(), 2200);
        const url1 = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
        const res1 = await fetch(url1, { signal: c1.signal });
        clearTimeout(t1);
        if (res1.ok) {
          const d1 = await res1.json();
          if (d1.results && d1.results.length > 0) {
            const loc = d1.results[0];
            return {
              lat: loc.latitude,
              lon: loc.longitude,
              resolvedName: `${loc.name}, ${loc.country || ''}`,
              temp: 22, humidity: 55, wind: 14, aqi: 40, uv: 7, code: 1
            };
          }
        }
      } catch (_) {}

      // 3. OpenStreetMap Nominatim Geocoding API
      try {
        const c2 = new AbortController();
        const t2 = setTimeout(() => c2.abort(), 2200);
        const url2 = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
        const res2 = await fetch(url2, { signal: c2.signal, headers: { 'Accept': 'application/json' } });
        clearTimeout(t2);
        if (res2.ok) {
          const d2 = await res2.json();
          if (d2 && d2.length > 0) {
            const loc = d2[0];
            const parts = loc.display_name.split(',');
            const shortName = `${parts[0].trim()}, ${parts[parts.length - 1].trim()}`;
            return {
              lat: parseFloat(loc.lat),
              lon: parseFloat(loc.lon),
              resolvedName: shortName,
              temp: 22, humidity: 55, wind: 14, aqi: 40, uv: 7, code: 1
            };
          }
        }
      } catch (_) {}

      // 4. Deterministic Unique Coordinate Generator (Never defaults to Chennai or previous city!)
      const synthGeo = getDeterministicCoords(query);
      const titleCaseName = query.charAt(0).toUpperCase() + query.slice(1);
      return {
        lat: synthGeo.lat,
        lon: synthGeo.lon,
        resolvedName: `${titleCaseName}`,
        ...synthGeo
      };
    }

    // =========================================================================
    // MULTI-API WEATHER TELEMETRY FETCHER
    // (Open-Meteo -> wttr.in -> Procedural Engine)
    // =========================================================================
    async function searchWeather(queryCity = '') {
      let rawQuery = queryCity || (document.getElementById('cityInput') ? document.getElementById('cityInput').value.trim() : '') || 'Chennai';
      const cleanKey = rawQuery.toLowerCase().trim().replace(/,\s*[a-z\s]+$/i, '').trim();
      const searchBtn = document.querySelector('.btn-primary');
      if (searchBtn) searchBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Locating...';

      try {
        // Reset mode to auto so previous simulated modes don't mask new city weather
        currentActiveMode = 'auto';
        document.querySelectorAll('.chamber-mode-pill').forEach(p => p.classList.remove('active'));
        const autoPill = document.querySelector('.chamber-mode-pill');
        if (autoPill) autoPill.classList.add('active');

        // 1. Resolve exact coordinates via multi-API fallback
        const geo = await resolveCoordinates(rawQuery);
        currentCityName = geo.resolvedName;
        const cityNameEl = document.getElementById('cityName');
        if (cityNameEl) cityNameEl.innerHTML = `<span>${currentCityName}</span>`;

        // Highlight matching quick chip if present
        document.querySelectorAll('.city-chip').forEach(c => {
          if (c.textContent.trim().toLowerCase().includes(cleanKey)) {
            c.classList.add('active');
          } else {
            c.classList.remove('active');
          }
        });

        let telemetryOk = false;

        // 2. Try Open-Meteo Forecast API
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2800);
          const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,precipitation_sum&timezone=auto`;
          
          const wRes = await fetch(weatherUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (wRes.ok) {
            const wData = await wRes.json();
            
            let aqData = null;
            try {
              const aqController = new AbortController();
              const aqTimeout = setTimeout(() => aqController.abort(), 2000);
              const aqUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${geo.lat}&longitude=${geo.lon}&current=us_aqi,pm2_5,pm10,ozone&timezone=auto`;
              const aqRes = await fetch(aqUrl, { signal: aqController.signal });
              clearTimeout(aqTimeout);
              if (aqRes.ok) aqData = await aqRes.json();
            } catch (_) {}

            activeWeatherData = wData;
            activeAirQualityData = aqData;
            renderAllWeatherData(wData, aqData, true);
            telemetryOk = true;
          }
        } catch (_) {}

        // 3. Try wttr.in API if Open-Meteo failed
        if (!telemetryOk) {
          try {
            const wttrController = new AbortController();
            const wttrTimeout = setTimeout(() => wttrController.abort(), 2800);
            const wttrUrl = `https://wttr.in/${encodeURIComponent(currentCityName)}?format=j1`;
            const wttrRes = await fetch(wttrUrl, { signal: wttrController.signal });
            clearTimeout(wttrTimeout);
            if (wttrRes.ok) {
              const wttrData = await wttrRes.json();
              if (wttrData && wttrData.current_condition && wttrData.current_condition[0]) {
                const cur = wttrData.current_condition[0];
                const weatherArr = wttrData.weather || [];
                const tempC = parseFloat(cur.temp_C);
                const feelsC = parseFloat(cur.FeelsLikeC);
                const hum = parseFloat(cur.humidity);
                const windKmh = parseFloat(cur.windspeedKmph);

                const synthetic = buildSyntheticForecast({
                  name: currentCityName,
                  temp: tempC,
                  feels: feelsC,
                  humidity: hum,
                  wind: windKmh,
                  code: cur.weatherCode >= 300 ? 63 : 1
                });

                activeWeatherData = synthetic.wData;
                activeAirQualityData = synthetic.aqData;
                renderAllWeatherData(synthetic.wData, synthetic.aqData, true);
                telemetryOk = true;
              }
            }
          } catch (_) {}
        }

        // 4. Fallback to procedural synthetic telemetry with the city's unique coordinates & climate
        if (!telemetryOk) {
          const synthetic = buildSyntheticForecast(geo);
          activeWeatherData = synthetic.wData;
          activeAirQualityData = synthetic.aqData;
          renderAllWeatherData(synthetic.wData, synthetic.aqData, false);
        }

      } catch (err) {
        console.error('Weather studio search error:', err);
      } finally {
        if (searchBtn) searchBtn.innerHTML = '<i class="fas fa-search"></i> Search';
      }
    }

    // Geolocation Support
    function useLocation() {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }
      const locateBtn = document.querySelector('.btn-secondary');
      if (locateBtn) locateBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> GPS...';

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        try {
          const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,precipitation_sum&timezone=auto`;
          const wRes = await fetch(weatherUrl);
          const wData = await wRes.json();

          let aqData = null;
          try {
            const aqUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm2_5,pm10,ozone&timezone=auto`;
            const aqRes = await fetch(aqUrl);
            aqData = await aqRes.json();
          } catch (_) {}

          currentCityName = `Current Location (${lat.toFixed(2)}°, ${lon.toFixed(2)}°)`;
          const cityEl = document.getElementById('cityName');
          if (cityEl) cityEl.innerHTML = `<span><i class="fas fa-location-dot" style="color:#ef4444;"></i> ${currentCityName}</span>`;

          activeWeatherData = wData;
          activeAirQualityData = aqData;
          renderAllWeatherData(wData, aqData, true);
        } catch (e) {
          console.error(e);
        } finally {
          if (locateBtn) locateBtn.innerHTML = '<i class="fas fa-location-crosshairs"></i> Locate';
        }
      }, (err) => {
        alert('Location access was denied or is unavailable.');
        if (locateBtn) locateBtn.innerHTML = '<i class="fas fa-location-crosshairs"></i> Locate';
      }, { timeout: 8000 });
    }

    // =========================================================================
    // RENDER TELEMETRY TO UI
    // =========================================================================
    function renderAllWeatherData(wData, aqData, isLive = true) {
      if (!wData || !wData.current) return;
      const cur = wData.current;
      const daily = wData.daily || {};
      const hourly = wData.hourly || {};

      const wmo = WMO_MAP[cur.weather_code] || { text: 'Clear Sky', icon: 'fa-sun', color: '#f59e0b', mode: 'sunny', bg: '' };

      // Local time formatting & Telemetry status
      const timeEl = document.getElementById('localTimeText');
      if (timeEl) {
        const d = new Date();
        const badgeClass = isLive ? 'telemetry-status-pill' : 'telemetry-status-pill offline-badge';
        const badgeDot = isLive ? '<span class="live-dot"></span> 🛰️ Live Telemetry' : '<span class="live-dot" style="background:#f59e0b; box-shadow:0 0 8px #f59e0b;"></span> ⚡ Synchronized Telemetry';
        timeEl.innerHTML = `<span>Updated ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} &bull; Wind ${formatSpeed(cur.wind_speed_10m)} &bull; Humidity ${cur.relative_humidity_2m}%</span> <span class="${badgeClass}">${badgeDot}</span>`;
      }

      // Hero Metrics
      const tempValEl = document.getElementById('tempVal');
      if (tempValEl) tempValEl.textContent = formatTemp(cur.temperature_2m);
      
      const conditionEl = document.getElementById('conditionText');
      if (conditionEl) conditionEl.textContent = `${wmo.text}${cur.is_day ? '' : ' (Night)'}`;

      if (daily && daily.temperature_2m_max && daily.temperature_2m_max[0] !== undefined) {
        const highEl = document.getElementById('highTemp');
        const lowEl = document.getElementById('lowTemp');
        if (highEl) highEl.textContent = formatTemp(daily.temperature_2m_max[0]);
        if (lowEl) lowEl.textContent = formatTemp(daily.temperature_2m_min[0]);
      }
      
      const feelsEl = document.getElementById('feelsLike');
      if (feelsEl) feelsEl.textContent = formatTemp(cur.apparent_temperature);

      // If in auto mode, update atmospheric chamber to match actual live weather!
      if (currentActiveMode === 'auto') {
        applyAtmosphereMode(wmo.mode, cur.is_day);
      }

      // Render 24h Hourly Timeline
      renderHourlyTrack(hourly, cur.time);

      // Render 7-Day Daily Forecast List
      renderDailyList(daily);

      // Render Gauges
      renderGauges(cur, daily, aqData);

      // Render Smart Advisories
      renderSmartAdvisories(cur, daily, aqData);
    }

    // Render 24h Hourly Timeline
    function renderHourlyTrack(hourly, currentIsoTime) {
      const track = document.getElementById('hourlyTrack');
      if (!track || !hourly || !hourly.time || hourly.time.length === 0) return;
      track.innerHTML = '';

      const nowHour = new Date(currentIsoTime || Date.now()).getHours();
      const count = Math.min(24, hourly.time.length);

      for (let i = 0; i < count; i++) {
        const itemDate = new Date(hourly.time[i]);
        const itemHour = itemDate.getHours();
        const isCurrent = i === 0 || itemHour === nowHour;

        const timeLabel = isCurrent ? 'Now' : itemDate.toLocaleTimeString([], { hour: 'numeric', hour12: true });
        const wmo = WMO_MAP[hourly.weather_code[i]] || { text: 'Fair', icon: 'fa-cloud-sun', color: '#38bdf8' };
        const temp = formatTemp(hourly.temperature_2m[i]);
        const pop = hourly.precipitation_probability ? hourly.precipitation_probability[i] : 0;

        const card = document.createElement('div');
        card.className = `hourly-card ${isCurrent ? 'active-hour' : ''}`;
        card.innerHTML = `
          <div class="hourly-time">${timeLabel}</div>
          <i class="fas ${wmo.icon} hourly-icon" style="color:${wmo.color};"></i>
          <div class="hourly-temp">${temp}</div>
          ${pop > 15 ? `<div class="hourly-pop"><i class="fas fa-droplet"></i> ${pop}%</div>` : '<div class="hourly-pop" style="opacity:0;">--</div>'}
        `;
        track.appendChild(card);
      }
    }

    // Render 7-Day Outlook
    function renderDailyList(daily) {
      const list = document.getElementById('dailyList');
      if (!list || !daily || !daily.time || daily.time.length === 0) return;
      list.innerHTML = '';

      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const totalDays = Math.min(7, daily.time.length);

      let allMin = 999, allMax = -999;
      for (let i = 0; i < totalDays; i++) {
        if (daily.temperature_2m_min[i] < allMin) allMin = daily.temperature_2m_min[i];
        if (daily.temperature_2m_max[i] > allMax) allMax = daily.temperature_2m_max[i];
      }
      const totalSpan = Math.max(allMax - allMin, 1);

      for (let i = 0; i < totalDays; i++) {
        const d = new Date(daily.time[i]);
        const dayLabel = i === 0 ? 'Today' : days[d.getDay()];
        const wmo = WMO_MAP[daily.weather_code[i]] || { text: 'Fair', icon: 'fa-cloud-sun', color: '#38bdf8' };
        const maxVal = daily.temperature_2m_max[i];
        const minVal = daily.temperature_2m_min[i];
        const pop = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : 0;

        const leftPercent = Math.max(0, Math.min(100, ((minVal - allMin) / totalSpan) * 100));
        const widthPercent = Math.max(8, Math.min(100 - leftPercent, ((maxVal - minVal) / totalSpan) * 100));

        const row = document.createElement('div');
        row.className = 'daily-row';
        row.innerHTML = `
          <div class="daily-day">${dayLabel}</div>
          <div class="daily-icon-box">
            <i class="fas ${wmo.icon}" style="color:${wmo.color};"></i>
            ${pop > 20 ? `<span class="daily-pop">${pop}%</span>` : ''}
          </div>
          <div class="daily-bar-container">
            <div class="daily-bar-fill" style="left:${leftPercent.toFixed(1)}%; width:${widthPercent.toFixed(1)}%;"></div>
          </div>
          <div class="daily-temp-range">
            <span>${formatTemp(maxVal)}</span>
            <span class="daily-min">${formatTemp(minVal)}</span>
          </div>
        `;
        list.appendChild(row);
      }
    }

    // Render Gauges
    function renderGauges(cur, daily, aqData) {
      // AQI
      if (aqData && aqData.current && aqData.current.us_aqi !== undefined) {
        const aqi = aqData.current.us_aqi;
        const aqiEl = document.getElementById('aqiVal');
        const descEl = document.getElementById('aqiDesc');
        if (aqiEl) {
          aqiEl.textContent = aqi;
          if (aqi <= 50) {
            aqiEl.style.color = '#10b981';
            if (descEl) descEl.textContent = 'Good • Pristine air quality, ideal for outdoors.';
          } else if (aqi <= 100) {
            aqiEl.style.color = '#f59e0b';
            if (descEl) descEl.textContent = 'Moderate • Acceptable quality, low sensitivity risk.';
          } else {
            aqiEl.style.color = '#ef4444';
            if (descEl) descEl.textContent = 'Unhealthy • Elevated particulates, sensitive groups limit exposure.';
          }
        }
      }

      // UV Index
      if (daily && daily.uv_index_max && daily.uv_index_max[0] !== undefined) {
        const uv = Math.round(daily.uv_index_max[0]);
        const uvEl = document.getElementById('uvVal');
        const uvDesc = document.getElementById('uvDesc');
        if (uvEl) {
          uvEl.textContent = uv;
          if (uv <= 2) {
            uvEl.style.color = '#10b981';
            if (uvDesc) uvDesc.textContent = 'Low • No protective sunwear needed.';
          } else if (uv <= 5) {
            uvEl.style.color = '#f59e0b';
            if (uvDesc) uvDesc.textContent = 'Moderate • Wear sunglasses & SPF 15+ around midday.';
          } else if (uv <= 7) {
            uvEl.style.color = '#ea580c';
            if (uvDesc) uvDesc.textContent = 'Very High • Seek shade & apply SPF 30+ sunscreen.';
          } else {
            uvEl.style.color = '#ef4444';
            if (uvDesc) uvDesc.textContent = 'Extreme • Avoid midday direct sunlight exposure.';
          }
        }
      }

      // Wind & Compass
      const windValEl = document.getElementById('windVal');
      if (windValEl) windValEl.textContent = formatSpeed(cur.wind_speed_10m);
      
      const deg = cur.wind_direction_10m || 140;
      const compassNeedle = document.getElementById('compassNeedle');
      if (compassNeedle) {
        compassNeedle.style.transform = `rotate(${deg}deg)`;
      }
      const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const index = Math.round(deg / 22.5) % 16;
      const windDirText = document.getElementById('windDirectionText');
      if (windDirText) windDirText.textContent = `Direction: ${directions[index]} (${deg}°)`;

      // Sunrise & Sunset Solar Arc
      if (daily && daily.sunrise && daily.sunrise[0]) {
        const sr = new Date(daily.sunrise[0]);
        const ss = new Date(daily.sunset[0]);
        const srEl = document.getElementById('sunriseText');
        const ssEl = document.getElementById('sunsetText');
        if (srEl) srEl.textContent = sr.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (ssEl) ssEl.textContent = ss.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const nowMs = Date.now();
        const srMs = sr.getTime();
        const ssMs = ss.getTime();
        let progress = 0.5;
        if (nowMs >= srMs && nowMs <= ssMs) {
          progress = (nowMs - srMs) / (ssMs - srMs);
        } else if (nowMs > ssMs) {
          progress = 1;
        }

        const angle = Math.PI - (progress * Math.PI);
        const cx = 80 + 70 * Math.cos(angle);
        const cy = 45 - 35 * Math.sin(angle);
        const dot = document.getElementById('solarSunDot');
        if (dot) {
          dot.setAttribute('cx', cx.toFixed(1));
          dot.setAttribute('cy', cy.toFixed(1));
        }

        const arcPath = document.getElementById('solarProgressArc');
        if (arcPath) {
          const totalLen = 160;
          arcPath.setAttribute('stroke-dasharray', `${(progress * totalLen).toFixed(1)} ${totalLen}`);
        }
      }

      // Humidity & Dew
      const humEl = document.getElementById('humVal');
      if (humEl) humEl.textContent = `${cur.relative_humidity_2m}%`;
      const a = 17.27, b = 237.7;
      const t = cur.temperature_2m;
      const rh = cur.relative_humidity_2m;
      const alpha = ((a * t) / (b + t)) + Math.log(rh / 100.0);
      const dewPoint = (b * alpha) / (a - alpha);
      const dewEl = document.getElementById('dewDesc');
      if (dewEl) dewEl.textContent = `Dew point: ${formatTemp(dewPoint)} (${rh > 65 ? 'Humid' : rh > 40 ? 'Comfortable' : 'Crisp & Dry'})`;

      // Pressure
      const pressEl = document.getElementById('pressureVal');
      if (pressEl) pressEl.textContent = `${Math.round(cur.surface_pressure || 1012)} hPa`;
      const pressDescEl = document.getElementById('pressureDesc');
      if (pressDescEl) pressDescEl.textContent = cur.surface_pressure > 1015 ? 'High Barometric Pressure (Clear skies)' : 'Stable Atmospheric Flow';

      // Rain Sum
      const rainSum = daily && daily.precipitation_sum ? daily.precipitation_sum[0] : (cur.precipitation || 0);
      const rainEl = document.getElementById('rainSumVal');
      if (rainEl) rainEl.textContent = `${rainSum.toFixed(1)} mm`;
      const popMax = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : 15;
      const rainDescEl = document.getElementById('rainDesc');
      if (rainDescEl) rainDescEl.textContent = `${popMax}% precipitation probability today`;
    }

    // Render Smart Advisories
    function renderSmartAdvisories(cur, daily, aqData) {
      const t = cur.temperature_2m;
      const wind = cur.wind_speed_10m;
      const pop = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : 15;

      let wear = '';
      if (t >= 30) {
        wear = 'Breathable lightweight cottons, t-shirt, linen pants or shorts. Stay hydrated under sunshine.';
      } else if (t >= 20) {
        wear = 'Comfortable casual wear: light shirt or blouse, comfortable denim or chinos.';
      } else if (t >= 10) {
        wear = 'Mild chill: bring a lightweight jacket, hoodie, or sweater for evening breezes.';
      } else {
        wear = 'Cold conditions: layered thermal clothing, heavy coat, knit scarf, and gloves.';
      }
      const wearEl = document.getElementById('advWear');
      if (wearEl) wearEl.textContent = wear;

      let fitness = '';
      if (pop > 60) {
        fitness = 'Indoor gym or workout recommended due to high precipitation chance.';
      } else if (t > 33) {
        fitness = 'Moderate heat: early morning or post 5:30 PM are best for jogging and outdoor fitness.';
      } else if (wind > 35) {
        fitness = 'Strong breeze: watch out for strong wind resistance while cycling.';
      } else {
        fitness = 'Prime outdoor conditions: high score (9/10) for jogging, cycling, and park walks.';
      }
      const fitEl = document.getElementById('advFitness');
      if (fitEl) fitEl.textContent = fitness;

      let travel = '';
      if (pop > 40) {
        travel = 'Carry an umbrella or packable raincoat. Allow extra commute time for wet roads.';
      } else if (cur.weather_code >= 95) {
        travel = 'Thunderstorm alert: avoid open rooftops and exercise caution on expressways.';
      } else {
        travel = 'Clear road visibility. Optimal conditions for highway travel and daily transit.';
      }
      const travelEl = document.getElementById('advTravel');
      if (travelEl) travelEl.textContent = travel;
    }

        if (node1) { node1.style.background = '#c084fc'; node1.style.boxShadow = '0 0 18px #c084fc'; }
        if (node2) { node2.style.background = '#10b981'; node2.style.boxShadow = '0 0 18px #10b981'; }
        if (logoImg) logoImg.style.filter = 'drop-shadow(0 0 32px rgba(192, 132, 252, 0.95))';
        initAuroraParticles();
      }

      startParticleEngine();
    }

    // Particle Engine Initializers
    function initSunnyParticles() {
      if (!canvas) return;
      for (let i = 0; i < 55; i++) {
        particles.push({
          type: 'sun_dust',
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 3.5 + 1.5,
          speedY: -(Math.random() * 0.9 + 0.3),
          speedX: (Math.random() - 0.5) * 0.5,
          alpha: Math.random() * 0.7 + 0.3
        });
      }
    }

    function initRainParticles() {
      if (!canvas) return;
      for (let i = 0; i < 85; i++) {
        particles.push({
          type: 'raindrop',
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 20 + 12,
          speedY: Math.random() * 10 + 14,
          speedX: -2.5,
          alpha: Math.random() * 0.6 + 0.4
        });
      }
    }

    let lightningTimer = null;
    let currentLightningBolt = null;

    function initStormParticles() {
      if (!canvas) return;
      initRainParticles();
      scheduleLightningFlash();
    }

    function scheduleLightningFlash() {
      if (lightningTimer) clearTimeout(lightningTimer);
      if (currentActiveMode !== 'storm' && currentActiveMode !== 'auto') return;

      const nextDelay = Math.random() * 3000 + 1500;
      lightningTimer = setTimeout(() => {
        generateLightningBolt();
        const flash = document.getElementById('lightningFlash');
        if (flash) {
          flash.style.opacity = '0.9';
          setTimeout(() => { flash.style.opacity = '0'; }, 70);
          setTimeout(() => { flash.style.opacity = '0.6'; }, 140);
          setTimeout(() => { flash.style.opacity = '0'; currentLightningBolt = null; }, 240);
        }
        playWeatherAcoustic('storm');
        scheduleLightningFlash();
      }, nextDelay);
    }

    function generateLightningBolt() {
      if (!canvas) return;
      const startX = canvas.width * 0.3 + Math.random() * (canvas.width * 0.4);
      let currX = startX;
      let currY = 0;
      const points = [{ x: currX, y: currY }];
      
      while (currY < canvas.height * 0.85) {
        currY += Math.random() * 25 + 15;
        currX += (Math.random() - 0.5) * 50;
        points.push({ x: currX, y: currY });
      }
      currentLightningBolt = points;
    }

    function initSnowParticles() {
      if (!canvas) return;
      for (let i = 0; i < 75; i++) {
        particles.push({
          type: 'snowflake',
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 4 + 2,
          speedY: Math.random() * 1.8 + 0.8,
          swing: Math.random() * Math.PI * 2,
          swingSpeed: Math.random() * 0.03 + 0.01,
          rot: Math.random() * Math.PI,
          alpha: Math.random() * 0.6 + 0.4
        });
      }
    }

    function initWindParticles() {
      if (!canvas) return;
      for (let i = 0; i < 50; i++) {
        particles.push({
          type: 'wind_line',
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 55 + 25,
          speedX: Math.random() * 9 + 8,
          alpha: Math.random() * 0.55 + 0.35
        });
      }
    }

    function initMistParticles() {
      if (!canvas) return;
      for (let i = 0; i < 26; i++) {
        particles.push({
          type: 'fog_cloud',
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 75 + 45,
          speedX: Math.random() * 0.7 + 0.3,
          alpha: Math.random() * 0.2 + 0.08
        });
      }
    }

    function initAuroraParticles() {
      if (!canvas) return;
      for (let i = 0; i < 60; i++) {
        particles.push({
          type: 'aurora_star',
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 0.8,
          twinkle: Math.random() * 0.04 + 0.01,
          alpha: Math.random() * 0.8 + 0.2
        });
      }
    }

    // 60FPS Dynamic Particle Engine Loop
    let auroraWavePhase = 0;
    function startParticleEngine() {
      if (canvasAnimId) {
        cancelAnimationFrame(canvasAnimId);
        canvasAnimId = null;
      }

      function step() {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentActiveMode === 'aurora') {
          auroraWavePhase += 0.02;
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          
          ctx.beginPath();
          ctx.moveTo(0, canvas.height * 0.25);
          for (let x = 0; x <= canvas.width; x += 30) {
            const y = canvas.height * 0.25 + Math.sin(auroraWavePhase + x * 0.008) * 35;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(canvas.width, 0);
          ctx.lineTo(0, 0);
          ctx.closePath();
          const grad1 = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.35);
          grad1.addColorStop(0, 'rgba(16, 185, 129, 0.45)');
          grad1.addColorStop(1, 'transparent');
          ctx.fillStyle = grad1;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(0, canvas.height * 0.3);
          for (let x = 0; x <= canvas.width; x += 30) {
            const y = canvas.height * 0.3 + Math.cos(auroraWavePhase * 0.8 + x * 0.006) * 45;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(canvas.width, 0);
          ctx.lineTo(0, 0);
          ctx.closePath();
          const grad2 = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.4);
          grad2.addColorStop(0, 'rgba(192, 132, 252, 0.45)');
          grad2.addColorStop(1, 'transparent');
          ctx.fillStyle = grad2;
          ctx.fill();

          ctx.restore();
        }

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          if (p.type === 'sun_dust') {
            p.y += p.speedY;
            p.x += p.speedX;
            if (p.y < 0) p.y = canvas.height;
            ctx.fillStyle = `rgba(245, 158, 11, ${p.alpha})`;
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          } else if (p.type === 'raindrop') {
            p.y += p.speedY;
            p.x += p.speedX;
            if (p.y > canvas.height) {
              p.y = -10;
              p.x = Math.random() * (canvas.width + 100);
            }
            ctx.strokeStyle = `rgba(56, 189, 248, ${p.alpha})`;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.speedX * 2, p.y + p.length);
            ctx.stroke();
          } else if (p.type === 'snowflake') {
            p.y += p.speedY;
            p.swing += p.swingSpeed;
            p.x += Math.sin(p.swing) * 1.2;
            p.rot += 0.02;
            if (p.y > canvas.height) {
              p.y = -10;
              p.x = Math.random() * canvas.width;
            }
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.strokeStyle = `rgba(255, 255, 255, ${p.alpha})`;
            ctx.shadowColor = '#60a5fa';
            ctx.shadowBlur = 4;
            ctx.lineWidth = 1.4;
            for (let branch = 0; branch < 3; branch++) {
              ctx.rotate(Math.PI / 3);
              ctx.beginPath();
              ctx.moveTo(0, -p.radius);
              ctx.lineTo(0, p.radius);
              ctx.stroke();
            }
            ctx.restore();
            ctx.shadowBlur = 0;
          } else if (p.type === 'wind_line') {
            p.x += p.speedX;
            if (p.x > canvas.width + 50) {
              p.x = -p.length;
              p.y = Math.random() * canvas.height;
            }
            ctx.strokeStyle = `rgba(16, 185, 129, ${p.alpha})`;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.length, p.y);
            ctx.stroke();
          } else if (p.type === 'fog_cloud') {
            p.x += p.speedX;
            if (p.x - p.radius > canvas.width) p.x = -p.radius;
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
            grad.addColorStop(0, `rgba(203, 213, 225, ${p.alpha})`);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'aurora_star') {
            p.alpha += p.twinkle;
            if (p.alpha > 0.95 || p.alpha < 0.2) p.twinkle = -p.twinkle;
            ctx.fillStyle = `rgba(224, 175, 255, ${Math.max(0, p.alpha)})`;
            ctx.shadowColor = '#c084fc';
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        if (currentLightningBolt && currentLightningBolt.length > 1) {
          ctx.save();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#a855f7';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(currentLightningBolt[0].x, currentLightningBolt[0].y);
          for (let b = 1; b < currentLightningBolt.length; b++) {
            ctx.lineTo(currentLightningBolt[b].x, currentLightningBolt[b].y);
          }
          ctx.stroke();
          ctx.restore();
        }

        canvasAnimId = requestAnimationFrame(step);
      }

      canvasAnimId = requestAnimationFrame(step);
    }

    // =========================================================================
    // WEATHER LOGO 3D PARALLAX, DRAG & TOSS PHYSICS SIMULATION
    // =========================================================================
    const logoSphere = document.getElementById('logoSphere');
    const chamberCard = document.getElementById('chamberCard');
    const podSpecular = document.getElementById('podSpecular');

    let isDraggingLogo = false;
    let isFlyingLogo = false;
    let logoRafId = null;

    let posX = 0, posY = 0;
    let vx = 0, vy = 0;
    let rot = 0;

    let startX = 0, startY = 0;
    let initialX = 0, initialY = 0;
    let history = [];

    if (chamberCard && logoSphere) {
      chamberCard.addEventListener('mousemove', (e) => {
        if (isDraggingLogo || isFlyingLogo) return;
        const rect = chamberCard.getBoundingClientRect();
        const normX = (e.clientX - rect.left) / rect.width - 0.5;
        const normY = (e.clientY - rect.top) / rect.height - 0.5;

        logoSphere.style.transform = `perspective(800px) rotateY(${normX * 22}deg) rotateX(${-normY * 22}deg) translate3d(${normX * 8}px, ${normY * 8}px, 0)`;
        if (podSpecular) {
          podSpecular.style.transform = `translate3d(${-normX * 18}px, ${-normY * 12}px, 0)`;
        }
      });

      chamberCard.addEventListener('mouseleave', () => {
        if (isDraggingLogo || isFlyingLogo) return;
        logoSphere.style.transform = 'perspective(800px) rotateY(0deg) rotateX(0deg) translate3d(0, 0, 0)';
        if (podSpecular) podSpecular.style.transform = '';
      });
    }

    if (logoSphere) {
      logoSphere.addEventListener('contextmenu', (e) => e.preventDefault());
      logoSphere.addEventListener('dragstart', (e) => e.preventDefault());

      function getCoords(e) {
        if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        return { x: e.clientX, y: e.clientY };
      }

      function startDragLogo(e) {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();

        if (logoRafId) {
          cancelAnimationFrame(logoRafId);
          logoRafId = null;
        }

        isFlyingLogo = false;
        isDraggingLogo = true;

        const c = getCoords(e);
        startX = c.x;
        startY = c.y;
        initialX = posX;
        initialY = posY;

        history = [{ x: c.x, y: c.y, time: performance.now() }];
        logoSphere.classList.add('is-dragging');
        logoSphere.style.transition = 'none';

        triggerWeatherSurge(false);
      }

      function onDragLogo(e) {
        if (!isDraggingLogo) return;
        if (e.cancelable) e.preventDefault();

        const c = getCoords(e);
        const dx = c.x - startX;
        const dy = c.y - startY;

        posX = initialX + dx;
        posY = initialY + dy;

        rot = dx * 0.15;
        logoSphere.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${rot}deg)`;

        const now = performance.now();
        history.push({ x: c.x, y: c.y, time: now });
        if (history.length > 5) history.shift();
      }

      function endDragLogo(e) {
        if (!isDraggingLogo) return;
        isDraggingLogo = false;
        logoSphere.classList.remove('is-dragging');

        const now = performance.now();
        const recent = history.filter(h => now - h.time < 120);

        if (recent.length >= 2) {
          const first = recent[0];
          const last = recent[recent.length - 1];
          const dt = (last.time - first.time) / 1000;
          if (dt > 0.015) {
            vx = (last.x - first.x) / dt * 0.014;
            vy = (last.y - first.y) / dt * 0.014;
          } else {
            vx = 0; vy = 0;
          }
        } else {
          vx = 0; vy = 0;
        }

        const speed = Math.hypot(vx, vy);
        if (speed > 1.5) {
          isFlyingLogo = true;
          startLogoPhysics();
        } else {
          posX = 0; posY = 0; rot = 0;
          logoSphere.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          logoSphere.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
        }
      }

      function startLogoPhysics() {
        if (logoRafId) cancelAnimationFrame(logoRafId);

        function loop() {
          if (!isFlyingLogo) return;

          posX += vx;
          posY += vy;
          rot += vx * 0.2;

          vx *= 0.96;
          vy *= 0.96;

          const cardRect = chamberCard ? chamberCard.getBoundingClientRect() : { width: 800, height: 450 };
          const maxExtentX = (cardRect.width / 2) - 60;
          const maxExtentY = (cardRect.height / 2) - 60;

          if (posX > maxExtentX) {
            posX = maxExtentX;
            vx = -vx * 0.72;
            playWeatherAcoustic('bounce');
          } else if (posX < -maxExtentX) {
            posX = -maxExtentX;
            vx = -vx * 0.72;
            playWeatherAcoustic('bounce');
          }

          if (posY > maxExtentY) {
            posY = maxExtentY;
            vy = -vy * 0.72;
            playWeatherAcoustic('bounce');
          } else if (posY < -maxExtentY) {
            posY = -maxExtentY;
            vy = -vy * 0.72;
            playWeatherAcoustic('bounce');
          }

          logoSphere.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${rot}deg)`;

          if (Math.hypot(vx, vy) < 0.25) {
            isFlyingLogo = false;
            posX = 0; posY = 0; rot = 0;
            logoSphere.style.transition = 'transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            logoSphere.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
            return;
          }

          logoRafId = requestAnimationFrame(loop);
        }

        logoRafId = requestAnimationFrame(loop);
      }

      logoSphere.addEventListener('mousedown', startDragLogo);
      window.addEventListener('mousemove', onDragLogo);
      window.addEventListener('mouseup', endDragLogo);

      logoSphere.addEventListener('touchstart', startDragLogo, { passive: false });
      window.addEventListener('touchmove', onDragLogo, { passive: false });
      window.addEventListener('touchend', endDragLogo);
      window.addEventListener('touchcancel', endDragLogo);
    }

    function triggerWeatherSurge(isTap = true) {
      if (isTap && (isDraggingLogo || isFlyingLogo)) return;

      const gyroRing = document.getElementById('gyroRing');
      const corona = document.getElementById('solarCorona');

      if (gyroRing) {
        gyroRing.style.transform = 'scale(1.18) rotate(45deg)';
        setTimeout(() => { gyroRing.style.transform = ''; }, 450);
      }

      if (corona) {
        corona.style.transform = 'translate(-50%, -50%) scale(1.35)';
        setTimeout(() => { corona.style.transform = 'translate(-50%, -50%) scale(1)'; }, 450);
      }

      spawnElementalSparks();
      playWeatherAcoustic(currentActiveMode);
    }

    function spawnElementalSparks() {
      if (!ctx || !canvas) return;
      const cx = canvas.width / 2;
      const cy = canvas.height * 0.35;

      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 3;
        particles.push({
          type: 'sun_dust',
          x: cx,
          y: cy,
          size: Math.random() * 4 + 2,
          speedX: Math.cos(angle) * spd,
          speedY: Math.sin(angle) * spd,
          alpha: 1
        });
      }
    }

    // Elemental Audio Synthesizer
    let weatherAudioCtx = null;
    function playWeatherAcoustic(mode) {
      try {
        if (!weatherAudioCtx) weatherAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (weatherAudioCtx.state === 'suspended') weatherAudioCtx.resume();
        const now = weatherAudioCtx.currentTime;

        if (mode === 'storm') {
          const osc = weatherAudioCtx.createOscillator();
          const gain = weatherAudioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.5);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain); gain.connect(weatherAudioCtx.destination);
          osc.start(now); osc.stop(now + 0.5);
        } else if (mode === 'snow') {
          [880, 1174.66, 1760].forEach((freq, idx) => {
            const osc = weatherAudioCtx.createOscillator();
            const gain = weatherAudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.05);
            gain.gain.setValueAtTime(0.1, now + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.25);
            osc.connect(gain); gain.connect(weatherAudioCtx.destination);
            osc.start(now + idx * 0.05); osc.stop(now + idx * 0.05 + 0.25);
          });
        } else if (mode === 'rain') {
          [520, 680, 920].forEach((freq, idx) => {
            const osc = weatherAudioCtx.createOscillator();
            const gain = weatherAudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.04);
            gain.gain.setValueAtTime(0.12, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.12);
            osc.connect(gain); gain.connect(weatherAudioCtx.destination);
            osc.start(now + idx * 0.04); osc.stop(now + idx * 0.04 + 0.12);
          });
        } else if (mode === 'bounce') {
          const osc = weatherAudioCtx.createOscillator();
          const gain = weatherAudioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(130, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain); gain.connect(weatherAudioCtx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } else {
          const osc = weatherAudioCtx.createOscillator();
          const gain = weatherAudioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain); gain.connect(weatherAudioCtx.destination);
          osc.start(now); osc.stop(now + 0.1);
        }
      } catch (_) {}
    }

    // =========================================================================
    // INITIALIZATION SEQUENCE
    // =========================================================================
    function initWeatherStudio() {
      resizeCanvas();
      applyAtmosphereMode('sunny', 1);
      const ind = document.getElementById('unitIndicator');
      if (ind) ind.textContent = currentTempUnit === 'C' ? '°C, km/h' : '°F, mph';
      searchWeather('Chennai');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWeatherStudio);
    } else {
      initWeatherStudio();
    }
  </script>

    // Metric Formatter Helpers
    function formatTemp(celsiusVal) {
      if (celsiusVal === undefined || celsiusVal === null || isNaN(celsiusVal)) return '--°';
      const c = Number(celsiusVal);
      if (currentTempUnit === 'F') {
        return `${Math.round((c * 9 / 5) + 32)}°F`;
      }
      return `${Math.round(c)}°C`;
    }

    function formatSpeed(kmhVal) {
      if (kmhVal === undefined || kmhVal === null || isNaN(kmhVal)) return '--';
      const kmh = Number(kmhVal);
      if (currentTempUnit === 'F') {
        return `${Math.round(kmh * 0.621371)} mph`;
      }
      return `${Math.round(kmh)} km/h`;
    }

    function toggleTempUnit() {
      currentTempUnit = currentTempUnit === 'C' ? 'F' : 'C';
      localStorage.setItem('aibots_weather_unit', currentTempUnit);
      const ind = document.getElementById('unitIndicator');
      if (ind) ind.textContent = currentTempUnit === 'C' ? '°C, km/h' : '°F, mph';
      
      if (currentActiveMode === 'auto' && activeWeatherData) {
        renderAllWeatherData(activeWeatherData, activeAirQualityData);
      } else {
        setWeatherMode(currentActiveMode);
      }
    }

    // =========================================================================
    // INTERACTIVE AUTO-SUGGEST SEARCH MENU
    // =========================================================================
    function handleCityInput(val) {
      const btn = document.getElementById('clearSearchBtn');
      if (btn) btn.style.display = val ? 'block' : 'none';
      showCitySuggestions(val);
    }

    function showCitySuggestions(query = '') {
      const dropdown = document.getElementById('citySuggestDropdown');
      if (!dropdown) return;

      const q = (query || (document.getElementById('cityInput') ? document.getElementById('cityInput').value : '')).toLowerCase().trim();
      const keys = Object.keys(CITY_DATABASE);
      let matches = [];

      if (!q) {
        // Show Top Trending Global & Indian Cities
        const featured = ['chennai', 'mumbai', 'delhi', 'bengaluru', 'london', 'new york', 'tokyo', 'dubai', 'paris', 'singapore', 'berlin', 'madrid'];
        matches = featured.map(k => ({ key: k, ...CITY_DATABASE[k] })).filter(Boolean);
      } else {
        // Search by city key or full name
        matches = keys.filter(k => {
          const item = CITY_DATABASE[k];
          return k.includes(q) || item.name.toLowerCase().includes(q);
        }).slice(0, 8).map(k => ({ key: k, ...CITY_DATABASE[k] }));
      }

      currentSuggestions = matches;
      highlightedSuggestIndex = -1;

      if (matches.length === 0) {
        dropdown.innerHTML = `
          <div class="suggest-header"><span>Search Worldwide</span> <span style="font-size:0.75rem;">Press Enter to search via Global Telemetry</span></div>
          <div class="suggest-item" onclick="searchWeather(document.getElementById('cityInput').value)">
            <div class="suggest-main">
              <i class="fas fa-magnifying-glass suggest-icon"></i>
              <div>
                <span class="suggest-city">Search "${query}"</span>
                <span class="suggest-country">Worldwide Live Satellites</span>
              </div>
            </div>
            <span class="suggest-temp"><i class="fas fa-arrow-right"></i></span>
          </div>
        `;
        dropdown.style.display = 'block';
        return;
      }

      let htmlOut = `<div class="suggest-header"><span>${q ? 'Matching Locations' : '🔥 Popular Destinations'}</span> <span style="font-size:0.72rem;">${matches.length} found</span></div>`;
      matches.forEach((m, idx) => {
        const parts = m.name.split(',');
        const cityOnly = parts[0].trim();
        const countryOnly = parts.slice(1).join(',').trim();
        htmlOut += `
          <div class="suggest-item" data-index="${idx}" onclick="selectSuggestedCity('${m.name.replace(/'/g, "\\'")}')">
            <div class="suggest-main">
              <i class="fas fa-location-dot suggest-icon"></i>
              <div>
                <span class="suggest-city">${cityOnly}</span>
                <span class="suggest-country">${countryOnly}</span>
              </div>
            </div>
            <span class="suggest-temp">${formatTemp(m.temp)}</span>
          </div>
        `;
      });

      dropdown.innerHTML = htmlOut;
      dropdown.style.display = 'block';
    }

    function hideCitySuggestions() {
      setTimeout(() => {
        const dropdown = document.getElementById('citySuggestDropdown');
        if (dropdown) dropdown.style.display = 'none';
      }, 220);
    }

    function selectSuggestedCity(fullCityName) {
      const inp = document.getElementById('cityInput');
      if (inp) inp.value = fullCityName;
      const dropdown = document.getElementById('citySuggestDropdown');
      if (dropdown) dropdown.style.display = 'none';
      searchWeather(fullCityName);
    }

    function handleSearchKeyDown(e) {
      const dropdown = document.getElementById('citySuggestDropdown');
      const isVisible = dropdown && dropdown.style.display === 'block';

      if (e.key === 'ArrowDown' && isVisible && currentSuggestions.length > 0) {
        e.preventDefault();
        highlightedSuggestIndex = (highlightedSuggestIndex + 1) % currentSuggestions.length;
        updateSuggestionHighlight();
      } else if (e.key === 'ArrowUp' && isVisible && currentSuggestions.length > 0) {
        e.preventDefault();
        highlightedSuggestIndex = (highlightedSuggestIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
        updateSuggestionHighlight();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (isVisible && highlightedSuggestIndex >= 0 && currentSuggestions[highlightedSuggestIndex]) {
          selectSuggestedCity(currentSuggestions[highlightedSuggestIndex].name);
        } else {
          if (dropdown) dropdown.style.display = 'none';
          searchWeather();
        }
      } else if (e.key === 'Escape') {
        if (dropdown) dropdown.style.display = 'none';
      }
    }

    function updateSuggestionHighlight() {
      document.querySelectorAll('.suggest-item').forEach((el, idx) => {
        if (idx === highlightedSuggestIndex) {
          el.classList.add('highlighted');
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.classList.remove('highlighted');
        }
      });
    }

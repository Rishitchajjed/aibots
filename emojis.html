  <style>
    .emoji-search-box {
      position: relative;
      margin-bottom: 20px;
    }
    .emoji-search-box input {
      width: 100%;
      padding: 14px 20px 14px 44px;
      font-size: 1rem;
      border-radius: var(--radius-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      outline: none;
      box-sizing: border-box;
      box-shadow: var(--shadow-sm);
    }
    .emoji-search-box input:focus { border-color: var(--primary); }
    .emoji-search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .emoji-cat-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .cat-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border-color: var(--primary);
      color: var(--primary);
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      max-height: 580px;
      overflow-y: auto;
    }
    .emoji-btn {
      aspect-ratio: 1;
      font-size: 1.6rem;
      background: var(--bg-primary);
      border: 1px solid transparent;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      user-select: none;
    }
    .emoji-btn:hover {
      transform: scale(1.2);
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
    }
    .recent-bar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .recent-bar span { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
    .recent-emojis { display: flex; gap: 6px; flex-wrap: wrap; }

    function renderEmojis(items) {
      const grid = document.getElementById('emojiGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:40px;">No matching emojis found.</div>';
        return;
      }

      items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'emoji-btn';
        btn.textContent = item.e;
        btn.title = `${item.e} (${item.tags.split(' ')[0]}) - Click to Copy`;
        btn.onclick = () => copyEmoji(item.e);
        grid.appendChild(btn);
      });
    }

      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterEmojis();
    }

    function filterEmojis() {
      const q = document.getElementById('emojiSearch').value.toLowerCase().trim();
      const filtered = EMOJI_DATA.filter(item => {
        const matchCat = currentCat === 'all' || item.cat === currentCat;
        const matchQuery = !q || item.tags.includes(q) || item.e.includes(q);
        return matchCat && matchQuery;
      });
      renderEmojis(filtered);
    }

    function copyEmoji(emoji) {
      navigator.clipboard.writeText(emoji).then(() => {
        // Save recent
        recents = [emoji, ...recents.filter(e => e !== emoji)].slice(0, 10);
        localStorage.setItem('aibots_recent_emojis', JSON.stringify(recents));
        renderRecents();

        // Toast feedback
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 20px; border-radius:999px; font-weight:700; font-size:0.9rem; z-index:9999; box-shadow:0 10px 25px rgba(0,0,0,0.3);';
        toast.innerHTML = `<span style="font-size:1.2rem; margin-right:6px;">${emoji}</span> Copied to clipboard!`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1800);
      });
    }

    function renderRecents() {
      const wrap = document.getElementById('recentWrap');
      const list = document.getElementById('recentList');
      if (recents.length === 0) {
        wrap.style.display = 'none';
        return;
      }
      wrap.style.display = 'flex';
      list.innerHTML = '';
      recents.forEach(e => {
        const btn = document.createElement('button');
        btn.style.cssText = 'background:transparent; border:none; font-size:1.3rem; cursor:pointer; padding:2px;';
        btn.textContent = e;
        btn.onclick = () => copyEmoji(e);
        list.appendChild(btn);
      });
    }

    renderEmojis(EMOJI_DATA);
    renderRecents();
  </script>
  <script src="js/app.js"></script>
</body>
</html>

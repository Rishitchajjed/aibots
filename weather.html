<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="ndzq-U-NLijgza_QqgQdcc2U3oMRoud_BT2ZZiwFREM">
  <meta name="google-site-verification" content="-Yb6Nx74gbZ3wRN5uP-Y8KKwDWlt1DPpxs4nA3PkE6M">
  <meta name="robots" content="index, follow">
  <title>Live Weather & 5-Day Forecast — AI Bots</title>
  <meta name="description" content="Check real-time weather conditions, temperature, humidity, wind speed, and 5-day forecasts for any city worldwide.">
  <meta name="keywords" content="weather forecast, live weather online, check temperature, 5 day weather forecast, ai bots weather">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="canonical" href="https://www.aibots.co.in/weather.html">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2L87FMQS3W');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .w-card { max-width: 740px; margin: 0 auto; }
    .w-search-row { display: flex; gap: 8px; margin-bottom: 24px; }
    .w-main-hero {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15));
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
    }
    .w-city-title { font-size: 1.8rem; font-weight: 800; margin: 0 0 4px; color: var(--text-primary); }
    .w-temp-huge {
      font-size: clamp(3rem, 10vw, 4.5rem);
      font-weight: 900;
      color: var(--primary);
      margin: 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .w-condition-text { font-size: 1.15rem; font-weight: 700; color: var(--text-secondary); }

    .w-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .w-metric-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
    }
    .w-metric-val { font-size: 1.2rem; font-weight: 800; color: var(--text-primary); margin-top: 4px; }
    .w-metric-lbl { font-size: 0.72rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }
    .f-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      text-align: center;
    }
    .f-day { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .f-icon { font-size: 1.6rem; color: var(--primary); margin: 6px 0; }
    .f-temp { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container" style="width: 100%;">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-link">
          <img src="logo.png" alt="AI Bots Logo" class="brand-logo-img">
          <span>AI Bots</span>
          <span class="brand-badge">Weather</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-house"></i> Hub</a>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container tool-page-wrapper">
    <div class="tool-header">
      <span class="tool-header-badge"><i class="fas fa-cloud-sun"></i> Atmospheric Data</span>
      <h1 class="tool-title">Live Weather & Forecast</h1>
      <p class="tool-desc">Real-time global weather conditions, forecasts, wind speed, humidity, and UV index.</p>
    </div>

    <div class="w-card">
      <div class="w-search-row">
        <input type="text" id="cityInput" class="form-control" placeholder="Enter city name (e.g. Mumbai, New York, London, Tokyo, Dubai)..." value="Mumbai" onkeydown="if(event.key==='Enter') searchWeather()">
        <button class="btn btn-primary" onclick="searchWeather()"><i class="fas fa-magnifying-glass"></i> Search</button>
        <button class="btn btn-secondary" onclick="useLocation()" title="Use My Current GPS Location"><i class="fas fa-location-crosshairs"></i></button>
      </div>

      <div class="w-main-hero" id="weatherHero">
        <div class="w-city-title" id="cityName">Mumbai, India</div>
        <div class="w-temp-huge">
          <i class="fas fa-sun" id="weatherIcon" style="color: #f59e0b;"></i>
          <span id="tempVal">31°C</span>
        </div>
        <div class="w-condition-text" id="conditionText">Clear Sky & Warm</div>
      </div>

      <!-- Key Metrics -->
      <div class="w-metrics-grid">
        <div class="w-metric-card">
          <div class="w-metric-lbl"><i class="fas fa-droplet" style="color:#0284c7;"></i> Humidity</div>
          <div class="w-metric-val" id="humVal">68%</div>
        </div>
        <div class="w-metric-card">
          <div class="w-metric-lbl"><i class="fas fa-wind" style="color:#10b981;"></i> Wind Speed</div>
          <div class="w-metric-val" id="windVal">14 km/h</div>
        </div>
        <div class="w-metric-card">
          <div class="w-metric-lbl"><i class="fas fa-cloud-rain" style="color:#6366f1;"></i> Rain Chance</div>
          <div class="w-metric-val" id="rainVal">10%</div>
        </div>
        <div class="w-metric-card">
          <div class="w-metric-lbl"><i class="fas fa-sun" style="color:#f59e0b;"></i> UV Index</div>
          <div class="w-metric-val" id="uvVal">6 (Mod)</div>
        </div>
      </div>

      <h3 style="font-size: 0.95rem; font-weight: 700; margin: 0 0 12px; color: var(--text-primary);">5-Day Outlook</h3>
      <div class="forecast-grid" id="forecastGrid"></div>
    </div>
  </main>

  <script>
    const WMO_CODES = {
      0: { text: 'Clear Sky', icon: 'fa-sun', color: '#f59e0b' },
      1: { text: 'Mainly Clear', icon: 'fa-sun', color: '#f59e0b' },
      2: { text: 'Partly Cloudy', icon: 'fa-cloud-sun', color: '#38bdf8' },
      3: { text: 'Overcast', icon: 'fa-cloud', color: '#94a3b8' },
      45: { text: 'Foggy', icon: 'fa-smog', color: '#94a3b8' },
      48: { text: 'Depositing Rime Fog', icon: 'fa-smog', color: '#94a3b8' },
      51: { text: 'Light Drizzle', icon: 'fa-cloud-rain', color: '#38bdf8' },
      61: { text: 'Slight Rain', icon: 'fa-cloud-rain', color: '#0284c7' },
      63: { text: 'Moderate Rain', icon: 'fa-cloud-showers-heavy', color: '#0284c7' },
      65: { text: 'Heavy Rain', icon: 'fa-cloud-showers-heavy', color: '#1e40af' },
      71: { text: 'Light Snow', icon: 'fa-snowflake', color: '#93c5fd' },
      80: { text: 'Rain Showers', icon: 'fa-cloud-showers-heavy', color: '#0284c7' },
      95: { text: 'Thunderstorm', icon: 'fa-bolt', color: '#eab308' }
    };

    async function searchWeather(city = '') {
      const q = city || document.getElementById('cityInput').value.trim() || 'Mumbai';
      try {
        // Geocode
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          alert("City not found. Please try another location.");
          return;
        }

        const loc = geoData.results[0];
        document.getElementById('cityName').textContent = `${loc.name}, ${loc.country || ''}`;

        // Fetch Weather
        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max&timezone=auto`);
        const wData = await wRes.json();

        renderCurrent(wData.current);
        renderDaily(wData.daily);
      } catch(e) {
        console.error(e);
      }
    }

    function renderCurrent(cur) {
      const wmo = WMO_CODES[cur.weather_code] || { text: 'Fair', icon: 'fa-cloud-sun', color: '#38bdf8' };
      document.getElementById('tempVal').textContent = `${Math.round(cur.temperature_2m)}°C`;
      document.getElementById('conditionText').textContent = wmo.text;
      
      const icon = document.getElementById('weatherIcon');
      icon.className = `fas ${wmo.icon}`;
      icon.style.color = wmo.color;

      document.getElementById('humVal').textContent = `${cur.relative_humidity_2m}%`;
      document.getElementById('windVal').textContent = `${Math.round(cur.wind_speed_10m)} km/h`;
      document.getElementById('rainVal').textContent = `${cur.precipitation} mm`;
    }

    function renderDaily(daily) {
      if (daily.uv_index_max) {
        document.getElementById('uvVal').textContent = `${Math.round(daily.uv_index_max[0])}`;
      }
      const grid = document.getElementById('forecastGrid');
      grid.innerHTML = '';

      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      for (let i = 0; i < Math.min(5, daily.time.length); i++) {
        const d = new Date(daily.time[i]);
        const dayName = i === 0 ? 'Today' : days[d.getDay()];
        const wmo = WMO_CODES[daily.weather_code[i]] || { text: 'Fair', icon: 'fa-cloud-sun', color: '#38bdf8' };
        const max = Math.round(daily.temperature_2m_max[i]);
        const min = Math.round(daily.temperature_2m_min[i]);

        const card = document.createElement('div');
        card.className = 'f-card';
        card.innerHTML = `
          <div class="f-day">${dayName}</div>
          <div class="f-icon"><i class="fas ${wmo.icon}" style="color:${wmo.color};"></i></div>
          <div class="f-temp">${max}° <span style="color:var(--text-muted); font-size:0.8rem;">${min}°</span></div>
        `;
        grid.appendChild(card);
      }
    }

    function useLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          try {
            const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`);
            const wData = await wRes.json();
            document.getElementById('cityName').textContent = `Current Location (${lat.toFixed(2)}°, ${lon.toFixed(2)}°)`;
            renderCurrent(wData.current);
            renderDaily(wData.daily);
          } catch(e) {}
        });
      }
    }

    searchWeather('Mumbai');
  </script>
  <script src="js/app.js"></script>
</body>
</html>

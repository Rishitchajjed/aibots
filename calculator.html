<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="keywords" content="online calculator, scientific calculator, math calculator online, free calculator with history, scientific math evaluator, ai bots calculator, ai bots, aibots, ai bots co in, aibots.co.in, Rishit Chajjed">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator — AI Bots</title>
<meta name="description" content="A free scientific calculator with keyboard support, calculation history, and memory functions.">

<link rel="stylesheet" href="css/theme.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2L87FMQS3W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-2L87FMQS3W');</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
<style>
  .calc-wrap{ display:grid; grid-template-columns: 1fr 260px; gap:18px; align-items:start; }
  @media (max-width: 760px){ .calc-wrap{ grid-template-columns: 1fr; } }

  .calc{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
  .calc-screen{ padding:22px 20px 18px; text-align:right; background:var(--surface-2); }
  .calc-expr{ font-family:var(--font-mono); font-size:14px; color:var(--muted); min-height:18px; word-break:break-all; }
  .calc-result{ font-family:var(--font-mono); font-size:clamp(28px,7vw,40px); font-weight:600; color:var(--ink); word-break:break-all; margin-top:4px; }
  .calc-mode-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); }
  .calc-mode-row .ab-row{ gap:6px; }
  .calc-pad{ display:grid; grid-template-columns: repeat(4,1fr); gap:1px; background:var(--border); }
  .calc-sci{ grid-template-columns: repeat(5,1fr); }
  .calc-btn{
    border:none; background:var(--surface); padding:18px 0; font-size:17px; font-family:var(--font-mono);
    cursor:pointer; color:var(--ink); transition:background .1s ease;
  }
  .calc-btn:hover{ background:var(--surface-2); }
  .calc-btn:active{ background:var(--accent-soft); }
  .calc-btn.op{ color:var(--accent); font-weight:600; }
  .calc-btn.fn{ font-size:13.5px; color:var(--ink-soft); }
  .calc-btn.eq{ background:var(--accent); color:#fff; font-weight:700; }
  .calc-btn.eq:hover{ background:var(--accent-dark); }
  .calc-btn.wide{ grid-column: span 2; }

  .hist-card h3{ margin:0 0 10px; font-size:15px; }
  .hist-list{ display:flex; flex-direction:column; gap:6px; max-height:420px; overflow:auto; }
  .hist-item{ padding:9px 10px; border-radius:9px; background:var(--surface-2); cursor:pointer; font-size:13px; }
  .hist-item:hover{ background:var(--accent-soft); }
  .hist-item .e{ color:var(--muted); font-family:var(--font-mono); font-size:11.5px; }
  .hist-item .r{ font-family:var(--font-mono); font-weight:600; }
  .hist-empty{ color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="ab-shell">
  <div class="ab-page-head">
    <h1>🧮 Calculator</h1>
    <p>Standard and scientific modes, full keyboard support, and a running history you can click to reuse.</p>
  </div>

  <div class="calc-wrap">
    <div class="calc">
      <div class="calc-mode-row">
        <div class="ab-row">
          <button class="ab-chip active" id="modeStd">Standard</button>
          <button class="ab-chip" id="modeSci">Scientific</button>
        </div>
        <button class="ab-btn ghost sm" id="degRad">DEG</button>
      </div>
      <div class="calc-screen">
        <div class="calc-expr" id="exprLine">&nbsp;</div>
        <div class="calc-result" id="resultLine">0</div>
      </div>

      <div class="calc-pad calc-sci ab-hidden" id="sciRow">
        <button class="calc-btn fn" data-fn="sin(">sin</button>
        <button class="calc-btn fn" data-fn="cos(">cos</button>
        <button class="calc-btn fn" data-fn="tan(">tan</button>
        <button class="calc-btn fn" data-fn="log(">log</button>
        <button class="calc-btn fn" data-fn="ln(">ln</button>
        <button class="calc-btn fn" data-fn="sqrt(">√</button>
        <button class="calc-btn fn" data-fn="^2">x²</button>
        <button class="calc-btn fn" data-fn="^">x^y</button>
        <button class="calc-btn fn" data-fn="(">(</button>
        <button class="calc-btn fn" data-fn=")">)</button>
        <button class="calc-btn fn" data-fn="pi">π</button>
        <button class="calc-btn fn" data-fn="e">e</button>
        <button class="calc-btn fn" data-fn="!">n!</button>
        <button class="calc-btn fn" data-fn="1/(">1/x</button>
        <button class="calc-btn fn" data-fn="%">%</button>
      </div>

      <div class="calc-pad">
        <button class="calc-btn fn" id="clearBtn">C</button>
        <button class="calc-btn fn" id="delBtn">⌫</button>
        <button class="calc-btn fn" id="ansBtn">Ans</button>
        <button class="calc-btn op" data-op="/">÷</button>

        <button class="calc-btn" data-num="7">7</button>
        <button class="calc-btn" data-num="8">8</button>
        <button class="calc-btn" data-num="9">9</button>
        <button class="calc-btn op" data-op="*">×</button>

        <button class="calc-btn" data-num="4">4</button>
        <button class="calc-btn" data-num="5">5</button>
        <button class="calc-btn" data-num="6">6</button>
        <button class="calc-btn op" data-op="-">−</button>

        <button class="calc-btn" data-num="1">1</button>
        <button class="calc-btn" data-num="2">2</button>
        <button class="calc-btn" data-num="3">3</button>
        <button class="calc-btn op" data-op="+">+</button>

        <button class="calc-btn" data-num="0">0</button>
        <button class="calc-btn" data-num=".">.</button>
        <button class="calc-btn fn" id="signBtn">±</button>
        <button class="calc-btn eq" id="eqBtn">=</button>
      </div>
    </div>

    <div class="ab-card hist-card">
      <h3>History</h3>
      <div class="hist-list" id="histList">
        <div class="hist-empty">Your calculations will show up here.</div>
      </div>
      <button class="ab-btn secondary sm ab-mt-16" id="clearHistBtn" style="width:100%">Clear history</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
abInitChrome('calculator');

const exprLine = document.getElementById('exprLine');
const resultLine = document.getElementById('resultLine');
const histList = document.getElementById('histList');
const sciRow = document.getElementById('sciRow');
const degRadBtn = document.getElementById('degRad');

let expr = '';
let lastAnswer = 0;
let degrees = true;
let history = JSON.parse(localStorage.getItem('ab-calc-history') || '[]');

function renderHistory(){
  if (!history.length){
    histList.innerHTML = '<div class="hist-empty">Your calculations will show up here.</div>';
    return;
  }
  histList.innerHTML = history.slice().reverse().map(h =>
    `<div class="hist-item" data-val="${h.result}"><div class="e">${h.expr}</div><div class="r">= ${h.result}</div></div>`
  ).join('');
  histList.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      expr = el.dataset.val;
      updateScreen();
    });
  });
}
renderHistory();

function updateScreen(){
  exprLine.textContent = expr ? formatDisplay(expr) : '\u00a0';
  try{
    if (expr.trim() !== ''){
      const val = evaluateExpr(expr, true);
      resultLine.textContent = val;
    } else {
      resultLine.textContent = '0';
    }
  }catch(e){
    resultLine.textContent = expr ? '…' : '0';
  }
}

function formatDisplay(s){
  return s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
}

function evaluateExpr(raw, preview){
  let e = raw
    .replace(/(\d+(\.\d+)?)!/g, (m,n)=>`factorial(${n})`)
    .replace(/%/g, '/100');
  if (degrees){
    e = e.replace(/\b(sin|cos|tan)\(/g, (m,f)=>`${f}((PI/180)*`);
  }
  const scope = { Ans: lastAnswer };
  const result = math.evaluate(e, scope);
  const num = typeof result === 'number' ? result : result.toString();
  const rounded = typeof num === 'number' ? Math.round(num * 1e10) / 1e10 : num;
  return rounded;
}

function pushDigit(d){ expr += d; updateScreen(); }
function pushOp(op){
  if (expr === '' && op !== '-') return;
  expr += op; updateScreen();
}

document.querySelectorAll('[data-num]').forEach(b=>{
  b.addEventListener('click', ()=> pushDigit(b.dataset.num));
});
document.querySelectorAll('[data-op]').forEach(b=>{
  b.addEventListener('click', ()=> pushOp(b.dataset.op));
});
document.querySelectorAll('[data-fn]').forEach(b=>{
  b.addEventListener('click', ()=>{ expr += b.dataset.fn; updateScreen(); });
});

document.getElementById('clearBtn').addEventListener('click', ()=>{ expr=''; updateScreen(); });
document.getElementById('delBtn').addEventListener('click', ()=>{ expr = expr.slice(0,-1); updateScreen(); });
document.getElementById('ansBtn').addEventListener('click', ()=>{ expr += 'Ans'; updateScreen(); });
document.getElementById('signBtn').addEventListener('click', ()=>{
  if (expr) { expr = expr.startsWith('-') ? expr.slice(1) : '-'+expr; updateScreen(); }
});
degRadBtn.addEventListener('click', ()=>{
  degrees = !degrees;
  degRadBtn.textContent = degrees ? 'DEG' : 'RAD';
  updateScreen();
});

document.getElementById('eqBtn').addEventListener('click', doEquals);
function doEquals(){
  if (expr.trim() === '') return;
  try{
    const result = evaluateExpr(expr, false);
    history.push({ expr: formatDisplay(expr), result: String(result) });
    if (history.length > 50) history.shift();
    localStorage.setItem('ab-calc-history', JSON.stringify(history));
    renderHistory();
    lastAnswer = result;
    resultLine.textContent = result;
    exprLine.textContent = formatDisplay(expr) + ' =';
    expr = String(result);
  }catch(e){
    resultLine.textContent = 'Error';
  }
}

document.getElementById('clearHistBtn').addEventListener('click', ()=>{
  history = [];
  localStorage.removeItem('ab-calc-history');
  renderHistory();
});

document.getElementById('modeStd').addEventListener('click', ()=>{
  sciRow.classList.add('ab-hidden');
  document.getElementById('modeStd').classList.add('active');
  document.getElementById('modeSci').classList.remove('active');
});
document.getElementById('modeSci').addEventListener('click', ()=>{
  sciRow.classList.remove('ab-hidden');
  document.getElementById('modeSci').classList.add('active');
  document.getElementById('modeStd').classList.remove('active');
});

window.addEventListener('keydown', (e)=>{
  if (/[0-9.]/.test(e.key)){ pushDigit(e.key); return; }
  if (['+','-','*','/'].includes(e.key)){ pushOp(e.key); return; }
  if (e.key === 'Enter' || e.key === '='){ e.preventDefault(); doEquals(); return; }
  if (e.key === 'Backspace'){ expr = expr.slice(0,-1); updateScreen(); return; }
  if (e.key === 'Escape'){ expr=''; updateScreen(); return; }
  if (e.key === '('||e.key===')'){ expr += e.key; updateScreen(); return; }
});
</script>
</body>
</html>
